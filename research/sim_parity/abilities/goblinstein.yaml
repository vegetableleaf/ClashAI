mechanic_prose: |
  [Section "Ability: Lightning Link" - VERBATIM]
  {{Quote|Electrifies the link, damaging any enemies that get near. Shocking!}}
  {{Champion Ability}}
  The Goblinstein has a special ability, accessible from the rightmost side of the screen just above
  the player's [[Cards|card]] slots in [[Basics of Battle|battle]]. After a 1-second delay, the
  Goblinstein activates his "Lightning Link", creating an electric link between him and Monster. It
  damages by shocking nearby targets every 0.5 seconds up to 2 tiles away. This ability deals reduced
  damage to the [[:Category:Tower Troop Cards|Crown Tower]]. If the Monster has already been
  defeated, it will drop an antenna on the ground which is what the Goblinstein's electric link will
  target when the ability is activated. The Lightning Link ability costs 2 [[Elixir]] to activate.

  [Lead section (card quote + intro paragraph) - VERBATIM]
  {{Quote|It's ALIVE! Monster lumbers towards enemy buildings while Doctor waits to spring the trap.
  At the press of a button, Doctor electrifies the link between himself and Monster, frying nearby
  enemies!}}
  "It spawns a single-target, air-targeting, medium-ranged, ground [[:Category:Troop Cards|troop]]
  with moderate hitpoints and low damage, and a single target, building-targeting, melee, ground
  troop with high hitpoints and low damage. The Goblinstein's attacks will stun a targeted unit for
  0.5 seconds. Being a Champion card, they will stay out of the player's card cycle, and only return
  once they are defeated. The Goblinstein's ability has him shoot an electric spark towards an
  antenna that is typically located on the Monster's head."
  [NOTE: the 'stay out of the player's card cycle' sentence is the hand-lock text; per the 2026
  rework this page may be STALE on that point - see open_questions. It is quoted, not asserted.]

  [Section "Strategy" - VERBATIM, engine-relevant entries only]
  "The Doctor always spawns 1 tile in the opposite direction of the side of the [[Arenas|Arena]] in
  which the Monster is placed in. This allows for the Doctor and the Monster to be split into both
  lanes if played in the middle."
  "The Doctor can stun units like the [[Miner]] to get him to retarget to the Monster, saving hp on
  the tower."
  "Since the Doctor is the specific Champion, killing him would remove the 3 card cycle, and the
  ability."
  "However, when the Monster is defeated, an antenna is dropped in the Arena, what will be connected
  if the ability is used. This allows the ability to be used after the Monster is initially
  defeated."
  "Similarly to cards with area damage, the Lightning Link ability can hit infinite targets, and will
  hit everything within a 2 tile radius."
  "The [[Fisherman]] and [[Tornado]] can be a good way to puling the Monster quickly away, so the
  ability won't get too much damage on for example, the tower."
  "The Goblinstein can be placed as a defender in [[Clan Wars|Boat Battles]]. However, much like
  other {{Rarity|Champion}} cards, he is unable to use his ability."

  [Section "History" - VERBATIM, mechanics-bearing entries only]
  "On 17/10/2024, a maintenance break, decreased the Lightning Link's duration to 4 seconds (from 5
  seconds), its [[:Category:Crown Towers|Crown Tower]] Damage by 36%, and increased its cooldown to
  17 seconds (from 15 seconds)."
  "On 16/12/2024, the 2024 Quarter 4 Update, fixed a bug where Lightning Link would not deal reduced
  damage to the King Tower."
  "On 4/8/2026, a Balance Update, made it so that the Goblinstein would no longer have a cooldown
  timer in-between abilities. Instead, his ability will no be single use. The doctor's damage was
  increased by 47% and the ability DPS was decreased by 12%"

  [Section "Trivia" - VERBATIM, mechanics-bearing entries only]
  "The Goblinstein's Lightning Link does not inflict a stun on the enemies despite being an attack
  involving electricity. However, his regular attack is able to stun."
  "After the September 2025 update, a player can have multiple copies of the same Champion with the
  current active Champion having a crown symbol. However, the active Monster currently has no
  indicator."


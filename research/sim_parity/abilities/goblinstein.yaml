proposed_ability_kind: zone
# A tethered, persistent damage aura: for 4 s it ticks every 0.5 s against everything within 2 tiles
# of the Doctor-Monster link, hits unlimited targets, air and ground, with a reduced crown-tower
# value and no stun. Not a summon (the antenna is a fallback anchor left by the Monster's death, not
# something the ability creates) and not a buff. Nearest runner-up would be 'auto' only if the link
# geometry turns out to be an attached emitter rather than an area.

open_questions:
  - "COOLDOWN vs SINGLE-USE (the biggest one): the Lightning Link Attributes table says Ability Cooldown 17 sec, implying repeated use; the page's own History 4/8/2026 says Goblinstein 'would no longer have a cooldown timer in-between abilities. Instead, his ability will no [now] be single use.' Both values recorded (cooldown_s: 17, uses: null). If the History line is live, the engine wants uses: 1, cooldown: null. Owner ruling / in-game check needed."
  - "Are the vardefines pre- or post-4/8/2026? That update states Doctor damage +47% and ability DPS -12%, but dmg_11 is still 92 and link_11 still 107. If 92 already includes the buff the pre-change value was ~63; if it does not, the live value is ~135. Unresolvable from the file. The same doubt applies to link_11 (107 vs ~94 post -12%). Do NOT assume either."
  - "LINK GEOMETRY - the single most load-bearing unknown for the engine. Prose says the ability creates 'an electric link between him and Monster' and damages 'nearby targets ... up to 2 tiles away'. Two tiles from WHAT: (a) the line segment joining Doctor and Monster (a capsule), (b) each endpoint separately (two circles), or (c) only the Monster/antenna end? The Strategy line 'will hit everything within a 2 tile radius' reads like a circle but never names the centre. Is there a maximum link length beyond which the tether breaks?"
  - "Antenna fallback: on Monster death 'it will drop an antenna on the ground' which the link targets instead. Unstated - does the antenna drop always, or only if the ability has not yet been used? Does it have hitpoints / can it be destroyed or pulled? Is it targetable by enemies? Does it persist for the rest of the match? Does it drop exactly at the Monster's death position? Can Tornado/Fisherman move it?"
  - "What happens if the DOCTOR dies mid-ability - does the link end immediately? Strategy says killing the Doctor 'would remove ... the ability', but that is about future activations, not an active one."
  - "Tick timing: does the first shock land at activation (after the 0.933/1 s cast) or one full 0.5 s interval later? 8 ticks vs 9 over the 4 s window is a ~12% damage swing. The 8-tick figure in numbers is DERIVED, not stated."
  - "Cast delay conflict: prose '1-second delay' vs table Cast Time 0.933 sec. Does the 4 s duration start at button press or after the cast?"
  - "Crown Tower reduction: the page gives only the absolute pair 107 / 23 (a ~21.5% ratio, derived). No percentage is stated anywhere, and History 16/12/2024 shows the King Tower was once exempt from the reduction by bug. Confirm the reduction applies to King Tower and Princess Towers alike."
  - "Does Lightning Link damage friendly units, or enemy buildings/spawners? The page says 'any enemies that get near' and 'infinite targets' but never enumerates valid target classes beyond 'Air & Ground'."
  - "Doctor's 0.5 s stun: does it apply to buildings and Crown Towers, does it refresh on every hit (one stun per 1.8 s attack), and does it interrupt charges/abilities? Strategy only shows it forcing a Miner to retarget."
  - "Monster targets Buildings only - does it ever retarget onto troops (standard building-targeter behaviour, e.g. when blocked), and does it have any death effect? The page states none."
  - "Deploy geometry: 'The Doctor always spawns 1 tile in the opposite direction of the side of the Arena in which the Monster is placed in' - which body lands on the drop tile, and which axis is 'opposite direction'? Needed to reproduce the split-lane placement."
  - "HAND-LOCK / STALE TEXT: the lead says 'Being a Champion card, they will stay out of the player's card cycle, and only return once they are defeated' and Strategy says killing the Doctor 'would remove the 3 card cycle'. THIS PAGE MAY PREDATE THE 2026 REWORK in which champions are no longer removed from the hand while their body is alive. Recorded as quoted text only; do NOT implement a hand-lock from it."
  - "Multiple-copy handling (Trivia, September 2025 update): a player can have multiple copies of the same Champion on the field, the active one marked by a crown, and the active Monster has no indicator at all. Relevant to the sim's champion-instance bookkeeping and to any screen-reading agent."
  - "revid unknown - the archive is a bare wikitext dump carrying no revision metadata."

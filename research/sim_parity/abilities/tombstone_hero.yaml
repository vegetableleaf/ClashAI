open_questions:
  - "Cast delay / rise animation time for the Tomb Queen: not stated anywhere."
  - "Is the Tombstone building consumed/replaced when the Queen rises? Does remaining lifetime matter?"
  - "Queen combat profile is almost entirely missing: hit speed, movement speed, attack range, melee vs ranged, splash? Only HP 4224 / damage 422 (L11) and sight 7 exist."
  - "'Targeting buildings' (Heroes blurb): buildings-only like Hog Rider, or building-preference? Does she fight troops that block her?"
  - "Does the Queen deal full damage to Crown Towers (no reduction is stated)?"
  - "History 6/7/2026 says 'her continuous skeleton spawn was removed entirely' — 'her' = the Queen. Confirm the Queen no longer spawns skeletons, and that the building still spawns 2 per 4s wave."
  - "Does the hero Tombstone still death-spawn skeletons like the base card (snapshot: 4 on death)? The page never mentions death spawn."
  - "Queen lifetime: permanent until killed, or does she decay/expire?"
  - "Can the ability be used at any point in the 30s building lifetime, incl. while the tomb is under attack?"
  - "Snapshot cleanup: base tombstone spawn_interval_s 4.0 vs spawns.interval 3.5 disagree inside current_db_snapshot.json."


mechanic_prose: |
  [Tombstone/Hero, revid 437388: THE PAGE CONTAINS NO ABILITY PROSE — no "Ability:" section, no quote template.]
  [Heroes master page, revid 437509, section "List of Heroes", verbatim]
  "Regal Revive -
  Tomb Queen rises from the earth, targeting buildings."
  [Tombstone/Hero, section "Strategy", verbatim]
  "For the purposes of determining Elixir trades, the Heroic Tombstone and its activated Ability
  count as 8 Elixir, as the player must play the 3 Elixir Heroic Tombstone and then spend a
  further 5 on his Ability."
  "Do not place a Heroic Tombstone in a position where you would never place a regular Tombstone.
  This is because it can easily reveal to the opponent that the ability will be used,
  incentivizing them to destroy it before the ability can be used."


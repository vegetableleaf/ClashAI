# ---------------------------------------------------------------------------------------------
# REFLECTION RULESET -- assembled from the ability section and the Strategy/Trivia bullets. Every
# line below is sourced; nothing here is inferred from general knowledge.
# ---------------------------------------------------------------------------------------------
reflection_rules:
  what_is_reflected:
    - "ALL incoming projectile-based ranged attacks, returned to the attacker. Source: ability prose 'reflect all incoming projectile-based ranged attacks back to the said offender'."
    - "SPELLS are reflected, but NOT at the caster -- they always go to the closest opposing Crown Tower. Source: ability prose 'Spells are always reflected to the closest opposing Crown Tower'."
    - "Crown Tower arrows are reflectable. Source: Strategy 'The Monk can deflect arrows from Crown Towers.'"
    - "Piercing projectiles (Bowler, Executioner, Firecracker, Evolved Bomber, Magic Archer) are reflected at full damage and keep piercing. Source: Strategy."
    - "Royal Giant projectiles are reflectable even though the Royal Giant cannot target the Monk, if the Monk is near the projectile path. Source: Strategy."
    - "Non-damage projectiles are also reflected: Ram Rider's snare (slows her), Ice Wizard's slow (slows him and units next to him), Royal Chef's pancake (goes to the opposing King Tower and raises its Level by 1), Rune Giant's enhancement (enhances the Rune Giant herself). Source: Strategy + Trivia."
  what_is_NOT_reflected:
    - "Melee attacks. Source: ability prose 'He cannot protect nearby allies from melee attacks'."
    - "Non-projectile ranged attacks and non-projectile spells. Source: ability prose, same sentence."
    - "Inferno beams -- Inferno Dragon and Inferno Tower: 'neither their beams count as projectiles'. Source: Strategy."
    - "Instant/hitscan electric attacks -- Tesla, Zappies, Electro Dragon, Electro Wizard: 'their attacks are instant and not counted as projectiles'. Source: Strategy."
    - "Spirit cards: 'Spirit cards cannot be reflected by the Monk, despite being projectiles when attacking.' Source: Strategy. Corroborated by History 12/12/2022 for the Heal Spirit specifically."
    - "Fisherman's hook is not reflected but is NULLIFIED: 'fully stifled until the ability ends, forcing him to repeatedly charge his hook'. Source: Strategy."
    - "Firecracker's shrapnel: only her INITIAL projectile is reflected; the shrapnel is a separate second phase, so she deals no damage to the Monk. Source: Strategy."
  damage_of_reflected_projectiles:
    - "Reflected projectiles keep the ORIGINAL SOURCE's damage and do not rescale to the Monk's level. Source: Strategy 'Any projectile the Monk reflects with Pensive Protection will have the same damage as the initial source of the projectile, and will not scale up nor down to the Monk's level.'"
    - "Against CROWN TOWERS, reflected projectiles that splash or do not seek deal 25% of normal damage. Source: Strategy 'All reflected projectiles that can splash or don't seek after a target do 25% of their normal damage to Crown Towers.' Same 25% restated for reflected Crown Tower arrows."
    - "Reflected projectiles deal FULL damage to the original TROOP: 'if a Sparky shot is reflected and splashes the tower, the Tower will take 25% damage but the Sparky will take full damage.' Source: Strategy."
    - "EXCEPTION -- reflected Barbarian Barrel deals FULL Crown Tower damage: 'Unlike other spells, it will not deal reduced damage.' Source: Trivia. This contradicts the general 25% rule; see open_questions."
  ownership_and_travel:
    - "The Log and Barbarian Barrel, once reflected, 'are converted to fight for you, retain their full range and can even go further back than normal'. A reflected Barbarian Barrel spawns a FRIENDLY Barbarian. Source: Strategy."
    - "Reflection protects nothing standing in front of the Monk: 'anything placed in front of the Monk will not be saved from the reflection.' Source: Strategy."
    - "Reflected projectiles CAN activate the King Tower. Source: Strategy."
    - "Arrows are only fully reflected if the Monk is within 2 tiles of the exact center of the spell's casting area; otherwise 'some arrows may still kill some of the troops he is nearby'. Source: Strategy."
    - "Hunter's shot at point-blank is fully reflected and kills him regardless of level; at range 'he will not take any damage from the reflected projectiles because the projectiles de-spawn after a couple tiles'. Source: Strategy. No tile number is given for 'a couple'."
    - "In the arena corner, a reflected Log or Barbarian Barrel travels out of bounds; the Barbarian still spawns inside the arena. Source: Trivia."
    - "Two Monks reflecting the same spell: it is FULLY ABSORBED when it returns to the Monk who reflected first. Source: Trivia."
  other_effects_of_the_ability:
    - "-65% incoming damage from ALL sources for the duration, not just projectiles. Source: ability prose 'reducing all incoming damage he takes by 65%' + Pensive Protection Attributes table col 'Damage Reduced' = '-65%'."
    - "Immune to all knockback and to Tornado's pull for the duration. Source: ability prose 'The Monk is impervious to all forms of knockback and the Tornado's pull during Pensive Protection's duration.' See open_questions -- History 12/12/2025 may have made knockback immunity permanent."
    - "A cloned Monk 'will actually start walking with its ability activated'. Source: Strategy. (Cards.wikitext separately says cloned Champions cannot ACTIVATE abilities.)"
    - "If the Mother Witch is killed by the reflection, 'she ends up turning herself into a friendly Cursed Hog'. Source: Strategy."
    - "Reflection forces a Cannon Cart into its building phase. Source: Strategy."

# ---------------------------------------------------------------------------------------------
# BODY COMBO -- not the ability, but engine-relevant and its damage IS published.
# ---------------------------------------------------------------------------------------------
combo_rules:
  - "3-hit combo: hits 1 and 2 deal normal damage (140 @ L11); hit 3 deals COMBO DAMAGE (422 @ L11, vardefine combo_11) plus knockback."
  - "The 3rd hit's knockback lands 'even if the targeted troop is normally immune to knockback'. Source: lead paragraph."
  - "Killing a troop does NOT reset the combo counter. Source: Strategy, with the Rascals worked example."
  - "The combo knockback resets the Mighty Miner's damage ramp every third hit. Source: Strategy."

mechanic_prose: |
  [section "Ability: Pensive Protection", tagline quote, verbatim]
  "Takes less Damage while deflecting projectiles back at the opponent!"

  [section "Ability: Pensive Protection", body, verbatim]
  "The Monk has a special ability, accessible from the rightmost side of the screen just above the
  player's card slots in battle. After a 1-second delay, the Monk activates his 'Pensive
  Protection', reducing all incoming damage he takes by 65% and reflect all incoming
  projectile-based ranged attacks back to the said offender. Spells are always reflected to the
  closest opposing Crown Tower. He cannot protect nearby allies from melee attacks, non-projectile
  ranged attacks and non-projectile spells. The Monk is impervious to all forms of knockback and the
  Tornado's pull during Pensive Protection's duration. The ability goes on a 17-second cooldown
  after the duration ends. The Pensive Protection ability costs 1 Elixir to activate."

  [lead section (untitled intro paragraph), verbatim]
  "The Monk uses a 3-hit combo: the first 2 attacks deal normal damage, while the 3rd strike deals
  extra damage and knockback, even if the targeted troop is normally immune to knockback. Monk's
  ability reflects projectiles back to their source, as well as granting himself a large damage
  reduction for a short time."

  [section "Strategy", verbatim, the load-bearing reflection rules]
  "Although he can reflect Arrows, he will not fully reflect the spell unless he is in or within 2
  tiles of the exact center of the casting area for the spell; if this isn't the case, some arrows
  may still kill some of the troops he is nearby."
  "When The Log or Barbarian Barrel are reflected by his ability, they're converted to fight for
  you, retain their full range and can even go further back than normal. In the case of the
  Barbarian Barrel, a friendly Barbarian will spawn to assist. However, note that anything placed in
  front of the Monk will not be saved from the reflection."
  "All reflected projectiles that can splash or don't seek after a target do 25% of their normal
  damage to Crown Towers. For example, if a Sparky shot is reflected and splashes the tower, the
  Tower will take 25% damage but the Sparky will take full damage."
  "The Hunter's shot at point-blank will be fully reflected back at him by Pensive Protection,
  Instantly killing him regardless of level. However, if he is placed at a distance, he will not
  take any damage from the reflected projectiles because the projectiles de-spawn after a couple
  tiles"
  "The Firecracker's projectiles deal no damage to the Monk as he reflects them. This is because the
  projectiles themselves are split into two phases. The initial projectile and the shrapnel that
  explodes out of it afterward."
  "The Fisherman's hook is fully stifled until the ability ends, forcing him to repeatedly charge
  his hook."
  "The Ram Rider's snare gets reflected back and slows her."
  "The Ice Wizard will be slowed down by his own attack, as well as any unit next to him."
  "Even though the Royal Giant cannot target the Monk, his projectiles can still be reflected back,
  provided that the Monk is placed close to the path of the projectile."
  "Projectiles with piercing capabilities from the Bowler, Executioner, Firecracker, Evolved Bomber,
  and Magic Archer are reflected back at them for full damage and can damage the opposing Crown
  Towers if their positioning is used against them."
  "But keep in mind that these reflected projectiles can be used to activate the King Tower."
  "The Monk can deflect arrows from Crown Towers. However, Crown Tower projectiles being deflected
  back have their damage reduced to only 25%."
  "Both the Inferno Dragon and Inferno Tower can counter a Monk for positive or neutral trade, as
  neither their beams count as projectiles."
  "Cards such as Tesla, Zappies, Electro Dragon and Electro Wizard will not take reflected damage,
  since their attacks are instant and not counted as projectiles."
  "Spirit cards cannot be reflected by the Monk, despite being projectiles when attacking."
  "Unlike other air troops, Bats and the Phoenix do not attack with projectiles. Since the Monk
  cannot attack air troops, they will be able to defeat him unharmed."
  "If a Monk is cloned, the clone will actually start walking with its ability activated."
  "Any projectile the Monk reflects with Pensive Protection will have the same damage as the initial
  source of the projectile, and will not scale up nor down to the Monk's level."
  "Note that killing a troop does not reset the combo. This means that if he defeats 2 troops with a
  non-combo attack, the next attack will be a combo attack."
  "The Monk can be placed as a defender in Boat Battles. However, much like other Champion cards, he
  is unable to use his ability."

  [section "Trivia", verbatim, mechanically load-bearing]
  "Strangely, if both players had a Monk and used their abilities at the same time when a projectile
  spell is in-play, the time it goes back to the Monk who reflected it first will cause it to get
  fully absorbed."
  "If a Monk activates Pensive Protection in the corner of the Arena, then an opposing The Log or
  Barbarian Barrel will be deflected out of the Arena's bounds. However, in the case of the
  Barbarian Barrel, the Barbarian will spawn inside the Arena."
  "Thanks to the Monk, it is possible for a Barbarian Barrel to deal damage to Crown Towers by
  itself. Unlike other spells, it will not deal reduced damage."
  "It is possible for a Monk to deflect a pancake from a Royal Chef with his ability if the Monk is
  beside the troop targeted by the Royal Chef. The pancake will be deflected back to the opposing
  King's Tower, raising its Level by 1."
  "It is possible for a Monk to deflect an enhancement from a Rune Giant with his ability if the
  Monk is beside the troop targeted by the Rune Giant. The enhancement will be deflected back to the
  Rune Giant, enhancing herself."
  "The Monk in the Troop Rush game mode would appear visually larger, had a 2 Elixir ability, and
  the ability would also apply the damage reduction to any allied troops in a 4-tile radius around
  him. He had 3,800 hitpoints (instead of 2,000), an attack speed of 1.2 seconds (instead of 0.8
  seconds), a first attack speed of 0.4 seconds (instead of 0.2 seconds), and a Slow speed (instead
  of Medium)."

  [section "History", verbatim, ability-relevant entries]
  "On 2/11/2022, a maintenance break, increased the Pensive Protection's cooldown time to 17 seconds
  (from 15 seconds)."
  "On 12/12/2022, the Clashmas Update, made it so that the Heal Spirit's projectile can no longer be
  deflected by the Monk."
  "On 17/6/2024, the Goblin World Update, increased the Monk's combo damage by 0.47%. It also fixed
  certain issues with damage multipliers on the Monk."
  "On 31/3/2025, the 2025 Quarter 1 Update, fixed various issues related to Pensive Protection."
  "On 8/7/2025, a Balance Update, increased the Monk's hitpoints by 3%, and decreased the Pensive
  Protection's damage reduction boost to 65% (from 80%)."
  "On 24/11/2025, a Balance Update made Monk no longer immune to the knockback effects of Evolved
  Mega Knight and another Monk. He is also no longer immune to Fireball and Giant Snowball's
  knockbacks if those spells hit the Monk on the corner of their Area of Effect."
  "On 12/12/2025, a Balance Update made Monk immune to any knockback."
  [NOTE: this page's History ENDS at 12/12/2025 -- it carries NO 4/8/2026 entry, unlike the Mighty
  Miner and Little Prince pages. See open_questions.]


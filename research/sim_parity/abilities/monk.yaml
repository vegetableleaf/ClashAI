proposed_ability_kind: reflect

open_questions:
  - "THIS PAGE IS STALE ON SINGLE-USE. Its History ends at 12/12/2025 and carries NO 4/8/2026 entry, unlike the Mighty Miner and Little Prince pages. Both the Pensive Protection Attributes table and the ability prose still say 17 s cooldown. webcache/Version_History.wikitext, Balance Changes (4/8/2026), covers 'Champions and Heroes (minus Boss Bandit)' as a class, so the Monk IS single-use -- but the subject page never says so. Both values recorded above."
  - "THE DURATION COLUMN IS MISNAMED: 'Invulnerability Duration 4 sec'. The Monk is NOT invulnerable -- he takes 65% reduced damage. Does the 4 s bound (a) the damage reduction, (b) the projectile reflection, and (c) the knockback/Tornado immunity all together, or are they separately timed? The prose treats them as one window ('during Pensive Protection's duration') but never ties that to the 4 s figure."
  - "KNOCKBACK IMMUNITY CONFLICT: the ability prose scopes it to the ability ('impervious to all forms of knockback and the Tornado's pull DURING Pensive Protection's duration'), but History 12/12/2025 reads 'made Monk immune to any knockback' with no duration qualifier -- which, following the 24/11/2025 entry that stripped specific immunities, reads like a PERMANENT body trait restored. Both recorded; the archive does not settle whether knockback immunity is ability-scoped or always-on."
  - "NO GENERAL DEFINITION OF 'PROJECTILE'. The page gives an enumerated exception list (inferno beams, instant electric attacks, Spirits, Fisherman's hook, Firecracker shrapnel) but no rule. An engine needs a per-card is_reflectable_projectile flag; this page supplies only the exceptions it happens to mention, so the flag cannot be derived exhaustively."
  - "THE 25% CROWN-TOWER RULE HAS AN UNRESOLVED SCOPE AND AN EXPLICIT EXCEPTION. The rule is stated as applying to 'reflected projectiles that can splash or don't seek after a target'. What happens when a SEEKING SINGLE-TARGET projectile is reflected into a Crown Tower -- full damage, or 25%? Never stated. And Trivia explicitly exempts the Barbarian Barrel: 'Unlike other spells, it will not deal reduced damage.' Two rules in direct tension."
  - "ARROWS PARTIAL REFLECTION IS NOT QUANTIFIED. 'he will not fully reflect the spell unless he is in or within 2 tiles of the exact center of the casting area; if this isn't the case, some arrows may still kill some of the troops he is nearby.' Is this a binary all-or-nothing gate at 2 tiles, or a per-arrow geometric test? 'Some arrows' implies the spell is modelled as multiple sub-projectiles, but no count or falloff is given."
  - "HUNTER DESPAWN DISTANCE IS NOT PUBLISHED: 'the projectiles de-spawn after a couple tiles'. No number. This is the general question of whether REFLECTED projectiles inherit the source's range budget, restart it, or keep the remaining distance -- none of which the page states."
  - "REFLECTED PROJECTILE ORIGIN AND RETARGETING: does a reflected projectile spawn at the Monk's position and travel back along the incoming vector, and can it acquire NEW targets en route? Piercing ones evidently can ('In the case of the Bowler, the knockback will be used against his fellow troops'), but the general rule is unstated."
  - "IS THE PROJECTILE CONSUMED OR DUPLICATED BY REFLECTION? The two-Monk Trivia case ('it goes back to the Monk who reflected it first will cause it to get fully absorbed') implies a single travelling entity that can be absorbed, but the page never states this as a rule."
  - "DOES THE -65% APPLY TO DAMAGE THE MONK STILL TAKES FROM PARTIALLY-REFLECTED SOURCES, e.g. Firecracker shrapnel or off-center Arrows? Prose says 'all incoming damage', so presumably yes, but the reflection and reduction interaction is never spelled out."
  - "CAN THE MONK ATTACK AND MOVE DURING PENSIVE PROTECTION? Never stated. Nothing on the page says he stops, and the cloned-Monk Trivia ('will actually start walking with its ability activated') implies movement is allowed -- but that is an inference from a Clone edge case, not a rule."
  - "COMBO DAMAGE SEMANTICS: is 422 a REPLACEMENT for the 140 on the 3rd hit, or is it 140 + 422? The statistics table lists 'Damage' and 'Combo Damage' as separate columns with no relation stated. (Replacement is the natural reading of 'the 3rd strike deals extra damage', but 'extra' is exactly the ambiguous word.)"
  - "COMBO COUNTER PERSISTENCE: killing a troop does not reset it (stated). Not stated: whether it resets on TARGET SWITCH, on the Monk being stunned/knocked back, on the ability being used, or on him losing his target and re-acquiring."
  - "TROOP RUSH TRIVIA QUOTES A BASE HP OF 2,000, but the current vardefine hp_11 is 2214. The 2,000 is almost certainly the Monk's HP at the time that game mode ran (pre-5/3/2024 +7.5% and pre-8/7/2025 +3%), not a live value. Both recorded; do NOT use the Troop Rush block for ladder stats -- it also has a 4-tile ALLY damage-reduction aura that the ladder ability does not have."
  - "CLONE INTERACTION IS CONTRADICTORY ACROSS PAGES: this page's Strategy says a cloned Monk 'will actually start walking with its ability activated', while webcache/Cards.wikitext says 'Cloned Champion troops cannot use abilities. Activating an ability while a cloned Champion is on the arena will only trigger it for the original troop.' Reconcilable if the clone INHERITS an already-active buff rather than activating one, but neither page says that."
  - "AIR TARGETING: the Monk cannot ATTACK air, but can he REFLECT projectiles from air units? Strategy implies yes for projectile-firing air troops and specifically notes Bats and Phoenix are safe only because they do not use projectiles. Not stated as a rule."
  - "Collision radius / mass: not published on this page."
  - "Ability uses: per BODY or per MATCH? Not stated by this page or Version_History.wikitext."
  - "CHAMPION HAND/CYCLE STATE -- NOT AN ISSUE HERE: this page contains no hand-lock text. For the record, the archived source for the rework is webcache/Version_History_2025.wikitext, '2025 Quarter 3 Update (29/9/2025)', section 'Champion Rework': 'Champions will not bring 3-card cycle anymore: they come back to the player's cycle like any other card.' NOTE the date -- 29/9/2025, NOT 2026. The caller's framing of this as a '2026 rework' does not match the archive; the 4/8/2026 update was a separate change (multi-use -> single-use abilities)."


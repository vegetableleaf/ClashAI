mechanic_prose: |
  [Quote template under "Ability: Heroic Hurl"]
  "Throws the highest-hitpoint enemy troop in reach across the Arena"

  [Section "Ability: Heroic Hurl", verbatim]
  "The Hero Giant has a special ability accessible from whatever side of the screen was put
  in, just above the player's card slots in battle. After a 1-second delay and when a unit
  gets in range, the Hero Giant activates his "Heroic Hurl", grabbing the highest HP enemy
  troop within 2 tiles around him and throws them horizontally, also dealing damage to them
  when they land. While on the air, these troops are untargetable by ground-targeting troops
  and the Earthquake, but can still take damage from other spells. Air troops can be affected
  by the ability, but will take no damage when they land. The Heroic Hurl ability costs 2
  Elixir to activate."


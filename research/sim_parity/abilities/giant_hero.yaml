open_questions:
  - "Hero body HP: vardefine says 3968 (== base Giant), History (2/2/2026) says -3% (~3849). Which is live? -> in-game check"
  - "Throwback Range 9: units not stated (tiles?). Measured from the Giant or from the victim's position? Thrown 'horizontally' - always toward the other lane / straight across? -> in-game check"
  - "Stun 2 s (table only): does it apply on landing, or is it the untargetable flight time? Prose never mentions a stun. Are air troops stunned too (they take no landing damage)?"
  - "Activation gating: prose says the hurl happens 'after a 1-second delay and when a unit gets in range' - if no troop is within 2 tiles at activation, is the Elixir consumed? Does the ability wait/arm until a unit enters range, and for how long?"
  - "Cast delay: 0.933 s (table) vs 1 s (prose) - which is real?"
  - "'Highest HP': current HP or max HP? Ties broken how?"
  - "Can Champions / other Heroes be grabbed? Buildings explicitly are not affected (Strategy: 'the ability will do nothing against them')."
  - "During flight, only ground-targeting troops and Earthquake lose targeting; can towers and air-targeting troops still hit the victim?"
  - "First Hit Speed 0.5 s vs snapshot base load_time_s 1.0 - same metric or different? If same, hero first hit is much faster than base."

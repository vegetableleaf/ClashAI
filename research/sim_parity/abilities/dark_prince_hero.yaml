# rationale: the ability spawns a new autonomous building-targeting charger (Rhino) with
# spawn damage, while the body keeps fighting with apparently unchanged stats (page gives
# only one body stat-set). Composite transform+summon; summon chosen as primary since the
# Rhino is the new sim entity. If the dismount turns out to alter the body's own stats,
# reclassify toward transform_levelup.

open_questions:
  - Ability uses/cooldown -- page says NOTHING. Magic Archer and Balloon heroes were both made single-use on 4/8/2026; was Dark Prince included? In-game check.
  - Body hit speed 1.4 (table) vs 1.3 (vardefine, == base) -- which is live?
  - Do the mounted and dismounted Dark Prince share the single stat table shown, or does dismounting change his hit speed/damage/speed? Page gives one body table only.
  - Does the on-foot Dark Prince keep the shield (shield_11 applies before or after dismount, or both)?
  - '"Dismount doing damage" -- is the dismount AoE the Rhino spawn damage (307, radius unknown) or a separate body effect? Page never separates them.'
  - Rhino spawn damage radius -- table literally says "unknown" -> null.
  - Rhino "Charge Range 3" (table) vs "first charge distance ... 2.5 tiles" (History) -- same quantity out of date, or two different mechanics (windup distance vs detection range)?
  - Rhino lifetime -- does it persist until killed, or despawn? Not stated.
  - Rhino crown-tower modifier on normal/charge attacks (only the SPAWN damage vs crowns is documented as removed) -- unknown.
  - Charge Attributes table (body) -- does the dismounted Dark Prince retain his charge with these numbers, or is this the mounted state's charge? Ambiguous.
  - Hero charge splash 1.1 vs base snapshot charge_splash_radius_tiles 2.2 -- possible body delta or unit mismatch; needs base-page cross-check or in-game measure.

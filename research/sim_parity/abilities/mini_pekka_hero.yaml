open_questions:
  - "Uses / cooldown: NOT STATED anywhere on the page. Knight and Giant heroes were made single-use on 4/8/2026 (from 20 s / 14 s cooldowns); this page has no such History entry. Is Breakfast Boost single-use, on cooldown, or repeatable? -> in-game check"
  - "Hero body HP: vardefine says 1433 (== base Mini P.E.K.K.A.), History (12/1/2026) says -3% (~1390). Which is live? -> in-game check"
  - "Heal 30% - of MAX hitpoints or missing hitpoints? Strategy's 'healing 30% of his hitpoints' suggests max. Is the heal computed before or after the new Levels raise max HP? -> in-game check"
  - "Cast delay: 0.933 s (table) vs 1 s (prose) - which is real?"
  - "Meter accrual: are passive time (22 s/meter) and per-attack progress (10 s/attack) additive on one clock? Does partial-meter progress count for anything at cast, or only full meters?"
  - "Do gained Levels scale HP and damage by the standard x1.1 per level (bold rows 17-21 of the level table imply yes)? Do the extra Levels persist for the body's remaining lifetime?"
  - "Is there a hard level cap (table stops at 21 = 16+5, but Strategy describes +7 total via Royal Chef + Mirror)?"
  - "First Hit Speed 0.5 s vs snapshot base load_time_s 1.1 - same metric or different? If same, hero first hit is much faster than base."

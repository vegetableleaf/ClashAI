mechanic_prose: |
  [Quote template under "Ability: Breakfast Boost"]
  "Eats pancakes to level up. The longer you wait, the more pancakes he cooks!"

  [Section "Ability: Breakfast Boost", verbatim]
  "The Heroic Mini P.E.K.K.A. has a special ability accessible from whatever side of the
  screen was put in, just above the player's card slots in battle. After a 1-second delay,
  the Mini P.E.K.K.A. activates his "Breakfast Boost", immediately eats all the pancakes he
  cooked, granting him extra Levels and healing himself for 30%.

  Heroic Mini P.E.K.K.A. can constantly gain progress for his pancake meters. He will need
  22 seconds to get one pancake meter filled, but he can also get 10 seconds of progress
  with every attack. Every filled pancake meter increases the Levels gained when his ability
  is used by 1, except the last meter grants 2 extra Levels. With no meters, the Heroic Mini
  P.E.K.K.A. will gain 1 Level, but with a maximum of 3 meters, he can gain 5 Levels. The
  amount of meters the Heroic Mini P.E.K.K.A. has can be seen in a golden bar above his
  hitpoint bar.The Breakfast Boost ability costs 1 Elixir to activate."


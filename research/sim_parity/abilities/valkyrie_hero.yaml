proposed_ability_kind: buff_self
# rationale: self-buff for 3.5 s — rapid AoE hits (0.25 s, radius 2.5), 15% damage reduction,
# claimed move-speed increase. The lone 'Dash Distance 5.5' stat hints at a dash_chain-like
# component the prose never describes; kept buff_self pending in-game check.

open_questions:
  - "Move-speed boost: Heroes prose says 'increasing her movement speed' but the ability table lists Speed = Medium (60), identical to her base speed. Does a boost exist, and how big? (in-game check)"
  - "Dash Distance 5.5: no prose on either page mentions a dash. Does activating Wild Whirlwind trigger a dash (direction? target?), or is 5.5 something else entirely? (in-game check)"
  - "Damage application: is Ability Damage 97 (lvl 11) dealt as a hit every 0.25 s in the 2.5-tile radius for the full 3.5 s (~14 ticks), and does it replace her normal 266 @ 1.5 s attack during the spin? Not stated. (in-game check)"
  - "Does the -50% Crown Tower Damage apply only to the ability's spin damage, or to all her damage while the ability is active?"
  - "Does the 15% damage reduction apply to all damage sources (spells included)?"
  - "cast_delay_s and interruptibility (can she be stunned/knocked back mid-whirl?) are not stated."
  - "cooldown_s not stated; presumed irrelevant since the 4/8/2026 balance made every ability single-use — confirm there is truly no re-use path."
  - "Page quality: Valkyrie/Hero intro contains a stray fragment '** m.' and its History section is empty (the 4/8/2026 single-use change is only on the Heroes page); the stub may lag behind in-game values."

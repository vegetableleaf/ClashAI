release_date: "2026-08-03"   # infobox "August 3 2026"; corroborated by Heroes#History "3/8/2026 ... August 2026 Update"

# The Valkyrie/Hero subpage is a stub: it carries the stat tables and vardefines but never
# names or describes the ability. Name + mechanic prose + single-use rule come from the
# "Heroes" page, fetched and archived the same day.
supplementary_sources:
  - page: Heroes
    revid: 437509
    fetched: "2026-08-25"
    cached: research/sim_parity/webcache/Heroes.wikitext

body_stat_deltas: >-
  none detected — every comparable body stat on the hero page equals the base-card snapshot
  (ledger/current_db_snapshot.json 'valkyrie'): hp lvl11 1907=1907, damage lvl11 266=266,
  hit speed 1.5=1.5, elixir 4=4, deploy time 1=1.0, range 1.2=1.2, splash radius 2=2.0,
  speed Medium=medium, count 1=1, target Ground=ground. The hero page additionally lists
  First Hit Speed 0.1 sec, which has no counterpart field in the snapshot (snapshot
  load_time_s 1.4 is a different measure), so it cannot be diffed against base.

ability:
  name: Wild Whirlwind        # source: Heroes page (revid 437509) List of Heroes table; NOT stated anywhere on Valkyrie/Hero
  elixir_cost: 3              # agrees across: Valkyrie/Hero infobox AbilityCost=3, Valkyrie/Hero ability table Cost, Heroes table Ability Cost
  uses: 1                     # source: Heroes#History, 4/8/2026 Balance Update "made every ability single-use" (applies to all heroes; Valkyrie/Hero's own History section is empty)
  cooldown_s: null            # not stated on either page; likely moot since abilities are single-use as of 4/8/2026
  cast_delay_s: null          # not stated on either page

mechanic_prose: |
  Heroes page (revid 437509), section "List of Heroes", Valkyrie row — the ability description:
    "'''Wild Whirlwind''' -
    Spins rapidly, dealing damage and increasing her movement speed while taking less damage."

  Heroes page (revid 437509), section "History":
    "* {{Balance|Nerf}} On 4/8/2026 the [[Version History#Balance Changes (4/8/2026)|Balance Update]] made every ability single-use"

  Heroes page (revid 437509), section "Summary" (generic hero-ability rules, sim-relevant):
    "They cost [[Elixir]] to cast, granting the last played Heroic cards their special ability
    depending on the Hero, and will only stay as long as the selected Hero that you want to use
    the ability of is alive."
    "When a Hero activates their ability, but did not start casting it before they are defeated,
    the Elixir spent on the ability will be refunded once they are defeated."

  Valkyrie/Hero page (revid 437412), infobox {{Quote}} (flavor only — the page has no mechanic prose):
    "Whirl Power! Hero Valkyrie has gone round and round the Arena, getting whipped into shape
    and chopping down troops with an axe that wont quit. Now, she's ready for her final test at
    the gates of Valkhalla."


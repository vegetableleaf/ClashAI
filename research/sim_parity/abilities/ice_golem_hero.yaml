mechanic_prose: |
  [Ability: Snowstorm — card quote]
  "Conjures a blizzard that damages and slows enemies."

  [Section "Ability: Snowstorm"]
  "The Hero Ice Golem has a special ability accessible from whatever side of the screen was put
  in, just above the player's card slots in battle. After a 1-second delay, the Hero Ice Golem
  activates his "Blizzard" ability, which generates a 4-tile aura radius that has 3 pulses, with
  each one slowing down enemy troops and dealing damage. The Snowstorm ability costs 2 Elixir to
  activate."

  [Section "Strategy", damage benchmark]
  "All 3 blast are enough to kill Goblins."


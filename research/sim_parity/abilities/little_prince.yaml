proposed_ability_kind: guardian
# Royal Rescue is a summon whose summoned unit (Guardienne) is PERMANENT and arrives via a damaging,
# knocking-back charge. `guardian` captures the persistent-second-body semantics; the charge itself
# is a dash_chain/throw_displace-shaped sub-event bolted onto the front of it.

open_questions:
  - "PUSHBACK CONFLICT WITHIN THIS PAGE: the ability prose says the charge knocks ground troops 'away by 0-2 tiles (depends on how close the unit is to the sweet spot)', but History 1/9/2025 says 'increased the Royal Rescue's pushback to 2.5 tiles (from 2 tiles)'. Both recorded above. The History entry is the later edit and 2.5 is likely current, meaning the prose's '0-2' was never updated -- but the archive does not settle it."
  - "The 'SWEET SPOT' IS NEVER DEFINED. Prose makes the pushback distance a function of 'how close the unit is to the sweet spot' but never says where that spot is (Guardienne's start? her end position? the midpoint of the 4-tile dash?) nor what the falloff curve is. An implementer cannot reproduce a graded 0-to-max knockback from this page."
  - "DOES THE CHARGE HIT BUILDINGS? The Royal Rescue Attributes table says Target = 'Ground', but the Card Mastery objective reads 'Hit a total of 500 Troops or buildings with Guardian's Charge Damage'. These are in tension. Buildings are ground entities, so it is likely yes, but the ability prose only ever says 'opposing ground troops'."
  - "CHARGE TRAVEL SPEED IS NOT PUBLISHED. The dash covers 4 tiles, but no dash speed or dash duration appears anywhere (the Royal Rescue Attributes table has only Cost, Dash Range, Target, Cast Time, Ability Cooldown). Cannot model how long enemies are exposed to the charge hitbox."
  - "GUARDIENNE'S SPAWN POSITION IS ONLY QUALITATIVE: 'charge directly in front of the Little Prince'. No offset in tiles, and no rule for what 'in front' means when he has no current target or is facing backwards. Nor is it stated where she ends up after the 4-tile dash -- at the far end, or back at the Prince."
  - "IS THE CHARGE DAMAGE ONE HIT PER ENEMY, OR CAN IT MULTI-HIT? Prose implies a single sweep, and the Goblin Barrel bullet says she can 'take out all three Goblins at once due to her charge', confirming multi-TARGET. But whether an individual unit can be hit twice by one charge is not stated."
  - "COOLDOWN CONFLICT WITHIN THIS PAGE: the Royal Rescue Attributes table and the ability prose both say 30 s, but the page's own History (4/8/2026) and Version_History.wikitext say the cooldown was removed and the ability is single use. Both values recorded; treat 30 s as stale."
  - "Does vardefine guard_dmg_11 = 217 already include the 4/8/2026 '+7% Guardian Melee Damage'? And does dmg_11 = 104 include the 12/1/2026 '+5%'? The page never states which side of a balance change its stat table sits on."
  - "ABILITY DURATION IS NOT PUBLISHED. Prose says the cooldown starts 'after the duration ends' but Guardienne is explicitly permanent ('stays in the arena until she's taken out'), so there is no duration to read. The phrase is likely boilerplate copied across all four champion pages."
  - "TWO TIMING NUMBERS WITH NO STATED RELATIONSHIP: prose 'After a 1-second delay' vs table 'Cast Time 0.944 sec'. Cards.wikitext notes 'The abilities adhere to the server's 1 second deployment delay', which may explain the 1 s, but the relationship to 0.944 s is unstated. Guardienne separately has her own 0.3 s Deploy Time -- is that additive on top?"
  - "WHAT HAPPENS TO GUARDIENNE WHEN THE LITTLE PRINCE DIES? The prose says only that she 'stays in the arena until she's taken out'. Strategy bullets describe killing the Prince and then luring Guardienne to a Mini P.E.K.K.A, which strongly implies she OUTLIVES him -- but this is never stated as a rule."
  - "SECOND ACTIVATION WHILE GUARDIENNE IS ALIVE: what happens? Largely moot under the single-use rule, but the Clone interaction is documented (History 13/11/2023 fixed 'Clone no longer creates two full health Guardiennes'), so the two-Guardienne state was reachable and its resolution is unspecified."
  - "GUARDIENNE'S HIT-SPEED / RAMP: she has a flat 1.2 s hit speed with a 0.5 s first hit -- no ramp. Confirmed by the single guard_atk_speed vardefine. No open issue, recorded for completeness."
  - "HIT-SPEED RAMP RESET RULES for the Little Prince are scattered and incomplete: prose says knockback and stun cards (The Log, Zap, Fireball, Giant Snowball, Bowler) reset it, History 14/12/2023 fixed 'hit speed would not reset after moving', and History 4/8/2026 grants a 0.3 s grace while moving. Not stated: whether a TARGET SWITCH resets it, whether the ramp decays gradually or drops straight to stage 1, and whether the 0.3 s grace resets or merely pauses the decay."
  - "MEGA KNIGHT MID-AIR INTERRUPT (Strategy): 'the Mega Knight's jump can be completely interrupted while mid-air, unlike other cards with knockback effects', but if he is 'already halfway through the trajectory ... he will erratically travel forward while mid-air onto the Little Prince'. Two different outcomes gated on an unstated fraction of the jump. Not implementable from this text."
  - "The charge 'could hit troops underground' was a BUG fixed on 13/11/2023 -- so underground units (Miner, Goblin Drill, Mighty Miner mid-escape) are NOT valid charge targets. Recorded as a negative rule; the current-state phrasing is absent."
  - "The Little Prince's OWN collision radius is not published (only Guardienne's 0.8)."
  - "Ability uses: per BODY or per MATCH? Not stated by this page or Version_History.wikitext."
  - "CHAMPION HAND/CYCLE STATE -- NOT AN ISSUE HERE: this page contains no hand-lock text. For the record, the archived source for the rework is webcache/Version_History_2025.wikitext, '2025 Quarter 3 Update (29/9/2025)', section 'Champion Rework': 'Champions will not bring 3-card cycle anymore: they come back to the player's cycle like any other card.' NOTE the date -- 29/9/2025, NOT 2026. The caller's framing of this as a '2026 rework' does not match the archive; the 4/8/2026 update was a separate change (multi-use -> single-use abilities)."


mechanic_prose: |
  [section "Ability: Royal Rescue", tagline quote, verbatim]
  "Guardienne charges into battle, dealing Charge Damage and pushing enemies back!"

  [section "Ability: Royal Rescue", body, verbatim]
  "The Little Prince has a special ability, accessible from the rightmost side of the screen just
  above the player's card slots in battle. After a 1-second delay, the Little Prince activates his
  'Royal Rescue',  causing Guardienne to charge directly in front of the Little Prince and knock
  opposing ground troops away by 0-2 tiles (depends on how close the unit is to the sweet spot)
  while also doing moderate damage. After the charge is completed, Guardienne stays in the arena
  until she's taken out. Guardienne's stats are comparable to a Knight, having slightly less health
  and slightly less damage with their rest of their stats being identical. The ability goes on a
  30-second cooldown after the duration ends. The Royal Rescue ability costs 3 Elixir to activate."

  [lead section (untitled intro paragraph), verbatim, ability sentence only]
  "The Little Prince's ability has him call upon a tank named Guardienne."

  [section "Strategy", verbatim, mechanically load-bearing bullets only]
  "Like The Log and the Monk, the knockback effect caused by the Royal Rescue ability can affect all
  ground troops. This makes him very effective against large tanks and can prevent a lot of damage
  done to Crown Towers."
  "Strangely enough, the Mega Knight's jump can be completely interrupted while mid-air, unlike
  other cards with knockback effects. ... However, if the Mega Knight is already halfway through the
  trajectory to jump onto the Little Prince, the Guardienne will knock him back, and he will
  erratically travel forward while mid-air onto the Little Prince."
  "It can also be used to reset the Mighty Miner's ramp up attack, saving a large tank from certain
  death, as well as sending the Mighty Miner in a less favorable position in case he wants to use
  his ability."
  "Cards with knockback and stun effects like The Log, Zap, Fireball, and Giant Snowball can reset
  his attack speed ramp up, making them good last-resort assist cards."
  "Although the Royal Rescue's range is 4 tiles, the Guardienne has an extra 0.8 tile collision
  radius, allowing her to reach slightly further, similar to an attack from the Executioner. This
  can allow her to reach certain ranged troops such as the Bowler and deal damage to them with the
  ability."
  "Minions can also work even if he activates his ability, as they are immune to Guardienne's damage
  and cannot be targeted by Guardienne."
  "The Little Prince can be used as a situation counter to the Goblin Barrel as activating his
  ability at the proper time and position will allow Guardienne to take out all three Goblins at
  once due to her charge."
  "The Little Prince can be placed as a defender in Boat Battles. However, much like other Champion
  cards, he is unable to use his ability."

  [section "History", 2026, verbatim]
  "On 4/8/2026, a Balance Update, made it so that the Little Prince would no longer have a cooldown
  timer in-between abilities. Instead, his ability will no be single use. The Little Prince will now
  maintain his charged-up Hit Speed for up to 0.3 seconds while moving. The Guardian Melee Damage
  was also increased by 7%"

  [section "History", ability-relevant entries, verbatim]
  "On 13/11/2023, a Minor Update, decreased the Royal Rescue's dash range to 4.5 tiles (from 5
  tiles). It also fixed a bug where Royal Rescue could hit troops underground and made it so that
  Clone no longer creates two full health Guardiennes when used at the right moment that Little
  Prince activates Royal Rescue."
  "On 17/11/2023, a maintenance break, increased the number of attacks required to change stages to
  3 (from 2) and decreased the Royal Rescue's pushback to 2.5 tiles (from 3.5 tiles)."
  "On 14/12/2023, a maintenance break, fixed a bug where the Little Prince's hit speed would not
  reset after moving."
  "On 3/1/2024, a Balance Update, decreased the Little Prince's damage by 9% and decreased the
  Guardienne's hitpoints by 11%."
  "On 5/3/2024, a Balance Update, decreased the Little Prince's range to 5.5 tiles (from 6 tiles).
  It also decreased the Royal Rescue's dash range to 4 tiles (from 4.5 tiles)."
  "On 17/6/2024, the Goblin World Update, decreased the Little Prince's hitpoints by 0.28% and his
  damage by 1%, decreased the Royal Rescue damage by 48.1%, its pushback to 2 tiles (from 2.5
  tiles), increased Guardienne's first attack time interval to 0.5 seconds (from 0.2 seconds), and
  decreased her damage by 0.5%."
  "On 3/6/2025, a Balance Update, increased the Guardienne's damage by 1%. It also increased the
  Royal Rescue's damage by 11%."
  "On 1/9/2025, a Balance Update, increased the Royal Rescue's pushback to 2.5 tiles (from 2 tiles).
  It also increased the Royal Rescue's damage by 11%."
  "On 3/11/2025, a Balance Update, increased the Guardienne's damage by 7%."
  "On 12/1/2026, a Balance Update, increased the Little Prince's damage by 5%."

  [section "Card Mastery", verbatim -- the ONLY statement that the charge can hit BUILDINGS]
  "Hit a total of 500 Troops or buildings with Guardian's Charge Damage"


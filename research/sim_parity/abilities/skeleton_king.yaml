proposed_ability_kind: soul_bank
# A death-counting resource (souls, cap 10) that converts on activation into a summon of 6-16
# clone-variant 1-HP Skeletons, sequenced one per 0.25 s in a circle around the caster.

open_questions:
  - "SPAWN RADIUS CONFLICT WITHIN THIS PAGE: the ability prose says 'in a 4-tile radius around himself', but History 24/10/2025 says 'decreased Soul Summoning's skeleton spawn radius to 3.5 tiles (from 4 tiles)'. The History entry is the later edit, so 3.5 is likely current and the prose was never updated -- but the archive does not settle it. Both values recorded above."
  - "THIS PAGE IS STALE ON SINGLE-USE. Its History ends at 24/10/2025 and carries NO 4/8/2026 entry, unlike the Mighty Miner and Little Prince pages. Both the Soul Summoning Attributes table and the ability prose still say 20 s cooldown. webcache/Version_History.wikitext, Balance Changes (4/8/2026), covers 'Champions and Heroes (minus Boss Bandit)' as a class, so the Skeleton King IS single-use -- but the subject page never says so. Both values recorded."
  - "WHAT DOES 'It continues, even if the Skeleton King dies' REFER TO? The sentence closes the paragraph about counting troop deaths, so it could mean (a) the SPAWN SEQUENCE finishes even if he is killed mid-summon, or (b) soul accrual continues after his death -- which is incoherent, since the lead paragraph scopes accrual to 'While the Skeleton King is on the field'. Reading (a) is the only sensible one, and it is corroborated by History 30/3/2022 having had to FIX a case where the summoning animation could be cancelled. But the page is genuinely ambiguous here and this is a real engine decision."
  - "THE GOBLIN GIANT EXCEPTION IS UNEXPLAINED: 'cards that make sub-troops ... do not count as a soul to it, but only the final forms of the troop, with Goblin Giant as an exception.' Exception in which direction -- do the Goblin Giant's backpack Spear Goblins DO grant souls (unlike other sub-troops), or does the Goblin Giant itself NOT grant one? The sentence supports either reading."
  - "DO THE SUMMONED SKELETONS HAVE A LIFETIME? Nothing on the page gives them a decay or despawn timer, and Strategy refers to 'leftover Skeletons from the ability' pushing into a lane, implying they persist until killed. Never stated as a rule."
  - "DO TOWER TROOPS / CROWN TOWERS COUNT AS SOULS WHEN DESTROYED? The rule is scoped to 'troops' and buildings are excluded, but Tower Troops (Tower Princess, Cannoneer, Dagger Duchess) sit in both categories. Not addressed."
  - "IS THE 1-HP SKELETON KILLED BY ANY NONZERO DAMAGE INCLUDING DOT TICKS AND ZERO-DAMAGE EFFECTS? Not stated. Their clone semantics ('behave identically to cloned Skeletons') pushes the question onto the Clone card, which is not in scope here."
  - "'random positions in the circle' -- uniform over the AREA of the disc, or on the RING at the radius? The word 'circle' is used, the word 'radius' is used, and the two readings give very different clustering. No distribution is specified. Also unspecified: whether spawn points avoid occupied tiles, water, or tower footprints."
  - "HOW LONG IS 'stopping in place momentarily'? The page gives a 1 s activation delay, a 0.933 s cast time, and a 0.25 s per-skeleton spawn cadence, but never says which of these he is immobilised for, nor whether he stops ATTACKING as well as moving."
  - "DOES THE SOUL BAR RESET ON ACTIVATION? Nothing on this page says. The only reset rule in the archive is from webcache/Version_History_2025.wikitext (29/9/2025): 'Skeleton King's soul bar resets during ability transference' -- i.e. when the ability moves to a newly-placed Champion. Whether spending the ability itself zeroes the bank is unstated (largely moot under single-use, but it decides whether souls keep accruing on a spent body)."
  - "IS THE CANNON CART CLAIM STILL TRUE? Prose calls the Cannon Cart 'the only troop that cannot count as a soul' because it becomes a building. That was written before later card releases and this page's History has not been touched since 24/10/2025."
  - "THREE TIMING NUMBERS WITH NO STATED RELATIONSHIP: prose 'After a 1-second delay', table 'Cast Time 0.933 sec', and the 0.25 s spawn cadence. Does the first Skeleton appear at t=0.933, t=1.0, or t=1.25? Cards.wikitext notes 'The abilities adhere to the server's 1 second deployment delay', which may explain the 1 s but not the 0.933 s."
  - "DOES THE BODY'S SPLASH DAMAGE FALL OFF WITH DISTANCE inside the 1.3-tile radius? Not stated (no page in this archive states a falloff rule for any card)."
  - "MASS / PUSH FORCE IS NOT QUANTIFIED. Strategy asserts 'a suspiciously large hitbox' and 'a suspiciously high mass, and he can even push large troops such as a Giant, Electro Giant, or Golem', but the only number anywhere is the collision radius of 1 tile, and that appears only in History, not in a stat table."
  - "KNOCKBACK IMMUNITY: granted by History 4/11/2021 ('gave him knockback immunity') and never revoked in this page's History. It is NOT listed in any attributes table or in the ability section, so it is a permanent body trait sourced only from a History line."
  - "'Initial Spawn buff' (Trivia) is named but never explained -- no numbers, no duration, no effect described."
  - "Ability uses: per BODY or per MATCH? Not stated by this page or Version_History.wikitext."
  - "CHAMPION HAND/CYCLE STATE -- NOT AN ISSUE HERE: this page contains no hand-lock text. For the record, the archived source for the rework is webcache/Version_History_2025.wikitext, '2025 Quarter 3 Update (29/9/2025)', section 'Champion Rework': 'Champions will not bring 3-card cycle anymore: they come back to the player's cycle like any other card.' NOTE the date -- 29/9/2025, NOT 2026. The caller's framing of this as a '2026 rework' does not match the archive; the 4/8/2026 update was a separate change (multi-use -> single-use abilities). That same 29/9/2025 rework is also the ONLY archived source for the Skeleton King's soul-bar reset on ability transference."


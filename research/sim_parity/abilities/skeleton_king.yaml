# ---------------------------------------------------------------------------------------------
# THE SUMMONED UNIT. The ability spawns SKELETONS -- but a special variant with 1 HP that behaves
# like CLONED Skeletons. It has its own attributes table and its own vardefines.
# ---------------------------------------------------------------------------------------------
summoned_unit:
  identity: "Skeletons (clone-variant)"
  hp: 1                       # Soul Summoning Attributes table col "Skeleton Hitpoints" = 1;
                              # corroborated by prose "they only have 1 hitpoint"
  damage: 81                  # vardefine skel_dmg_11 (statistics table col "Skeleton Damage")
  hit_speed: 1.1              # vardefine skel_atk_speed; Skeleton Attributes table "Hit Speed"
  first_hit_speed: 0.5        # Skeleton Attributes table "First Hit Speed" (no vardefine)
  speed: "Fast (90)"          # Skeleton Attributes table "Speed"
  range: 0.5                  # Skeleton Attributes table "Range: Melee: Short (0.5)"
  targets: "Ground"           # Skeleton Attributes table "Target"
  transport: "Ground"         # Skeleton Attributes table "Transport"
  count: "6 to 16"            # Soul Summoning Attributes table col "Skeleton Count" = "6-16"
  clone_semantics: true       # prose "behave identically to cloned Skeletons, which means you can't
                              # clone them further with said card, and they only have 1 hitpoint"
  # NOTE: no Deploy Time column exists for the summoned Skeletons.

# ---------------------------------------------------------------------------------------------
# SOUL ECONOMY -- the whole point of the card. Fully enumerated from prose; every line is sourced.
# ---------------------------------------------------------------------------------------------
soul_rules:
  gain: "One soul per TROOP death while the Skeleton King is deployed, from EITHER side. Source: prose 'The number of Skeletons spawned is based on how many troops die (either from the player or the opponent) while he is deployed' and 'When a troop is vanquished while the Skeleton King is in the Arena, the Skeleton King gains a soul'."
  mapping: "0 souls -> 6 Skeletons; 10 souls (the cap) -> 16 Skeletons. Source: prose 'With no souls, the Skeleton King will spawn 6 Skeletons, but with a maximum of 10 souls, he can summon 16 Skeletons.' Implies exactly +1 Skeleton per soul."
  display: "Blue bar above his hitpoint bar. Source: prose. Trivia adds 'He gets more bluish the more souls he collects.'"
  do_NOT_count:
    - "Cloned troops. Source: prose 'Cloned troops do not count as souls to him when they are defeated'."
    - "The Skeletons summoned by the ability itself. Source: prose, same sentence."
    - "Sub-troops -- Elixir Golem, Golem, Lava Hound, Battle Ram: 'cards that make sub-troops ... do not count as a soul to it, but only the final forms of the troop, with Goblin Giant as an exception'. Source: prose."
    - "Buildings. Source: prose 'Buildings also do not count as souls when vanquished, making Cannon Cart the only troop that cannot count as a soul'."
  DO_count:
    - "Kamikaze/self-destructing cards -- Spirits, Wall Breakers, Goblin Demolisher: 'however do count as souls when they defeat themselves'. Source: prose."
    - "Friendly troops. Source: prose 'either from the player or the opponent' + Strategy 'Since friendly troops will count as a soul to him'."
  reset: "The soul bar RESETS when the ability is transferred to a newly-placed Champion. Source: webcache/Version_History_2025.wikitext, 2025 Q3 Update (29/9/2025), Champion Rework: 'Skeleton King's soul bar resets during ability transference.' NOT on the subject page."

mechanic_prose: |
  [section "Ability: Soul Summoning", tagline quote, verbatim]
  "Collect souls of the fallen and bring them back from the dead!"

  [section "Ability: Soul Summoning", body, verbatim, all four paragraphs]
  "The Skeleton King has a special ability, accessible from the rightmost side of the screen just
  above the player's card slots in battle. After a 1-second delay, the Skeleton King activates his
  'Soul Summoning', stopping in place momentarily before summoning a varied amount of Skeletons in a
  4-tile radius around himself. The Skeletons spawn 1 at a time at random positions in the circle
  every 0.25 seconds. The number of Skeletons spawned is based on how many troops die (either from
  the player or the opponent) while he is deployed. It continues, even if the Skeleton King dies."

  "When a troop is vanquished while the Skeleton King is in the Arena, the Skeleton King gains a
  'soul', which spawns an additional Skeleton when his ability is used. With no souls, the Skeleton
  King will spawn 6 Skeletons, but with a maximum of 10 souls, he can summon 16 Skeletons. The
  amount of souls the Skeleton King has can be seen in a blue bar above his hitpoint bar. The
  ability goes on a 20 second cooldown after the duration ends. The Soul Summoning ability costs 2
  Elixir to activate."

  "The Skeletons he summons have a bluish tint and behave identically to cloned Skeletons, which
  means you can't clone them further with said card, and they only have 1 hitpoint. Cloned troops do
  not count as souls to him when they are defeated, and neither do the Skeletons summoned from the
  ability."

  "It is also important to note that cards that make 'sub-troops' (e.g., Elixir Golem, Golem, Lava
  Hound, and Battle Ram) do not count as a soul to it, but only the final forms of the troop, with
  Goblin Giant as an exception. Buildings also do not count as souls when vanquished, making Cannon
  Cart the only troop that cannot count as a soul. 'Kamikaze cards' such as Spirits, Wall Breakers,
  and the Goblin Demolisher however do count as souls when they defeat themselves."

  [lead section (untitled intro paragraph), verbatim, ability sentences only]
  "The Skeleton King's ability spawns Skeletons in a radius around him. While the Skeleton King is
  on the field, any troops which die will be turned into 'souls' which are collected by him. The
  number of souls that the Skeleton King collects determines the number of Skeletons that the
  ability will spawn."

  [section "Strategy", verbatim, mechanically load-bearing bullets only]
  "Since friendly troops will count as a soul to him, you can place a swarm such as a Skeleton Army
  while he is around and punish whenever the army gets countered with a small spell."
  "He has a suspiciously large hitbox, and can bodyblock the Hog Rider more easily than other tanks."
  "He also has a suspiciously high mass, and he can even push large troops such as a Giant, Electro
  Giant, or Golem."
  "The Mother Witch can take out his Skeletons easily, distracting him with a flow of Cursed Hogs
  ... Beware, the Mother Witch will also make them a cloned Cursed Hog with 1 Hitpoint."
  "On the contrary, Skeleton King is also great against the Graveyard, as he can summon a full flock
  of 16 Skeletons as a threatening counter push."
  "Do not use the ability, unless you have something tanking for the leftover Skeletons from the
  ability in the lane they are going to go in, otherwise it is a waste of 2 Elixir."
  "The Skeleton King can be placed as a defender in Boat Battles. However, much like other Champion
  cards, he is unable to use his ability."

  [section "History", verbatim, ability-relevant entries]
  "On 4/11/2021, a maintenance break, increased his damage by 14%, area radius to 1.3 tiles (from 1
  tile), and gave him knockback immunity."
  "On 30/3/2022, the Miner Update, fixed an issue where cloning Skeleton King during the Soul
  Summoning animation would cancel it. It also fixed a stats rounding issue with the Skeleton King's
  summoned Skeletons."
  "On 7/6/2022, a Balance Update, decreased the Skeletons spawned by Soul Summoning to 18 (from 20)."
  "On 2/8/2022, a Balance Update, decreased the Skeletons spawned by Soul Summoning to 16 (from 18)."
  "On 26/10/2022, the 2022 Quarter 3 Update ... There was also an unannounced change to the Skeleton
  King, a decrease to his collision radius to 1 tile (from 1.2 tiles)."
  "On 6/10/2025, a Balance Update increased the Skeleton's attack time interval to 1.1 seconds (from
  1.0 seconds)."
  "On 24/10/25,  a maintenance break, decreased Soul Summoning's skeleton spawn radius to 3.5 tiles
  (from 4 tiles)."
  [NOTE: this page's History ENDS at 24/10/2025 -- it carries NO 4/8/2026 entry, unlike the Mighty
  Miner and Little Prince pages. See open_questions.]

  [section "Trivia", verbatim, mechanically relevant]
  "He gets more bluish the more souls he collects."
  "The Skeleton King is 1 of 2 troops that have been featured with an Initial Spawn buff, the other
  being Mother Witch."


open_questions:
  - "Current taunt radius: History (2/3/2026) says 6.5 tiles, but the ability prose AND the attributes table still say 7.5. Which is live? -> in-game check"
  - "Shield HP: is vardefine 512 pre- or post- the -6% (12/1/2026) and -33% (6/7/2026) nerfs? If 512 was release value, current would be ~322 (512*0.94*0.67). -> in-game check"
  - "What is the 'Taunt Trigger Window' (now 0.1 s, from 0.7 s)? Term is never defined on the page."
  - "Cast delay: 0.933 s (table) vs 1 s (prose) - which is real?"
  - "Post-taunt permanence: prose says taunted units 'will still target him afterwards until he is defeated' - does this persist through normal retarget triggers (e.g. tower re-aggro, pulls)? Does it apply to units that entered the radius after activation?"
  - "Does the taunt grab units entering the radius during the 5 s, or only those in radius at cast?"
  - "First Hit Speed 0.5 s vs snapshot base load_time_s 0.7 - same metric or different? If same, the hero body has a faster first hit than base."

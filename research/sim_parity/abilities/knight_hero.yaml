  cast_delay_s: 0.933     # ability attributes table "Cast Time"; prose says "1-second delay" - see conflicts

mechanic_prose: |
  [Quote template under "Ability: Triumphant Taunt"]
  "Gains a shield and taunts nearby enemies, forcing them to attack him."

  [Section "Ability: Triumphant Taunt", verbatim]
  "The Hero Knight has a special ability accessible from whatever side of the screen was put
  in, just above the player's card slots in battle. After a 1-second delay, the Hero Knight
  activates his "Triumphant Taunt", taunting every enemy troop and building in a 7.5-tiles
  range, causing them to attack him. He also gains a shield. Both the shield and the taunt
  effect last for 5 seconds, unless the former is destroyed, although enemy troops and
  buildings will still target him afterwards until he is defeated. The Triumphant Taunt
  ability costs 2 Elixir to activate."


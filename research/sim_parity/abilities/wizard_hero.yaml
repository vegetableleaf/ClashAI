open_questions:
  - "Ability cost is 2 (infobox + prose twice) or 1 (on-page ability attributes table + Heroes master table)? Two sources on each side. In-game check required."
  - "Tornado radius 3 (prose) vs 4 (attributes table). In-game check."
  - "Is tor_11=43 per damage tick or total per tornado? Tornado lasts 2 s; tick rate unstated."
  - "Does the tornado pull enemies like the Tornado spell (pull stat 250, units unknown), or is 'pull' vestigial? Prose describes damage only."
  - "While flying, is the Wizard air-transport (untargetable by ground-only attackers)? Strategy prose implies yes (dodges Mini P.E.K.K.A.); the 'Transport: Air' cell sits in the Tornado attributes table, not the body table."
  - "Does the -64% crown tower damage apply to tornado damage only or also to his normal fireball vs crown towers? History wording is 'the hero wizards crown tower damage'."
  - "Tornado spawn rule: one tornado per fireball at impact point? Prose says 'his fireballs also create ... tornadoes' — placement/frequency not stated."
  - "What ends flight early, if anything (Vines 'can drag the Hero Wizard to the ground' per Strategy)? Interaction list unstated."

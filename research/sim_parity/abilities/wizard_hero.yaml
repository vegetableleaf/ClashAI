ability:
  name: Fiery Flight
  elixir_cost: 2          # infobox AbilityCost=2 AND prose twice ("an additional 2 Elixir", "costs 2 Elixir") — but CONFLICT: on-page Tornado Ability Attributes table says Cost=1, and the Heroes master page table (r1b_heroes.json) also says 1 (5+1=6). Page-primary value recorded; unresolved.
  uses: 1                 # History 4/8/2026: "made the ability single use (from 20sec cooldown)"
  cooldown_s: null        # single use since 4/8/2026; was 20 s before (History)
  cast_delay_s: 1         # prose: "After a 1-second delay, the Hero Wizard activates his fiery flight"

mechanic_prose: |
  [Ability: Fiery Flight — card quote]
  "Launches into the air and throws fearsome fire tornadoes."

  [Section "Ability: Fiery Flight"]
  "The Hero Wizard has a special ability accessible from whatever side of the screen was put in,
  just above the player's card slots in battle. After a 1-second delay, the Hero Wizard activates
  his fiery flight, which makes him take flight for 5 seconds. While he is flying, not only he
  will get a 50% movement speed increase (now classified as fast), his fireballs also create 3
  tile radius tornadoes, which does its own damage (reduced against crown towers), similar to the
  Evolved Valkyrie. The ability costs 2 Elixir to activate."


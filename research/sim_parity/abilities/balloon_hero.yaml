open_questions:
  - Skeletrooper target selection -- "closest ground unit" per prose, but Strategy says it can hit "or buildings"; does it soar to the nearest ground ENEMY (troop or building) or troops only?
  - What happens if no ground enemy is within the soar range when the button is pressed -- ability refunded, wasted, or skeletrooper drops in place?
  - Where does the Skeletrooper launch from -- the Balloon's position? Is the 6.5-tile range measured from the Balloon?
  - Landing damage area -- is it splash, and with what radius? No radius is given anywhere (null, never estimate).
  - "Cast delay between button press and landing: not stated (null)."
  - Soar range 6 (prose) vs 6.5 (table) -- which is live? In-game check.
  - 'Ability name: "Coffin Cadets" (subpage) vs "Coffin Cadet" (Heroes master table) -- cosmetic, but which is the in-game string?'
  - Is the -90% crown tower modifier on the Skeletrooper's regular attacks in addition to the separate landing crown-tower value (27)? Table layout implies yes but never says.

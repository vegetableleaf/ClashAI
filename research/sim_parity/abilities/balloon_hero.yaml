mechanic_prose: |
  [section "Ability: Coffin Cadets", quote template]
  "A Skeletrooper soars to the nearest enemy on the ground, dealing landing damage."

  [section "Ability: Coffin Cadets", body paragraph, verbatim incl. the page's own typos --
   note it misnames the card "Hero Knight" (boilerplate copy error) and misspells
   "skeletropper"/"deling"]
  "The Hero Knight has a special ability accessible from whatever side of the screen was put
  in, just above the player's [[Cards|card]] slots in [[Basics of Battle|battle]]. Once
  pressed, a skeletropper will fly towards the closest ground unit within 6 tiles, deling
  spawn damage. The skeletropper will the attack, dealing less damage to the crown tower.
  The Coffin Cadets ability costs 2 [[Elixir]] to activate."

  [section "Strategy", verbatim]
  "The ability can be used to kill units like [[Musketeer]] and [[Wizard]], or buildings."
  "When defending, put troops like [[Skeletons]] closer, so that they can take the agro of
  the ability."

  [intro prose on the body's death bomb, verbatim]
  "When defeated, it drops a bomb which explodes after 3 seconds, dealing moderate damage."


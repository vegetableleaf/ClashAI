proposed_ability_kind: taunt_shield
# rationale: the sim-load-bearing effect is a new targetable decoy entity that soaks aggro
# (taunt_shield), composed with a 3.5-tile backward blink (movement) and a one-shot
# next-attack buff (buff_self). Composite -- decoy chosen as primary.

open_questions:
  - Does the decoy attack, or is it inert? Page never says.
  - Does the decoy actively taunt (force retarget) or only soak targeting of units already locked on?
  - Teleport direction "back" -- toward own king tower, or along his current facing? Not defined.
  - Do the 3 triple-shot arrows pierce through enemies like the normal attack? What is their spread pattern (parallel / fan)?
  - Is the triple shot consumed if the next attack is against the decoy'd original target vs any target? (i.e. buff persists until next attack fires, however long?)
  - "Cast delay of the ability: not stated (null)."
  - Is dmg_11=135 pre- or post- the 4/8/2026 6% damage nerf? Base snapshot says 133; wiki base page and in-game check needed to settle the body damage delta.
  - Prose says triple-shot arrows "travel longer, but with less damage" -- less than the normal 135 per arrow (48 each), confirmed by vardefine, but is total 144 > 135 intended? worth an in-game sanity check.

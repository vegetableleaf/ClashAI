mechanic_prose: |
  [section "Ability: Triple Threat", quote template]
  "Summons a decoy while darting back and fires a triple shot on his next attack."

  [section "Ability: Triple Threat", body paragraph, verbatim incl. the page's own typos --
   note it misnames the card "Hero Knight" (boilerplate copy error)]
  "The Hero Knight has a special ability accessible from whatever side of the screen was put
  in, just above the player's [[Cards|card]] slots in [[Basics of Battle|battle]]. When
  activated, the Magic Archer will teleport back, while leaving a decoy in his place. The
  next attack now shots 3 arrows that travel longer, but with less damage. The Triple Threat
  ability costs 2 [[Elixir]] to activate."

  [section "Strategy", verbatim]
  "The ability can be used to avoid damage from spells like [[Fireball]] or units like
  [[Mini P.E.K.K.A.]], thanks to the pull back and decoy."
  "The arrows can deal good chip damage to towers"


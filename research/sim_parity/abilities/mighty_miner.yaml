mechanic_prose: |
  [section "Ability: Explosive Escape", tagline quote, verbatim]
  "Mines underground to the opposite lane, leaving a bomb at the original location. Surprise!"

  [section "Ability: Explosive Escape", body, verbatim]
  "The Mighty Miner has a special ability, accessible from the rightmost side of the screen just
  above the player's card slots in battle. After a 1-second delay, the Mighty Miner changes his
  position to the horizontally mirrored position of himself. He is intangible while changing
  positions. He also drops a bomb in the position he originally was prior to using the ability,
  dealing medium area damage to enemies around it after 1 second. His bomb affects both ground and
  air units and will also knock them back 1.8 tiles. The ability goes on a 13-second cooldown after
  the duration ends. The Explosive Escape ability costs 1 Elixir to activate."

  [lead section (untitled intro paragraph), verbatim, ability sentence only]
  "The Mighty Miner's ability causes him to dig underground to the horizontally opposite position
  of it and drop a bomb in the spot he was at which explodes after 1 second, dealing damage and
  inflicting knockback."

  [section "History", 2026, verbatim]
  "On 4/8/2026, a Balance Update, made it so that the Mighty Miner would no longer have a cooldown
  timer in-between abilities. Instead, his ability will now be single use. His base damage was
  increased by 8%"

  [section "History", 2022, verbatim, ability-relevant entries]
  "On 8/4/2022, a maintenance break, decreased the Explosive Escape's cost to 1 Elixir (from 2
  Elixir) and gave the Mighty Miner knockback immunity."
  "On 21/4/2022, a maintenance break, decreased the Explosive Escape's exploding time to 1 second
  (from 3 seconds)."
  "On 21/6/2023, a maintenance break, fixed the Mighty Miner's Bomb inflicting too much damage."
  "On 17/6/2024, the Goblin World Update, decreased the Explosive Escape's damage by 1.67%."
  "On 31/3/2025, the 2025 Quarter 1 Update, allowed an underground Mighty Miner to be affected by
  Royal Chef."

  [section "Strategy", verbatim, mechanically load-bearing bullets only]
  "Use his ability wisely. One of his weaknesses are swarms, and Explosive Escape's bomb mitigates
  that. Explosive Escape's lane swapping mechanic can also be handy with cards such as reactive
  melee troops."
  "Against the Wall Breakers, it is a good idea to use his ability to counter them, as it is able to
  OHKO them, and the Battle Ram can have its charge reset from its knockback."
  "Likewise, a center-placed Inferno Tower will counter the Mighty Miner, regardless if the opponent
  decides to use the Explosive Escape ability because the Mighty Miner will always be pulled to a
  center Inferno Tower on either lane."
  "A center-placed Tombstone also counters a proactive Mighty Miner. He has a very hard time
  shredding the Skeletons, and even if you use his ability (which is used to mitigate its swarm
  counter), he will still head for the Tombstone instead."
  "The Mighty Miner can be placed as a defender in Boat Battles. However, much like other Champion
  cards, he is unable to use his ability."

  [section "Trivia", verbatim, mechanically relevant]
  "Despite carrying a bomb-like backpack, he does not get rid of the bomb on his back when using his
  ability, probably due to the fact he can use the ability multiple times."
  "However, unlike the Super Miner, the Mighty Miner drops his bomb when he uses his ability instead
  of after death."


proposed_ability_kind: bomb
# Closest single value in the allowed set, but INCOMPLETE: Explosive Escape is a COMPOUND ability --
# (a) a self-teleport to the horizontally mirrored arena position with an intangible transit, plus
# (b) a delayed-fuse area bomb with knockback left at the origin. The `bomb` kind covers (b) only;
# an implementer also needs the movement/blink half. Flagged in open_questions.

open_questions:
  - "BOMB RADIUS IS NOT PUBLISHED ON THIS PAGE. Prose gives only the qualitative phrase 'medium area damage'. There is no Radius or Splash column in the Explosive Escape Attributes table (its only columns are Cost, Deploy Time, Cast Time, Ability Cooldown), and no tile figure for the blast appears in prose, History, or Trivia. The sim's 2.5-tile value in hogeq/config/cards.yaml is therefore STILL UNSOURCED by this archive. The only published tile figure for the bomb is the 1.8-tile KNOCKBACK, which is a displacement distance, not a blast radius -- do not conflate them."
  - "BOMB DAMAGE CONFLICTS WITH THE SIM: this page publishes vardefine escape_11 = 332 at level 11 (statistics column 'Explosive Escape Damage'). hogeq/config/cards.yaml sets ability_bomb_damage: 366 at its level-11 reference slot and its comment asserts the number 'is not published in the KB'. That comment is contradicted by this archive -- the number IS published, and 366 is the wiki's LEVEL 12 value (332 x 1.1 = 365.2). If the sim's slot is genuinely level-11-referenced, it is ~10% high."
  - "COOLDOWN CONFLICT WITHIN THIS PAGE: the Explosive Escape Attributes table and the ability prose both state a 13 s cooldown, but the page's own History (4/8/2026) and webcache/Version_History.wikitext (Balance Changes 4/8/2026) say the cooldown was removed and the ability is now SINGLE USE. Both values are recorded above; treat 13 s as stale."
  - "Do the vardefines 1_dmg_11=40 / 2_dmg_11=204 / 3_dmg_11=409 already include the 4/8/2026 '+8% base damage'? The page never says which side of the buff its stat table sits on, and 40/204/409 have no obvious pre-buff antecedent."
  - "ABILITY DURATION IS NOT PUBLISHED. Prose says the cooldown starts 'after the duration ends' but no duration value exists on the page. It is unclear what interval that phrase refers to -- the transit, the intangibility window, or the bomb fuse."
  - "THREE DIFFERENT TIMING NUMBERS WITH NO STATED RELATIONSHIP: prose 'After a 1-second delay', table 'Deploy Time 1 sec', table 'Cast Time 0.933 sec'. Which one gates the teleport, which gates the bomb drop, and do they run in sequence or overlap? Cards.wikitext adds that 'The abilities adhere to the server's 1 second deployment delay', which may explain the 1 s but not the 0.933 s."
  - "TELEPORT GEOMETRY IS UNDEFINED: 'the horizontally mirrored position of himself'. Mirrored about which axis -- the arena's vertical centerline? Does his depth (distance from the river) stay exactly fixed? What happens if the mirrored point lands inside a tower footprint, off-map, or on water? No clamping or fallback rule is given."
  - "INTANGIBILITY WINDOW: 'He is intangible while changing positions' -- for how long, and what does intangible exclude? Can he be damaged, targeted, spell-hit, or Tornado-pulled mid-transit? Only one interaction is stated (History 31/3/2025: an underground Mighty Miner CAN be affected by Royal Chef), which implies he is not fully untargetable."
  - "Does the teleport RESET his own damage ramp stage? Not stated on this page. The Monk page confirms the ramp is resettable by knockback ('will end up being reset every third hit'), but nothing states whether Explosive Escape itself resets it, nor whether the forced target change on arrival does."
  - "Does the ramp reset on TARGET SWITCH, and does 'Damage Charge Speed 2 sec' mean 2 s per stage or 2 s to reach full? The column header carries no definition. Reading it as per-stage gives 0 s / 2 s / 4 s to reach stages 1/2/3."
  - "BOMB vs CROWN TOWERS: does the bomb damage Crown Towers, and at a reduced multiplier? No crown-tower-damage column and no prose statement exists either way."
  - "BOMB KNOCKBACK vs KNOCKBACK-IMMUNE TARGETS: does the 1.8-tile shove apply to units flagged knockback-immune? Not stated. (Contrast the Monk page, which explicitly says his combo knockback lands 'even if the targeted troop is normally immune to knockback' -- no such carve-out is claimed here, so the default is presumably that immunity holds.)"
  - "Does the bomb hit FRIENDLY units? Prose says only 'enemies around it', so presumably enemy-only, but it is never stated negatively."
  - "BOMB PLACEMENT TIMING: 'the position he originally was prior to using the ability' -- is the drop point his position at button press, or his position at the end of the 1-second delay? He may still be walking during that second, and the two differ."
  - "Are BUILDINGS hit by the bomb? Prose says 'ground and air units'; buildings are not mentioned either way."
  - "Ability uses: per BODY or per MATCH? Neither this page nor Version_History.wikitext says. hogeq/config/cards.yaml assumes per-deployment (Unit.ability_left, one use again after being cycled back), which is an assumption this archive does not confirm."
  - "Collision radius / mass: not published on this page. Strategy asserts he has 'more health and mass' than other anti-tank cards, but gives no number (contrast the Skeleton King page, which documents his collision radius in History)."
  - "CHAMPION HAND/CYCLE STATE -- NOT AN ISSUE HERE: this page contains no hand-lock text at all, so nothing on it is stale on that front. For the record, the archived source for the rework is webcache/Version_History_2025.wikitext, '2025 Quarter 3 Update (29/9/2025)', section 'Champion Rework': 'Champions will not bring 3-card cycle anymore: they come back to the player's cycle like any other card.' NOTE the date -- 29/9/2025, NOT 2026. The caller's framing of this as a '2026 rework' does not match the archive; the 4/8/2026 update was a separate change (multi-use -> single-use abilities)."


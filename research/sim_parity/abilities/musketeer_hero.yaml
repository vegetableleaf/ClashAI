ability:
  name: Trusty Turret
  elixir_cost: 3          # infobox AbilityCost=3; ability prose "costs 3 Elixir"; turret attr table Cost=3 — all agree
  uses: 1                 # History 4/8/2026: "made the ability single use (from 22sec cooldown)"
  cooldown_s: null        # single use since 4/8/2026; was 22 s before (History)
  cast_delay_s: 1         # prose: "After a 1-second delay, the Hero Musketeer activates her 'Trusty Turret'"

mechanic_prose: |
  [Ability: Trusty Turret — card quote]
  "Spawns a short-range auto-turret in front of the Musketeer."

  [Section "Ability: Trusty Turret"]
  "The Hero Musketeer has a special ability accessible from whatever side of the screen was put
  in, just above the player's card slots in battle. After a 1-second delay, the Hero Musketeer
  activates her "Trusty Turret", placing a turret 3 tiles forward of the Musketeer, which is used
  either as a distraction for regular troops, and as a building to attract win conditions. This
  turret has a lifetime of 10 seconds, meaning that this is meant to be used reactively as it's
  not meant to last that long, unless the building is destroyed before the Decay kills it. The
  Trusty Turret ability costs 3 Elixir to activate."

  [Section "Strategy", elixir accounting]
  "For the purposes of determining Elixir trades, the Heroic Musketeer and her activated Ability
  count as 7 Elixir, as the player must play the 4 Elixir Heroic Musketeer and then spend a
  further 3 on her Ability."


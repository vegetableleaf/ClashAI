mechanic_prose: |
  [Card flavor Quote, top of page]
  "In the Arena full of uncertainty, Hero Mega Minion wants to make sure he can get
  to the right place in just the nick of time. Learning to shift through the shadows
  doesn't happen overnight!"

  [Section: Ability: Wounding Warp -- Quote]
  "Warps to the lowest-Hitpoint enemy, dealing damage on arrival."

  [Section: Ability: Wounding Warp -- body text, verbatim incl. typos]
  "The Hero Mega Minion has a special ability accessible from whatever side of the
  screen was put in, just above the player's card slots in battle. When deployed, a
  marker will be deployed to the lowest hitpoint target. When that unit dies, the
  mark will move to the next unit. When the ability is preased, Mega Minion will
  teleport to that tile, dealing damage. Afterwards the Mega Minion will behave
  normally, but with -75% on the tower. The Wounding Warp ability costs 2 Elixir
  to activate."


mechanic_prose: |
  [section "Ability: Stone Swish", quote template]
  "Plants his feet and throws boulders with increased range."
  [section "Ability: Stone Swish", body text, verbatim incl. typos]
  "The Hero Bowler has a special ability accessible from whatever side of the screen was put in,
  just above the player's card slots in battle. After 2.5sec of the ability pressed, the bowler
  will change the attack to a long-ranged mortar attack for 7.3sec. Getting a total of 3 shots
  during that duration."
  [section "Strategy", verbatim incl. typos]
  "The ability can be used to snipe builinds, making way cards like Electro Giant."
  "The ability can be used like a 3 shot Mortar, dealing good damage at the tower."
  "Fast and Veary Fast units like Berserker and Ice Spirit can avoid all 3 shots if placed right."


  - "Is the Bowler rooted ('plants his feet') and unable to move during the 7.3s? During the 2.5s cast?"
  - "Can the normal attack fire during the 2.5s cast time, and can the cast be interrupted (e.g. by death)?"
  - "Is there a Mortar-style minimum range for the ability attack? Not stated."
  - "During the ability, does he target buildings only or any ground unit? Strategy implies building-sniping but never states a rule."
  - "Ability range 11.5: measured from the Bowler's position? Does he re-acquire targets at that range immediately?"

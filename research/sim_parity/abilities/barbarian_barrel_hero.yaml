  "They see him rollin', they hatin'! No one clears the path like Hero Barbarian
  Barrel, who willingly gave up his rock music career for the resilience of a
  second roll."

  [Section: Ability: Rowdy Reroll -- Quote]
  "Barrels down the lane a second time for maximum impact."

  [Section: Ability: Rowdy Reroll -- body text, verbatim incl. typos]
  "The Hero Knight has a special ability accessible from whatever side of the screen
  was put in, just above the player's card slots in battle. When activatet, the
  Barbarian Barrel will roll for a second time, while healling the barbarian for 50%
  of the damage. The Rowdy Reroll ability costs 1 Elixir to activate."


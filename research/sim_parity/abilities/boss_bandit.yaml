mechanic_prose: |
  [Section "Ability: Getaway Grenade" - VERBATIM]
  {{Quote|Briefly becomes invisible and teleports backwards!}}
  {{Champion Ability}}
  The Boss Bandit has a special ability, accessible from the rightmost side of the screen just above
  the player's [[Cards|card]] slots in [[Basics of Battle|battle]]. After a 1 second delay, the Boss
  Bandit becomes invisible for 1 second, then teleports 6 tiles behind her original position. This
  allows her to escape any form of damage, as well as give her another dash if the troops are far
  away enough. The ability goes on a 3 second cooldown after the duration ends, but it can only be
  activated twice. The Getaway Grenade ability costs 1 Elixir to activate.

  [Lead section (card quote + intro paragraph) - VERBATIM]
  {{Quote|The boss of the Forest Gang finally shows her face...kind of. Boss Bandit dashes to her
  targets and is invulnerable while dashing. When things get tough, her pair of grenades are at the
  ready.}}
  "It spawns a single-target, ground-targeting, melee, ground [[:Category:Troop Cards|troop]] with
  high hitpoints and high damage. If there are ground units between 3.5 and 6 tiles of her, she will
  stop moving and begin charging a dash attack which takes 0.8 seconds to execute, and will deal
  double damage. The Boss Bandit's ability allows her to get invisible for one second, then teleport
  6 tiles behind her current spot."

  [Section "Strategies" - VERBATIM, engine-relevant edge cases only]
  "Her dash invulnerability will allow her to nullify charge damage from the [[Dark Prince]] and the
  [[Prince]], as well as the first attack of the [[Valkyrie]] and the [[Fisherman]], since they hit
  during the Boss Bandit's dash time, allowing her to be more efficient against them."
  "Even though anti-tank cards like the [[Mini P.E.K.K.A.]] and the Lumberjack are able to cripple
  her hitpoints quick enough, the Boss Bandit can use her ability to escape the troop and dash
  towards them again, easily taking the anti-tank card down. It can also be used preemptively, and
  can even be activated a second time if another anti-tank card is used."
  "When using cheaper anti-tank cards, an [[Ice Spirit]] can be used to stall the Boss Bandit for 1.2
  seconds, stopping her from dealing damage and use her ability in the meantime, possibly shutting
  down her first ability usage. If positioned at the right time, it may even cause her to dash into
  it while still freezing her."
  "Alone, a [[Skeleton Army]] is the cheapest counter to her, as the [[Skeletons]] spawned from the
  card is enough to keep her distracted and take her down even with her three ability activations."
  "The [[Rage]] is a good tool when removing swarms, as it will also boost the Boss Bandit's attack
  speed and reduce the dash time, allowing her to use her ability and dash faster."
  "If the Golden Knight is taking the role of mini-tank, his own ability will be able to nullify her
  dash when timed properly and at a distance from her, but Boss Bandit's dash also nullifies the
  Golden Knight's ability, making a pretty cool interaction. The Skeleton King can also nullify her
  dash by activating his ability."
  "For a -1 Elixir trade, the Boss Bandit can escape a [[Rocket]] when timed right, allowing her
  hitpoints to be preserved. If she was targeting something, she'll be able to dash into the target
  again. This is easy to time, as the Rocket moves slowly, but one must also note that it takes 1
  second to activate her ability, and she also takes around 0.9 seconds to teleport backwards."
  "The Boss Bandit can be placed as a defender in [[Clan Wars|Boat Battles]]. However, much like
  other {{Rarity|Champion}} cards, she is unable to use her ability."

  [Section "History" - VERBATIM, mechanics-bearing entries only]
  "On 8/7/2025, a Balance Update, changed the way the Getaway Grenade operates. The Getaway Grenade
  can be activated a total of 2 times independent on Boss Bandit's hitpoints, with a 3-second
  cooldown between its uses. The same update also decreased the Boss Bandit's hitpoints by 4%."
  "On 12/1/2026, a Balance Update, decreased the Boss Bandit's damage and dash damage by 9%, and
  increased it's attack speed to 1.1 (from 1.2)"

  [Section "Trivia" - VERBATIM, mechanics-bearing entries only]
  "The Boss Bandit is the first {{Rarity|Champion}} to have a limited number of ability uses, with a
  maximum of two uses per deployment."
  "If the Boss Bandit's ability is used up, the crown symbol is currently not automatically removed."
  "The initial balance change for Boss Bandit on the 8/7/2025 balance changes was an addition of a
  5-second cooldown to Getaway Grenade, but it was lowered to 3 seconds last minute."


proposed_ability_kind: movement_flight
# Self-displacement escape: a backwards teleport of a fixed 6 tiles preceded by a 1 s invisibility
# window. 'stealth' is the co-component and the runner-up label; nothing is summoned and no damage
# is dealt by the ability itself. Flag for the owner if a dedicated 'teleport'/'escape' kind is
# added (mega_minion_hero's blink was filed under dash_chain, which does not fit a backwards
# non-damaging relocation).

open_questions:
  - "TRIGGER (the sim currently models this as AUTO): the page describes Getaway Grenade ONLY as a manual button - 'accessible from the rightmost side of the screen just above the player's card slots'. Nothing on the page describes an automatic or HP-threshold trigger in current behaviour. The single hint of any HP coupling is History 8/7/2025, which says the ability 'can be activated a total of 2 times INDEPENDENT ON Boss Bandit's hitpoints' - i.e. an HP-gated activation model was REMOVED on 8/7/2025. The sim's auto-trigger is therefore contradicted by the archived page; owner ruling needed."
  - "Use count: 2 (ability prose + Ability Count column + Trivia + History) vs 3 (Strategies prose 'even with her three ability activations'). Both recorded; 2 has four independent supports on the page and 3 has one, but the rule is to record both."
  - "Activation timeline is stated three ways and never reconciled: prose '1 second delay' then '1 second invisible' then teleport; table Cast Time 0.933 s + Invisibility Duration 1 s; Strategy '1 second to activate ... around 0.9 seconds to teleport backwards'. Is the sequence cast(0.933) -> invisible(1.0) -> teleport (total ~1.93 s from press), or cast(0.933) -> teleport(0.9) with invisibility overlapping? The engine needs the exact instant the position changes."
  - "Teleport reference point: the Ability section says 6 tiles behind her ORIGINAL position; the lead says 6 tiles behind her CURRENT spot. If she moves during the 1 s invisibility these differ. Both recorded."
  - "Definition of 'behind': relative to her facing, her lane direction, or straight back toward her own King Tower? Unstated. Also unstated: what happens if the destination is off-board, inside the river, or on the far side of it - is the teleport clamped, cancelled, or does it place her in an illegal tile?"
  - "Invisible vs invulnerable: the ability quote says 'Briefly becomes invisible' but the prose says 'This allows her to escape any form of damage', and Strategy uses it to dodge a Rocket. Rockets are spells, and on the Archer Queen page spells explicitly still hit invisible units. So does the 1 s window grant untargetability only (the Rocket being dodged by the displacement, not the cloak), or genuine damage immunity?"
  - "Cooldown anchor: '3 second cooldown after the duration ends'. Which duration - the 1 s invisibility, or the whole cast+teleport sequence? Total gap between use 1 and use 2 is therefore ~3 s or ~5 s from press."
  - "Dash is a passive charge, NOT the ability: triggered when a ground unit is 3.5-6 tiles away, 0.8 s execution, double damage, invulnerable throughout. Unstated: does the dash re-target or abort if the target dies mid-dash (the Golden Knight page documents such a fix for HIS dash, this page says nothing)? Is the dash charge cancellable by Zap/Log/knockback like a Prince charge? Can it cross the river?"
  - "Ability/dash coupling: prose says the teleport 'give[s] her another dash if the troops are far away enough' - i.e. relocating past 3.5 tiles re-arms the dash. Does the ability itself reset any dash cooldown, or is re-arming purely a function of the new distance?"
  - "Dash Speed = 500 with no unit on the page; the Dash Range column mixes a trigger band (3.5-6) with what the engine would call max dash distance. Which is which is not stated."
  - "Rage interaction: Strategy says Rage 'will also boost the Boss Bandit's attack speed and reduce the dash time' - the dash-time scaling factor under Rage is not given."
  - "Golden Knight / Skeleton King mutual-nullification of dashes is asserted qualitatively with no rule for which effect wins."
  - "Release date conflict: infobox ReleaseDate=7 April 2025, History says 'added to the game on 7/4/2024' under a 2025 heading linking the April 2025 Update. The History year looks like a typo; both recorded."
  - "UI bug recorded in Trivia: the crown symbol is not removed when both uses are spent - cosmetic, but it means the crown icon is not a reliable 'ability available' signal for a screen-reading agent."
  - "Hand-lock: this page never states the Boss Bandit leaves the hand while her body lives, so nothing here contradicts the 2026 rework."
  - "revid unknown - the archive is a bare wikitext dump carrying no revision metadata."

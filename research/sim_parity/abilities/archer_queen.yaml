mechanic_prose: |
  [Section "Ability: Cloaking Cape" - VERBATIM]
  {{Quote|Activates stealth mode and shoots her arrows faster!}}
  {{Champion Ability}}
  The Archer Queen has a special ability, accessible from the rightmost side of the screen just
  above the player's [[Cards|card]] slots in [[Basics of Battle|battle]]. After a 1-second delay,
  the Archer Queen activates her "Cloaking Cape", becoming invisible (untargetable by enemy
  [[:Category:Troop Cards|troops]]), having a 80% increase in attack speed, and a massive decrease
  in movement speed for the entire 3.5-second duration of the ability. The ability goes on a
  17-second cooldown after the duration ends. The Cloaking Cape ability costs 1 [[Elixir]] to
  activate.

  [Lead section (intro paragraph) - VERBATIM, relevant clause]
  "The Archer Queen's ability makes her invisible, like the [[Royal Ghost]] and increases her attack
  speed significantly for a short time."

  [Section "Strategy" - VERBATIM, engine-relevant edge cases only]
  "An Archer Queen deals exactly 7 shots for the full duration of her ability, assuming no shots are
  wasted."
  "This can backfire against area-damage [[:Category:Troop Cards|troops]], as she is still vulnerable
  to area-damage attacks that could hit a troop in front of her."
  "When her ability is active, you can use [[Giant Snowball]] or [[The Log]] to knock her, wasting a
  few seconds worth of heavy damaging shots. Stun effects like Zap and [[Freeze]] also work in a
  similar way."
  "With her ability, the Archer Queen can completely bypass the Tesla and go straight to the Tower if
  she is alone, as the Tesla will not reveal itself against invisible targets."
  "Additionally, since it is a spell, the player can reliably hit the Archer Queen even while her
  ability is active."
  "In certain situation, the ability can be used to divert troops towards the other lane." (i.e.
  enemy troops already locked onto her retarget when she cloaks)
  "Do not use her ability when combating an [[X-Bow]] or a [[Mortar]] which is targeting her, unless
  you have a distraction or if it is a very desperate case. It will target the next closest thing,
  which can be your Tower."
  "Beware of using the Archer Queen's ability when alongside other troops. It can potentially waste
  some of her shots while your supporting troops kill any enemies, and she will also be slowed down
  afterwards, effectively making the ability a waste of 1 Elixir."
  "Stunning troops like [[Electro Wizard]], Electro Dragon, and [[Zappies]] are good counters to the
  Archer Queen, as they will prevent her from using her ability."
  "A [[Monk]] with the Pensive Protection ability active works in a similar way, causing the Archer
  Queen to use her ability to her disadvantage, as the shots will be reflected back to her"
  "The Archer Queen can be placed as a defender in [[Clan Wars|Boat Battles]]. However, much like
  other {{Rarity|Champion}} cards, she is unable to use his ability."

  [Section "History" - VERBATIM, mechanics-bearing entries only]
  "On 15/11/2021, a Minor Update, allowed the [[Mega Knight]] to deal damage to an Archer Queen if
  she begins cloaking during his jump."
  "On 3/2/2022, a Balance Update, made it so that Cloaking Cape would decrease her speed to 45 (now
  classified as Slow) when active."
  "On 4/4/2022, the April 2022 Update, decreased the Cloaking Cape's attack speed buff to 180% (from
  200%)."
  "On 8/4/2022, a maintenance break, fixed an issue where an invisible Archer Queen was not receiving
  splash damage."


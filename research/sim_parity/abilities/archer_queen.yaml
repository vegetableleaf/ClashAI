proposed_ability_kind: stealth
# Self-cloak + attack-speed buff + movement-speed penalty over a fixed 3.5 s window; no summon, no
# displacement, no zone. 'buff_self' is the runner-up (it IS a timed self-buff whose headline
# component happens to be untargetability) - flag for owner if the registry folds stealth into
# buff_self.

open_questions:
  - "Cast delay: prose says 'After a 1-second delay'; the Cloaking Cape Attributes table says Cast Time 0.933 sec. Both recorded. Which gates the buff start, and does the 3.5 s duration begin at button press or after the cast completes?"
  - "Attack-speed buff magnitude is stated three ways on one page: prose 'a 80% increase', table Boost '+180%', History 'attack speed buff to 180% (from 200%)'. The level table's own formula multiplies DAMAGE by 1.80 at an unchanged 1.2 s hit speed, i.e. 1.8x DPS (= +80%). The engine needs the hit interval during the ability: 1.2/1.8 = 0.667 s, or 1.2/2.8 = 0.4286 s?"
  - "Prose (Strategy) claims 'exactly 7 shots for the full duration'. Neither reading reproduces 7 over 3.5 s: a 1.8x multiplier gives ~5.25 shots (0.667 s interval) and a 2.8x multiplier gives ~8.2 shots (0.4286 s interval); 7 shots in 3.5 s implies a ~0.5 s interval (2.4x). That arithmetic is DERIVED here, not on the page. Needs an in-game count."
  - "Invisibility semantics: the page says 'untargetable by enemy troops'. It also states that area/splash damage still hits her (History 8/4/2022), that spells hit her reliably (Strategy), that Tesla will not pop up for her, that X-Bow/Mortar and locked-on troops retarget to the next closest thing, and that Mega Knight CAN damage her if she cloaks mid-jump (History 15/11/2021). Undefined: do Crown Towers drop their lock? Does firing break invisibility? Do already-deployed buildings retarget or merely stop firing?"
  - "Does the Slow (45) movement penalty end exactly with the 3.5 s duration? Strategy says 'she will also be slowed down afterwards', which could mean 'later during the ability' or 'after it ends'."
  - "Cooldown start point: prose says the 17 s cooldown begins 'after the duration ends'. Does the 0.933 s cast count toward it? Total lockout from button press is therefore ~17 s or ~21.4 s - unstated."
  - "Uses per body: not stated anywhere on the page. The 17 s cooldown implies unlimited re-use, but unlike Boss Bandit there is no 'Ability Count' column to confirm it."
  - "Activation gating: Strategy says stunning troops 'will prevent her from using her ability'. Is activation blocked while stunned/frozen, and is an in-flight cast cancelled by a stun (with or without an elixir refund)?"
  - "Reflect interactions (Monk Pensive Protection, Electro Giant) are described qualitatively only - no reflected-damage numbers appear on this page."
  - "Boat Battles disable champion abilities ('she is unable to use his ability') - recorded, out of scope for the ladder sim."
  - "Hand-lock: this page never states that the Archer Queen leaves the hand while her body lives, so nothing here contradicts the 2026 rework. Recorded for completeness only."
  - "revid unknown - the archive is a bare wikitext dump carrying no revision metadata."

mechanic_prose: |
  [Section "Ability: Dashing Dash" - VERBATIM]
  {{Quote|Dashes towards his enemies and chain attacks everything in his path!}}
  {{Champion Ability}}
  The Golden Knight has a special ability, accessible from the rightmost side of the screen just
  above the player's [[Cards|card]] slots in [[Basics of Battle|battle]]. After a 1 second delay, the
  Golden Knight activates his "Dashing Dash", gaining a movement speed boost if he is not within 5.5
  tiles of an enemy unit. Once a unit is in range, he dashes to it quickly, then dashes towards the
  closest enemy unit within a 5.5-tile radius (even if the previous unit was not destroyed). His
  dashes have invulnerability and deal increased damage, like the [[Bandit]]. He cannot dash into the
  same troop per ability use. He will stop dashing after dashing 10 times, if no other valid targets
  are within range, or if the last target hit is a [[:Category:Crown Towers|Crown Tower]]. It is
  important to note that his movement speed boost cannot be reset or cancelled by [[The Log]],
  [[Zap]], [[Freeze]] or other things that will normally stop a charge. The ability goes on an 12
  second cooldown after the duration ends. The Dashing Dash ability costs 1 [[Elixir]] to activate.

  [Lead section (intro paragraph) - VERBATIM, relevant clause]
  "The Golden Knight's ability increases his movement speed when no enemies are nearby, and causes
  him to dash onto enemies in sequence, similar to the [[Electro Spirit]]'s attack."

  [Section "Strategy" - VERBATIM, engine-relevant edge cases only]
  "Unlike the [[Electro Spirit]], the Golden Knight cannot be forced to activate the [[King's
  Tower|King Tower]] while using the ability."
  "The number of dashes from the Golden Knight during the ability is not enough to destroy an entire
  [[Skeleton Army]], leaving some Skeletons still alive"
  "Make sure that they are at most 5 tiles away from the river, to prevent the Golden Knight from
  connecting to the Crown Tower with his dash."
  "When using [[:Category:Building Cards|buildings]] to pull the Golden Knight, they should be placed
  3 tiles from the river and 2 tiles from the Crown Tower. This will ensure that the Golden Knight
  will not dash towards the Crown Tower and will stay distracted by the building."
  "The Golden Knight is unique in the fact that he can dash onto multiple targets, like a [[Knight]]
  and Crown Tower, and still attack the original target."
  "Once the Golden Knight uses his ability, he will not target any units behind him unless they are
  in his range. In other words, Dashing Dash only chains to the troops that the Golden Knight can
  see. Because of this, surrounding him with swarms like [[Guards]] is an effective way to neutralize
  his dash"
  "When dashing, he is immune to all forms of damage like the Bandit. This immunity can be extended
  by having him dash multiple times."
  "If the Golden Knight dashes while being targeted by an [[Inferno Tower]] or [[Inferno Dragon]],
  their ramp up damage will reset, allowing him to distract them for an extended period of time."
  "The Golden Knight will still be able to finish his dash, even if a [[Fisherman]] pulls him."
  "The Golden Knight's dash is able to cross the river."
  "His dash damage is enough to OHKO equivalently levelled [[Wall Breakers]] and [[Bomber|Bombers]],
  and it will take down troops like the [[Musketeer]], Electro Wizard, [[Goblinstein]], Little
  Prince, [[Ice Wizard]], and [[Wizard]] to half health"
  "When using the ability, the Golden Knight's momentum increases significantly. This can allow him
  to push friendly troops closer to their target."
  "A Golden Knight can use his ability to hit the [[Goblins]] from a [[Goblin Barrel]]. He dashes
  fast enough that he can defeat the Goblins for no damage."
  "The Golden Knight can be placed as a defender in [[Clan Wars|Boat Battles]]. However, much like
  other {{Rarity|Champion}} cards, he is unable to use his ability."

  [Section "History" - VERBATIM, mechanics-bearing entries only]
  "On 1/11/2021, an Optional Update, fixed Dashing Dash so that it does not end if the Golden
  Knight's target dies before the dash connects with it."
  "On 30/3/2022, the Miner Update, fixed an issue with Golden Knight not dashing properly while
  targeting a moving unit."
  "On 4/4/2022, the April 2022 Update, increased the Dashing Dash's maximum dash range to 6 tiles
  (from 5 tiles) but made it so that the dash would end if a Crown Tower is hit."
  "On 26/10/2022 ... It also fixed an issue where Golden Knight dashed to an empty space with no
  target."
  "On 13/11/2023, a Minor Update, fixed a bug where Golden Knight could not hit targets across the
  river with Dashing Dash."
  "On 31/3/2025, the 2025 Quarter 1 Update, allowed a dashing Golden Knight to be affected by [[Royal
  Chef]]."
  "On 5/5/2025, the May 2025 Update, allowed Dashing Dash to move Golden Knight backwards."
  "On 3/11/2025, a Balance Update, decreased Dashing Dash Delay to 0.05 seconds (from 0.2 seconds)."
  "On 12/1/2026, a Balance Update, decreased the cooldown of Dashing Dash to 12 seconds (from 8
  seconds)."

  [Section "Trivia" - VERBATIM, mechanics-bearing entry]
  "He sings 'Golden Knight!' if Dashing Dash is activated while there are no enemies in its range, as
  well as making a laugh."


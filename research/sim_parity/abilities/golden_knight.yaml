proposed_ability_kind: dash_chain
# Textbook chain-dash: a movement-speed boost while out of range, then up to 10 sequential
# invulnerable dashes to the nearest enemy within 5.5 tiles, each dealing dash damage (335 at L11),
# no repeat target within one activation, terminating on 10 dashes / no valid target / Crown Tower
# hit. No summon, no zone, no self-stat buff beyond the movement boost.

open_questions:
  - "ABILITY DURATION IS NEVER STATED. Prose says the 12 s cooldown starts 'after the duration ends', but no duration value exists on the page and the listed stop conditions are all event-based (10 dashes, no valid target in range, Crown Tower hit). Does the ability run until a stop condition fires with no time cap at all? If he activates with nothing in range and the enemy walks up 8 s later, is the ability still armed?"
  - "'He will stop dashing ... if no other valid targets are within range' - does that END the ability (starting the cooldown and dropping the speed boost), or does he keep the boost and resume chaining when a target enters the 5.5-tile radius? This is the single most load-bearing ambiguity for the engine, and it interacts directly with the missing duration."
  - "Three different delay numbers, none reconciled: prose 'After a 1 second delay', table Cast Time 0.766 sec, and History 3/11/2025 'Dashing Dash Delay ... 0.05 seconds (from 0.2 seconds)'. The 0.05 s figure most plausibly names the gap between chained dashes, but the page never says so. The engine needs both the activation delay and the inter-dash delay."
  - "Dash travel speed / per-dash duration is not given (Boss Bandit's page prints Dash Speed 500; this page prints only the out-of-combat movement boost Very Fast (120)). Without it, chain-clear timing cannot be simulated - Strategy claims he clears Goblin Barrel goblins 'for no damage', which is a timing claim with no number behind it."
  - "Dash damage multiplier: 335 vs 161 body damage is 2.081x (DERIVED), but the page says only 'increased damage, like the Bandit'. Does dash damage apply at full value to Crown Towers, or is there a crown-tower reduction? No crown-tower column exists in this level table."
  - "Target eligibility for the chain: the body targets Ground only. Can a dash chain to an AIR unit? Prose says 'the closest enemy unit within a 5.5-tile radius' without qualifying transport, but Strategy stresses 'The Golden Knight cannot attack air troops'. Also unstated: do buildings, spawners and Tower Troops count as chain targets, and is the Crown Tower a target he actively seeks or only a terminal one?"
  - "Chain measurement origin: is 'closest enemy within 5.5 tiles' measured from his position AFTER the previous dash, and is the field of view restricted? Strategy says 'he will not target any units behind him unless they are in his range ... Dashing Dash only chains to the troops that the Golden Knight can see' - implying an arc/facing restriction that is never defined in degrees, while History 5/5/2025 explicitly 'allowed Dashing Dash to move Golden Knight backwards'. Those two read as contradictory; both recorded."
  - "'He cannot dash into the same troop per ability use' - does that exclusion cover Crown Towers and buildings too? (Moot for towers, since hitting one ends the chain.) Does a dash that lands on a target which dies mid-flight still consume one of the 10?"
  - "Does a Crown Tower dash count toward the 10-dash budget, and does the ability end immediately on that hit or after the damage resolves?"
  - "Invulnerability window: 'immune to all forms of damage' during a dash, extendable by chaining. Is he immune at the moment of impact, and is he immune during the inter-dash gap (0.05 s?) or only in flight? Strategy notes the immunity absorbs a Sparky hit, Bandit dash, Prince/Dark Prince charges, and resets Inferno ramp-up."
  - "Displacement immunity: the movement speed boost 'cannot be reset or cancelled by The Log, Zap, Freeze or other things that will normally stop a charge', and a Fisherman pull does not interrupt an in-flight dash. Does a knockback still move him physically while the dash resolves? Royal Chef CAN affect a dashing Golden Knight (History 31/3/2025)."
  - "'The Golden Knight's momentum increases significantly ... can push friendly troops closer to their target' - a physical push effect on allies with no magnitude given. Unimplementable as stated."
  - "River crossing: the dash crosses the river (Strategy + History 13/11/2023 bugfix). Does it ignore all pathing, or only the river?"
  - "Uses per body: not stated. The 12 s cooldown implies unlimited re-use but, unlike Boss Bandit, there is no 'Ability Count' column."
  - "Hand-lock: this page never states the Golden Knight leaves the hand while his body lives, so nothing here contradicts the 2026 rework."
  - "revid unknown - the archive is a bare wikitext dump carrying no revision metadata."

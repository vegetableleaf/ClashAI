mechanic_prose: |
  [Card flavor Quote, top of page]
  "A single gobble of Goblins is never enough! Hero Goblins are far too clever to go
  into battle without backup, so the final one to fall drops an unassuming banner
  that signals the second wave."

  [Section: Ability: Banner Brigade -- Quote]
  "The last Goblin standing drops a banner that calls in reinforcements."

  [Section: Ability: Banner Brigade -- body text, verbatim incl. typos]
  "The Hero Knight has a special ability accessible from whatever side of the screen
  was put in, just above the player's card slots in battle. The ability will be
  disabeld until the last goblin is killed. When the last goblin dies, a banner will
  be deployed that last 5sec. When the ability is pressed during that time, 2 Brigade
  Goblins will spawn a little behind. Brigade Goblins has the exact stats as the
  original goblins. The Banner Brigade ability costs 1 Elixir to activate."


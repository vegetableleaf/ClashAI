# Meta opponent decks for the sim (each = 8 card keys from the card KB).
#
# `run.py decks-import` (official Clash Royale API + your free token) OVERWRITES this file with the
# current top ~200 most-played decks from top-ladder battle logs. This committed set is a curated
# fallback so the sim has varied, realistic opponents out of the box. Unknown keys are dropped and a
# deck is used only if all 8 resolve in the KB. Optional `weight` biases how often it is sampled.

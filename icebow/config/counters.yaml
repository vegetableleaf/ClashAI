# COUNTER TABLE -- icebow. What this deck plays against what, WHEN, and WHERE.
#
# Researched from counter guides, then re-validated against this repo's own card
# database by tools/counters_build.py: every response is in this deck, passes
# threat_value.pick_invalid (so it can physically touch the threat and the trade is
# sane), and uses only when/where words the wheels can execute.
#
# Consumed by the live advisor path (vetoed pick / silent advisor) and the sim's
# doctrine prior, so both sides answer a push the same way. THE FIRST ROW FOR A
# THREAT KEY WINS: put hand-written overrides ABOVE the generated rows and they
# survive a regenerate.
#
# generated from research_tables.json

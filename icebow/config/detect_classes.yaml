# Object-detection class taxonomy for the board detector (Ultralytics YOLO11).
#
# Ordered list -> class index = position in this list. Edit freely (add/remove/reorder),
# then re-run `run.py autolabel` and re-label. Names match your card KB keys
# (config/cards.yaml) where possible. Team (yours vs enemy) is inferred at inference time
# from colour, so classes are team-agnostic (a Musketeer is "musketeer" on either side).
#
# The auto-labeller only fills in YOUR deck's troops/buildings (the ones you play); every
# other class here is one you hand-label on the exported frames. Trim the list to what you
# actually intend to label -- fewer, well-labelled classes beat many sparse ones.

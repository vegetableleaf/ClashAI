  skeleton_barrel_evo: {count: 1, damage: 0, dps: 0, mid_drop_frac: 0.75, verified: true}

  # ---- PHASE B EVO MECHANICS (2026-08-14 sweep 2) ----
  # EVO MUSKETEER: "gains 3 infinite-range attacks that target the closest troop or building from

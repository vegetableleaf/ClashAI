  # with other rage. Their +10% hp / 1.4 s hit speed flow from the imported row.
  barbarians_evo: {hit_rage_s: 3.0, hit_rage_boost: 0.30, verified: true}
  # EVO VALKYRIE: "every time [she] attacks, a Tornado appears for half a second, pulling all
  # units towards her" -- 5.5-tile radius, 76 tornado damage, ground AND air (reuses the vortex).
  valkyrie_evo: {attack_nado_radius_tiles: 5.5, attack_nado_duration_s: 0.5, attack_nado_damage: 76, verified: true}
  # EVO ZAP: "the ring grows and zaps every target inside 2 more times" -- 3 pulses ~1 s apart at
  # radii 2.5 -> 3.0 -> 3.5, each a full zap (damage/stun/crown chip from the imported row).
  zap_evo: {zap_pulses: 3, zap_radius_step_tiles: 0.5, verified: true}
  # EVO PEKKA: the imported hitpoints 5640 is the OVERHEAL CAP (3760 x 1.5), not deploy hp, and
  # the damage row is missing -- both re-curated from the base card. Post-rework heal: "each kill
  # heals the same amount ... always 12.5% of the core HP" = 470 at L11, overheal to 150%.
  pekka_evo: {hitpoints: 3760, damage: 842, dps: 468, kill_heal: 470, overheal_frac: 1.5, verified: true}
  # EVO SKEL BARREL: imported count 2 is the BARRELS-carried attribute, not bodies -- one flying
  # unit with 665 hp (125% of base) and 238 death damage per barrel. First barrel drops at 75%
  # hp (blast + 7 skeletons); the second on death; both at once if it reaches the tower unspent.

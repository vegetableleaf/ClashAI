  royal_giant_evo: {recoil_damage: 81, recoil_radius_tiles: 2.5, verified: true}
  # EVO SKELETONS: "every time they attack, an additional Evolved Skeleton will spawn, for a
  # maximum total of 8" (cap = living evo skeletons on the team).
  skeletons_evo: {spawn_on_hit: skeletons_evo, spawn_on_hit_cap: 8, verified: true}
  # EVO RECRUITS: "AFTER their shield is destroyed, they gain the ability to charge towards their
  # target after traveling [charge_range, imported 2.5] tiles, dealing 2x damage" -> 266 at L11.
  royal_recruits_evo: {charge_damage: 266, charge_after_shield: true, verified: true}
  # EVO BARBARIANS: "every attack, their attack speed and movement speed increases by 30% for
  # 3 seconds" (3 s since 14/5/2024; 30% since the 6/10/2025 global rage nerf). Does not stack
  # with other rage. Their +10% hp / 1.4 s hit speed flow from the imported row.
  barbarians_evo: {hit_rage_s: 3.0, hit_rage_boost: 0.30, verified: true}
  # EVO VALKYRIE: "every time [she] attacks, a Tornado appears for half a second, pulling all
  # units towards her" -- 5.5-tile radius, 76 tornado damage, ground AND air (reuses the vortex).
  valkyrie_evo: {attack_nado_radius_tiles: 5.5, attack_nado_duration_s: 0.5, attack_nado_damage: 76, verified: true}
  # EVO ZAP: "the ring grows and zaps every target inside 2 more times" -- 3 pulses ~1 s apart at

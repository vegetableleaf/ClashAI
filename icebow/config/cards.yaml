# =====================================================================
# Card knowledge base.  Combat stats below are the LEVEL-11 base; per-card
# levels are set in the deck (1v1 mode -> levels vary) and scaled from level 11.
#
# Two kinds of data:
#   * STABLE  (elixir, kind, targets, movement, splash, flags, evolution):
#     safe to hand-maintain; rarely changes.
#   * VOLATILE (hitpoints / damage / hit_speed / dps @ level 11): scales with
#     level and shifts on balance updates -> treat as REFRESHABLE. These are
#     left null here; import them from a stats source and bump `meta.updated`.
#
# `verified: false` marks an entry whose stable fields still need a source check.
# Loaded by src/clashrl/cards.py (CardDB).
# =====================================================================

meta:
  level: 11
  mode: "1v1"
  updated: "2026-07-24"
  stats_source: null        # e.g. "RoyaleAPI" once combat stats are imported
  notes: >
    Elixir + categorical fields populated. Combat stats (hitpoints/damage/
    hit_speed) pending import from a stats source (see README refresh note).

# Your deck (icebow / X-Bow 2.9 control: defend + cycle; X-Bow is the WIN CONDITION, placed
# forward to lock the enemy princess tower; Knight tanks / defends / body-blocks; Rocket
# clears big pushes or cycle-chips in 2x/3x). `evolved: true` uses the Evolution variant.
# Classic 1v1 -> card levels are the player's real account levels.
deck:
  name: "Icebow X-Bow Control (Classic 1v1)"
  cards:
    - {card: tornado, level: 14}      # swapped in for royal_delivery 2026-08-04; upgraded 13 -> 14 on 2026-08-16 (real account level, confirmed)
    - {card: tesla,     evolved: true, level: 14}
    - {card: ice_wizard, level: 12}
    - {card: x_bow, level: 16}
    - {card: rocket, level: 14}
    - {card: knight, evolved: true, level: 16}   # EVO Knight (2-cycle evolution: gains a shield + damage-reduction dash); swapped in for miner 2026-08-04
    - {card: the_log, level: 14}
    - {card: skeletons, level: 15}    # upgraded 13 -> 15 on 2026-08-11 (real account level, confirmed)

# ---------------------------------------------------------------------
# card fields:
#   elixir      int
#   kind        troop | building | spell
#   rarity      common | rare | epic | legendary | champion
#   attacks     which target types it can damage: [ground], [air, ground], [] (spell hits per radius)
#   movement    ground | air | none
#   speed       slow | medium | fast | very_fast | null
#   range       melee | short | long | null   (attack reach; ranged if long/short)
#   splash      true if area damage
#   count       units deployed
#   win_condition   true for building-targeting pushers / primary tower threats
#   targets     buildings_only | any | null   (what a troop prefers to attack)
#   flags       [ranged, flying, spawner, kamikaze, dash, charge, stun, freeze,
#                knockback, pull, shield, splash_air, building_targeting, swarm,
#                siege, tank, mini_tank, splash, jump]   (siege => X-Bow/Mortar)
#   evolution   {available, cycles, effect, gains:[...]}   (null if none)
#               `cycles` = how many times the BASE card must be PLAYED before the Evo is
#               available, so cycles:2 => base, base, EVO (every 3rd play is evolved). The sim
#               enforces this (sim/env.py evo charges), so a wrong value directly changes play.
#               VERIFIED in-game: tesla 2, knight 2. UNVERIFIED (musketeer / skeletons / archers /
#               valkyrie all sit at 1) -- none are in the current deck and opponent decks use BASE
#               keys only, so those four are inert today; verify before ever slotting one.
#   hitpoints/damage/hit_speed/dps   @ meta.level (null => import)
#   crown_tower_damage   spells' reduced damage to crown towers @ meta.level
#                        (null => import; troops/un-reduced spells hit towers for full damage)
# ---------------------------------------------------------------------
cards:

  # ---- opponent-only curated entries ------------------------------
  elixir_collector:            # OPPONENT pump (never in your deck) -- curated for the sim's PUMP ECONOMY:
    display: "Elixir Collector"   # the engine pays its owner +1 elixir every gen_every_s while it stands,
    elixir: 6                     # so rocketing a FRESH pump denies real production (see sim/engine.py).
    kind: building
    movement: none
    speed: null
    count: 1
    win_condition: false
    targets: none
    flags: []
    lifetime: 70               # seconds on the field -- VERIFY vs current balance (stats import has no lifetime)
    gen_every_s: 8.5           # +1 owner elixir every ~8.5s (~8 over its life, +2 net) -- VERIFY

  # ---- your deck --------------------------------------------------
  musketeer:
    display: "Musketeer"
    elixir: 4
    kind: troop
    rarity: rare
    attacks: [air, ground]
    movement: ground
    speed: medium
    range: long
    splash: false
    count: 1
    win_condition: false
    targets: any
    flags: [ranged]
    evolution: {available: true, effect: "charged long-range shot with knockback", gains: [knockback, extra_range]}
    verified: true
    hitpoints: null
    damage: null
    hit_speed: null

  tesla:
    display: "Tesla"
    elixir: 4
    kind: building
    rarity: rare
    attacks: [air, ground]
    movement: none
    speed: null
    range: short
    splash: false
    count: 1
    win_condition: false
    targets: any
    flags: [ranged, hides]

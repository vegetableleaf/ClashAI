      damage: 220
      hit_speed: 1.1
      dps: 200               # 220 / 1.1
      lifetime: 25           # seconds (a normal building is ~40)
      # PULSE. Not on a timer: "after surfacing and deployment". Its death pulse existed only
      # between 14/5/2024 and 8/10/2024 and is gone, so deploy + every surfacing is the whole set.
      pulse_damage: 174      # published level-11 Pulse Damage (147 here was the pre-9/4/2025 value)
      pulse_radius: 6        # published Pulse Radius, tiles
      pulse_stun: 0.5        # published Pulse Stun Duration
    verified: true
    hitpoints: null
    damage: null
    hit_speed: null

  bomber:
    display: "Bomber"
    elixir: 2
    kind: troop
    rarity: rare
    attacks: [ground]
    movement: ground
    speed: medium
    range: short
    splash: true
    count: 1
    win_condition: false
    targets: any
    flags: [ranged, splash, ground_only]
    evolution: null
    verified: true
    hitpoints: null
    damage: null
    hit_speed: null

  # EVO BOMBER: still the same ranged splash bomber (stats overlay from the imported bomber_evo
  # row, 332 hp), plus BOUNCING BOMBS: "After the initial throw, the bomb will bounce twice,
  # 2.5 tiles apart in a straight line, dealing the same damage as the initial hit" (2.5 since

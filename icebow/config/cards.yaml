  # ---- pre-filled win conditions + siege (2026-07-26) -----------------------------
  # STRATEGIC TAGS ONLY (win_condition/targets/flags); combat stats come from
  # cards_stats.json by key. verified:false => please review. Add/remove as you see fit.
  royal_giant:
    display: "Royal Giant"
    win_condition: true
    targets: buildings_only
    flags: [ranged, building_targeting]
    range: long
    verified: false

  golem:
    display: "Golem"
    win_condition: true
    targets: buildings_only
    # "When defeated, the Golem explodes, dealing damage, INFLICTING KNOCKBACK, while spawning two
    # Golemites" -- the knockback rides on the DEATH blast, not on its melee swing.
    # SPLIT-ON-DEATH (2026-08-11): the split was never wired, so in the sim the Golem simply
    # VANISHED when killed -- the defender got the whole 8-elixir tank for free and never had to
    # answer the second wave. `spawns.on_death` is the same death-burst path the Tombstone uses;
    # with no `interval` it fires ONLY on death, which is exactly the Golem's behaviour.
    # death_damage 225 = the Fandom Card Statistics table at LEVEL 11 (this file's reference level,
    # cards_stats.json meta.level), which the import left null -- so the death blast did nothing.
    spawns: {unit: golemite, on_death: 2}
    death_damage: 225            # L11 Fandom; radius 2.0 tiles already imported (death_radius_tiles)
    flags: [tank, building_targeting, knockback, death_damage]
    range: melee
    verified: true

  lava_hound:
    display: "Lava Hound"
    win_condition: true
    targets: buildings_only
    # "When defeated, it bursts into six spread-out Lava Pups" (Fandom; Lava Pup Attributes = x6).
    # The Hound is the SHIELD, the Pups are the damage -- without this split the sim's LavaLoon
    # opponents were a slow 7-elixir balloon that died to nothing, so the policy never learned that
    # killing the Hound is when the fight actually starts.
    # NO death damage: "the Lava Hound in Clash Royale does not have death damage" (Fandom trivia).
    spawns: {unit: lava_pups, on_death: 6}
    flags: [flying, building_targeting]
    range: melee
    verified: true

  ram_rider:
    display: "Ram Rider"
    win_condition: true
    targets: buildings_only
    flags: [building_targeting, charge]
    range: melee
    verified: false

  # 2026-08-15 wiki: "When defeated, it drops a bomb which explodes after 3 seconds."
  # Its SHOTS do not shove -- only the bomb it drops when it dies does (user, 2026-08-16). The
  # single knockback_tiles field applied to both, so every lobbed shell was pushing the push back
  # and the tower defended far better than the real one. Split: 0 on the attack, 1.0 on the death
  # blast, which is the "drops a bomb which explodes after 3 seconds" the wiki describes.
  bomb_tower: {death_delay_s: 3.0, knockback_tiles: 0, death_knockback_tiles: 1.0, verified: true}

  battle_ram:
    display: "Battle Ram"
    win_condition: true
    targets: buildings_only
    # 2026-08-15 wiki: "After it travels 3 tiles, it will begin to charge ... deals double
    # damage (573 @11) if it hits whilst charging. Once it reaches a building or it is
    # destroyed, it will break and reveal the two Barbarians underneath." kamikaze = the
    # connect IS the break; the barbs come out via the death-spawn path either way.
    flags: [building_targeting, charge, kamikaze]
    charge_damage: 573
    charge_range: 3.0
    spawns: {unit: barbarians, on_death: 2}
    range: melee
    verified: true

  wall_breakers:
    display: "Wall Breakers"
    win_condition: true
    targets: buildings_only
    # 2026-08-15 wiki attr row: "area-damage ... 1.5" -- the barrel blast is AREA (radius
    # 1.5), so troops standing beside the building it connects with are damaged too.
    flags: [building_targeting, kamikaze, splash]
    splash_radius_tiles: 1.5
    range: melee
    verified: true

  goblin_giant:
    display: "Goblin Giant"
    win_condition: true
    targets: buildings_only
    flags: [tank, building_targeting, spawner]
    range: melee
    verified: false

  elixir_golem:
    display: "Elixir Golem"
    win_condition: true
    targets: buildings_only
    # Splits TWICE: Elixir Golem -> 2 Elixir Golemites -> 2 Elixir Blobs each (4 blobs). The chain
    # is automatic -- build_spec resolves a spawn unit's OWN `spawns`, so the golemite entry below
    # carries the second split and the blobs (which spawn nothing) terminate it.
    # THE DRAWBACK IS THE POINT: every death in the chain REFUNDS ELIXIR TO THE OPPONENT --
    # Golem 1 + 2 Golemites x0.5 + 4 Blobs x0.5 = up to 4 elixir back for a 3-elixir card. Modelled
    # via `elixir_on_death` (sim/engine.py pays it to the other team on death), so the sim can no
    # longer learn that Elixir Golem is free value.
    spawns: {unit: elixir_golemite, on_death: 2}
    elixir_on_death: 1.0
    flags: [building_targeting]
    range: melee
    verified: true

  royal_hogs:
    display: "Royal Hogs"
    win_condition: true
    targets: buildings_only
    # ABREAST, not a 2x2 (owner 2026-08-25): the four hogs enter side by side and fan into separate
    # lanes. Matters for SPLASH GEOMETRY -- a block fits inside one Log/Arrows radius, four abreast
    # do not, so modelling them as a block over-values the cheap spell answer.
    flags: [building_targeting, swarm, line_formation]
    range: melee
    verified: false

  electro_giant:
    display: "Electro Giant"
    win_condition: true
    targets: buildings_only
    flags: [tank, building_targeting]
    range: melee
    # ZAP PACK (wiki): units damaging him within 3 tiles take ~120 (L11) back + a 0.5s stun; off

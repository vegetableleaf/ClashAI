    # NB the wiki's rendered stat table still reads crown_11 = 48 (the pre-6/7/2026 25% value); the
    # two history pages are the current source, not the table.
    crown_tower_damage: 39
                               # (wiki-style reduced value; USER VERIFY exact number). Without it the sim
                               # let him chip towers at full damage -> the king-snipe exploit.
    verified: false


    reflect_damage: 120
    reflect_radius_tiles: 3.0
    reflect_stun_s: 0.5
    verified: false

  skeleton_barrel:
    display: "Skeleton Barrel"
    win_condition: true
    targets: buildings_only
    # "Once the Skeleton Barrel reaches a building or is destroyed, the barrel drops, dealing area
    # damage, INFLICTING KNOCKBACK, and spawning seven Skeletons in a circle." The barrel itself
    # deals NO contact damage -- the drop IS its death (kamikaze), so reaching the tower and being
    # shot down produce the same blast (death_damage 145 / 2.0 tiles from the import) + 7 skeletons.
    # (The imported `damage` row is the spawned skeleton's swing, zeroed here for the barrel body.)
    # 2026-08-16 wiki: "the player must account for the 0.5 SECOND ANIMATION where neither the
    # Barrel nor the Skeletons are considered as entities; if the spell is cast during this
    # phase, it will not affect the Skeletons." The blast + knockback land when the barrel
    # breaks; the seven bodies arrive 0.5 s later. That gap is the whole timing skill: a log
    # thrown AT the falling barrel hits nothing, so it must be timed to land after the split.
    # (Tornado can still displace the barrel during the animation -- not modelled.)
    flags: [flying, building_targeting, swarm, knockback, kamikaze]
    damage: 0
    dps: 0
    death_spawn_delay_s: 0.5
    spawns: {unit: skeletons, on_death: 7}
    range: melee
    verified: true

  goblin_drill:
    display: "Goblin Drill"
    win_condition: true
    targets: buildings_only
    # "when it surfaces, it will deal damage to enemy units around it in a 360 area around it, and
    # INFLICT KNOCKBACK" -- the surfacing blast, published as spawn_damage 84 / spawn_crown_damage 26.
    flags: [spawner, building_targeting, deploy_anywhere, knockback]   # drills up anywhere, same as the Miner
    # "Every 3 seconds... summon a Goblin"; "when defeated, it will also spawn two Goblins". The
    # intro prose still says the first wave is 0.8s, but the 6/10/2025 balance change raised it to
    # 1s -- the History section is newer than the prose, so the delay is overridden here.
    # Spawn Period 3.0s -- the wiki calls it the FASTEST of all buildings -- on a 10s lifetime,
    # the SHORTEST of all buildings. Both were prose above and neither was in the data, so the
    # threat model could not price what the drill actually puts on the board.
    spawns: {unit: goblins, count: 1, on_death: 2, delay: 1.0, interval: 3.0}
    lifetime_s: 10.0
    verified: true

  graveyard:
    display: "Graveyard"
    win_condition: true
    targets: null
    flags: [spawner, swarm]
    # 2026-08-15 wiki: "After 2.2 seconds, it spawns a single Skeleton ... every 0.5 seconds
    # for 9 seconds on the edge of the spell's radius" (x12, radius 4). It was resolving as
    # an 81-damage BLAST that spawned NOTHING -- the classic siege-killing archetype simply
    # did not exist in training.
    kind: spell
    radius_tiles: 4.0
    damage: 0                 # the spell itself deals no damage; the Skeletons do
    crown_tower_damage: 0
    zone_s: 9.0
    zone_spawn_n: 12
    zone_spawn_start_s: 2.2
    zone_spawn_gap_s: 0.5
    zone_spawn_edge: true
    spawn_unit: skeletons     # per-body stats (81/81 @11, the card's hp/dmg ARE per body)
    verified: true


  # troop back 4 tiles towards the nearest enemy Crown Tower", weight-independent (buildings
  # excepted, as always). The shove re-enters his own jump band -- the uppercut-jump loop.
  mega_knight_evo: {uppercut_tiles: 4.0, verified: true}
  # EVO EXECUTIONER: "the Axe Smash ability ... pushes foes back two tiles. The range for this
  # attack is 3.5 tiles, and it is effective on Ground and Air"; the shove resets charges.
  executioner_evo: {smash_range_tiles: 3.5, smash_knockback_tiles: 2.0, verified: true}

  # ---- attack RANGE curation (2026-07-26; reach = melee|short|long; verified:false => review) ------
  # Adds `range` to troops that had none (combat stats still come from cards_stats.json). Powers
  # card_threat.melee (a melee attacker) for the planned melee tornado-pull-activate behaviour.
  # Left UNCURATED on purpose: terry, wizard_trio (special troops -- not in normal 1v1s).
  # -- melee --
  # "If there are ground units between 3.5 and 6 tiles of her, she will stop moving and begin
  # charging a dash attack which takes 0.8 seconds to execute, and will deal double damage. She is
  # IMMUNE TO DAMAGE during her dash." (dash_damage / dash_time_s are imported; the trigger band and
  # the immunity live in the lead PROSE, so they are curated.) Balance history confirms the minimum:
  # 12/2/2018 "decreased her minimum dash range to 3.5 tiles (from 4 tiles)".
  bandit: {range: melee, leap_min_tiles: 3.5, leap_max_tiles: 6.0, leap_speed_tiles: 8.33, leap_invulnerable: true, leap_towers: true, verified: true}
  barbarians: {range: melee, attacks: [ground], count: 5, flags: [swarm], verified: false}
  bats: {range: melee, verified: false}
  # EVO BATS: "every time they attack, [they] heal themselves, having two healing pulses with a
  # 0.5 second interval. The healing can OVERHEAL them ... up to double their initial hitpoints."
  # 76 hp/s at the level-11 row x 1.3 s hit speed = ~99 per attack (both pulses folded into the
  # swing on our 0.1 s grid); cap 244 = 2 x their 122 deploy hp. Spawn hp 150% flows from import.
  bats_evo: {hit_heal: 99, overheal_frac: 2.0, verified: true}
  battle_healer: {range: melee, verified: false}
  berserker: {range: melee, verified: false}
  # SAME dash as the Bandit, word for word: "If there are ground units between 3.5 and 6 tiles of
  # her, she will stop moving and begin charging a dash attack which takes 0.8 seconds to execute,
  # and will deal double damage" (dash_damage 489 / dash_time_s 0.8 are imported). NOTE she is NOT
  # described as immune during it -- that line is the Bandit's alone -- so no leap_invulnerable.
  # ABILITY "Getaway Grenade", 1 elixir: "get invisible for one second, then teleport 6 tiles behind
  # her current spot", 3 s cooldown after the duration, ONLY TWICE per deployment.
  boss_bandit: {range: melee, leap_min_tiles: 3.5, leap_max_tiles: 6.0, leap_speed_tiles: 8.33, leap_towers: true,
                ability_cost: 1, ability_uses: 2, ability_cooldown_s: 3.0,
                ability_invis_s: 1.0, ability_back_tiles: 6.0, verified: true}
  # KNOCKBACK-IMMUNE HEAVIES. Sourced from the Bowler page, whose pushback "functions identically to
  # a Fireball, Giant Snowball, or Rocket, pushing back small to medium sized ground troops, and
  # minimally damaging heavy troops such as the Prince, Sparky, Dark Prince, Skeleton King, Giant
  # Skeleton, Goblin Machine, P.E.K.K.A, Mega Knight, Cannon Cart, and the Mighty Miner".
  # CURATED because CR's underlying mass is NOT a published field and NO KB property separates these
  # from vulnerable troops -- measured: Sparky (immune, 1451 hp) sits below Knight (vulnerable, 1766),
  # and goblin_machine / cannon_cart / mighty_miner share collision radius 0.50 with plain Goblins.
  # The Log ignores this list entirely (see its knockback_all flag).
  dark_prince: {range: melee, flags: [splash, knockback_immune], splash_radius_tiles: 1.25, charge_splash_radius_tiles: 2.2, verified: true}   # splash swing 1.25 tiles, widened to 2.2 on a CHARGED strike (user-verified); was silently single-target
  elite_barbarians: {range: melee, verified: false}
  fire_spirit: {range: melee, verified: false}
  # Fisherman (Fandom attributes): hook range 3.5-7, hook time 1.3s, hook projectile speed 800.
  # Lead quote: his ranged hook pulls ENEMY TROOPS toward him and pulls HIMSELF to enemy buildings.
  # Current history also lists his slow as 1.5s at -30%.
  fisherman:
    range: melee
    flags: [slow]
    slow_duration_s: 1.5
    slow_pct: -30
    hook_min_tiles: 3.5
    hook_max_tiles: 7.0
    hook_time_s: 1.3
    hook_speed_tiles: 13.33
    verified: true
  giant_skeleton: {range: melee, attacks: [ground], targets: any, flags: [tank, death_damage, knockback, knockback_immune], verified: true}   # 6e GROUND-targeting tank (Fandom: Target=Ground -- it fights troops, it is NOT building-targeting); the DEATH BOMB is the real threat, so kill it away from your tower -- and it "explodes ... dealing damage ... and inflicting knockback"
  goblins: {range: melee, verified: false}
  goblin_gang: {range: melee, verified: false}
  golden_knight: {range: melee, verified: false}
  guards: {range: melee, verified: false}
  heal_spirit: {range: melee, verified: false}
  ice_golem: {range: melee, attacks: [ground], targets: buildings_only, flags: [mini_tank, death_damage], verified: false}   # 2e kiting mini-tank, death SLOW
  # LUMBERJACK. "Upon death, he drops a bottle of Rage" boosting friendly troops' AND buildings'
  # move + attack speed. Balance log: radius 3 tiles + duration 4.5 s (Aug 2025), boost +30%
  # (10/6/2025, down from 35%), 0.5 s deploy timer before the zone takes effect.
  lumberjack: {range: melee, drops_rage: {radius_tiles: 3.0, duration_s: 4.5, boost: 0.30, delay_s: 0.5}, verified: true}
  # "If there are ground units between 3.5 and 5 tiles of him, he will stop moving and begin charging
  # a jump attack which takes 0.9 seconds to execute, and will deal double damage, and inflict
  # knockback." Same mechanic as the Bandit's dash, narrower band, no immunity.
  # The leap numbers come from the card's SECOND attributes row, which the importer does not read:
  #   Jump Time 0.9 sec | Jump Speed 250 | Jump Range 3.5-5 | Splash Radius 2.2 | Transport Air
  # 60 speed units = 1 tile/s, so Jump Speed 250 = 4.17 tiles/s. The 0.9 s is the WIND-UP, not the
  # flight -- the balance log says "decreased the time required for CHARGING his jump to 0.9
  # seconds". His JUMP splash (2.2) is far wider than his normal swing (1.3).
  mega_knight: {range: melee, attacks: [ground], flags: [tank, splash, knockback, knockback_immune], leap_min_tiles: 3.5, leap_max_tiles: 5.0, leap_speed_tiles: 4.17, leap_splash_tiles: 2.2, leap_towers: true, verified: true}   # 7e tank whose spawn/jump SPLASHES -- do not answer it with a swarm; a building pulls it. "he will deal damage to enemy units around him in a 360 area ... and inflict knockback" (spawn_damage 430 over splash_radius 1.3). He DOES jump crown towers; his "Mega Power Jump" modifier only lifts the DISTANCE limit.
  mighty_miner: {range: melee, flags: [knockback_immune], verified: false}
  # "the first 2 attacks deal normal damage, while the 3rd strike deals extra damage and knockback,
  # EVEN IF the targeted troop is normally immune to knockback" -> combo_every 3 + knockback_all.
  # The 3rd hit's EXTRA DAMAGE is not published, so only the shove is modelled.
  monk: {range: melee, flags: [knockback, knockback_all], combo_every: 3, verified: false}
  night_witch: {range: melee, flags: [spawner], spawns: {unit: bats, count: 2, on_death: 1, delay: 1.0}, verified: true}   # "a group of two Bats" every 5s, first wave 1s; "when defeated, she will also spawn a single Bat"
  pekka: {range: melee, attacks: [ground], flags: [tank, knockback_immune], verified: false}     # 7e single-target bruiser, GROUND only -> swarm it, or chip it with a building while it walks
  prince: {range: melee, flags: [knockback_immune], verified: false}
  # RASCALS. The girls' body is MUCH smaller than the boy's (user-verified) -- sharing the card-level
  # 0.75 collision radius made them tank-sized. Index-aligned with the KB component rows: [boy, girls].
  rascals: {range: melee, component_collision_tiles: [0.75, 0.45], verified: true}
  # ROYAL GHOST. "Upon deployment, he will spawn invisible, and will only turn visible once he
  # attacks. If he is in his invisible state, he will not be targeted by opposing units, but can
  # still be hit by area damage or spells. When he is not fighting any unit for 1.8 seconds, he will
  # become invisible again." 1.8 is from the HISTORY -- 7/6/2022 "increased the time required for
  # turning invisible to 1.8 seconds (from 1.6)", after 4/6/2018 took it to 1.6 from 1.2. The
  # attributes table still prints "Invisibility Time 2 sec", which the dated balance log contradicts.
  # He is an AREA-damage troop ("a fast, area-damage, ground-targeting, melee, ground troop"), which
  # the import missed entirely. That he takes splash while invisible is explicit: 8/4/2022 "fixed an
  # issue where an invisible Royal Ghost was not receiving splash damage".
  royal_ghost: {range: melee, splash: true, flags: [splash], invisibility_time_s: 1.8, verified: true}
  royal_recruits: {range: melee, flags: [shield], verified: false}   # each recruit carries a shield
  rune_giant: {range: melee, verified: false}
  skeleton_king: {range: melee, attacks: [ground], flags: [mini_tank, splash, knockback_immune], verified: false}   # splash slash; radius 1.3 flows from the stats import; was silently single-target
  # SUSPICIOUS BUSH. The imported row was the BUSH GOBLINS' stats pinned on the parent -- the bush
  # itself has 81 hp (skeleton-tier), never attacks, and "spawns invisible as it moves towards the
  # nearest building ... invisible to troops, like the Royal Ghost" (towers ignore ghosts too;
  # splash and spells still connect). "Once the Suspicious Bush either reaches a building or is
  # defeated, it will spawn two Bush Goblins" -- kamikaze arrival, same shape as Skeleton Barrel.
  # It stays invisible for life because the ghost refade rule keys on fighting, and it never fights.
  suspicious_bush:
    display: "Suspicious Bush"
    targets: buildings_only
    flags: [building_targeting, kamikaze]
    invisibility_time_s: 1.8
    hitpoints: 81
    damage: 0
    dps: 0
    hit_speed: 1.4
    range: melee
    range_tiles: 0.5
    speed_tiles: 1.0
    spawns: {unit: bush_goblin, on_death: 2}
    verified: true

  bush_goblin:                     # the two goblins the bush breaks into -- a spawned body, NOT a
    display: "Bush Goblin"         # deployable card. Wiki: 304 hp / 227 damage at level 11,
    elixir: null                   # single-target melee ground troops; cadence + reach + speed
    kind: troop                    # from the import's spawn_unit_stats row (1.4s / 0.8t / 1.0t-s).
    rarity: rare
    attacks: [ground]
    movement: ground
    range: melee
    splash: false
    count: 1
    win_condition: false
    hitpoints: 304
    damage: 227
    hit_speed: 1.4
    range_tiles: 0.8
    speed_tiles: 1.0
    deploy_time: 0.2
    evolution: null
    verified: true
  # -- short --
  electro_spirit: {range: short, multi: chain, hits_per_attack: 9, verified: false}
  # HUNTER: 10 pellets of 84 (published as "84 x10"), each an individual hit, scattered across a
  # cone -- the damage falloff is what the cone DOES to a target of fixed size, not a rule. The
  # half-angle is the one number the wiki never prints (24/1/2018 only says it "slightly decreased
  # his bullet spread"). 18 degrees is set so that point-blank all ten connect, which is what his
  # published DPS of 84 x 10 / 2.2 assumes, and so his maximum range still lands what the previous
  # hardcoded falloff produced -- a mechanic fix, not a rebalance.
  hunter: {range: short, attacks: [air, ground], flags: [ranged], multi: shotgun, spread_degrees: 18, verified: true}
  minion_horde: {range: short, movement: air, attacks: [air, ground], speed: fast, count: 6, flags: [flying, swarm, ranged], verified: false}
  # PHOENIX. "When defeated, the Phoenix explodes, dealing damage, inflicting knockback" (death
  # blast 163/1.5 from the import) -- AND drops an EGG once. "If the egg is not defeated within
  # 3.8 seconds, it will hatch into another Phoenix"; since 7/2/2023 the reborn spawns with 80%
  # of the original's hitpoints and damage, deals NO death damage and drops NO second egg.
  phoenix: {range: short, flags: [knockback], egg: {hatch_s: 3.8, reborn_frac: 0.8}, verified: true}
  skeleton_dragons: {range: short, verified: false}
  # -- long --
  archer_queen: {range: long, verified: false}
  # "The Bowler launches an attack that travels up to its maximum range, and inflicts knockback,
  # while piercing through enemies" -- the ONLY card here whose knockback is its NORMAL ATTACK
  # rather than a death blast, so it rides the piercing projectile and shoves along the roll line.
  # The Bowler page is also the source of the knockback-immune list (see dark_prince).
  bowler: {range: long, attacks: [ground], splash: true, flags: [splash, knockback], verified: false}
  cannon_cart: {range: long, flags: [knockback_immune], verified: false}
  dart_goblin: {range: long, attacks: [air, ground], speed: fast, flags: [ranged], verified: false}
  electro_dragon: {range: long, multi: chain, verified: true}
  # "If 2 or more targets are within his range, his attack will SPLIT and attack the closest 2
  # units" -- his 115 damage is the TOTAL (115 / 1.8 hit speed == his published dps 64), so it is
  # halved when two things are in range. Contrast the Electro Dragon, whose bolt "arcs and strikes
  # up to 2 OTHER targets" for full damage each.
  electro_wizard: {range: long, multi: split, spawn_damage: 115, spawn_radius_tiles: 3.0, verified: true}   # SPAWN ZAP: damages + STUNS around him on deploy (115 dmg / 3.0 tiles, USER-VERIFIED); the stun rides via his `stuns` flag now that _deploy_blast applies status
  executioner: {range: long, multi: boomerang, verified: true}
  firecracker: {range: long, multi: spark, verified: true}
  flying_machine: {range: long, verified: false}
  inferno_dragon: {range: long, targets: any, flags: [ranged, flying], verified: false}   # 4e FLYING tank-melter (ramping single-target) -> needs AIR defence; a swarm or a reset stops the ramp
  # LITTLE PRINCE (user bug report): the imported row carried the GUARDIAN's stats -- hp 1600,
  # damage 217, and his dash's charge_damage 256 -- so the sim's Little Prince hit like the
  # bodyguard. Real level-11 champion: 653 hp, 98 damage (stage-1 dps 82 x 1.2 s), NO charge.
  # His cadence RAMPS while attacking from the same spot: every 3 attacks the stage steps
  # 1.2 s -> 0.8 s -> 0.4 s (dps 82 -> 123 -> 247, the published anchors; 3-attack stages since
  # 17/11/2023), and ANY movement or displacement (knockback/stun shove) resets it (14/12/2023
  # fix). The Guardian ability itself remains unmodeled (champion abilities are out of scope).
  little_prince:
    range: long
    hitpoints: 653
    damage: 98
    dps: 82
    hit_speed: 1.2
    charge_damage: 0
    attack_ramp: {per_stage: 3, mults: [1.0, 1.5, 3.0]}
    verified: true
  magic_archer: {range: long, flags: [splash], verified: false}                # 4e PIERCING line hit (damages everything behind the target)
  # Mother Witch page carries two unit rows (witch + cursed hog). The importer currently binds the
  # hog row's hp/dmg onto the card body, so the witch herself is corrected here from the page's
  # level-11 vardefines (hp_11=529, dmg_11=133, atk_speed=1.0) and keeps her own 5 s curse timer.
  mother_witch:
    range: long
    hitpoints: 529
    damage: 133
    hit_speed: 1.0
    dps: 133
    curse_duration_s: 5.0
    verified: true
  princess: {range: long, flags: [splash], verified: false}                    # 3e glass cannon: longest range in the game, AREA arrow, ~200hp -> any spell kills it
  sparky: {range: long, attacks: [ground], flags: [splash, knockback_immune], verified: false}   # 6e glass cannon: huge AREA hit on a ~4s cycle, GROUND only -> swarm/surround it or spell it before it fires
  spear_goblins: {range: long, verified: false}
  witch: {range: long, flags: [splash, spawner], spawns: {unit: skeletons, count: 4, delay: 1.0}, verified: true}   # 5e AREA support: "a group of four Skeletons" every 7s, first wave 1s after deploy
  zappies: {range: long, verified: false}
  # -- MULTI-HIT MECHANICS. The wiki gives `hits_per_attack` as one number but it covers four
  # unrelated behaviours, so only the KIND is curated (the count stays imported). Damage is PER HIT
  # and the published dps counts only one, so before this these cards were 2-10x too weak.
  #   chain     the bolt arcs on to further targets, carrying the stun (each takes the FULL hit)
  #   split     ONE attack DIVIDED between the closest N targets -- the published damage is the
  #             TOTAL, so counting it per target doubles the card (Electro Wizard only)
  #   boomerang the axe flies out AND back, damaging on both passes
  #   spark     sparks spray outward from where the rocket lands, not from the firer
  #   shotgun   a cone of pellets: nearly all connect point-blank, few at max range
  # These used to be SEPARATE `card: {multi: ...}` entries further down the file, which made them
  # DUPLICATE YAML KEYS -- PyYAML silently keeps the last, so the earlier entry was discarded and
  # hunter lost its curated `flags: [ranged]` without any error. Merged into the entries above.
  # -- SPAWNERS. The wiki's attribute table gives the TIMINGS (spawn_interval_s / spawn_delay_s /
  # spawn_range_tiles, imported into cards_stats.json) but never names the card being summoned nor
  # HOW MANY appear per tick -- both of those live in the page's intro prose, so they are curated
  # here and quoted alongside. `unit` must be a real KB key; `count` is units per spawn tick;
  # `on_death` is the burst when the spawner dies. `interval`/`delay` are OVERRIDES, used only where
  # the attribute table is provably stale (see tombstone).
  # `spawn_range_tiles` present => the spawner only ticks while an enemy is inside it (Goblin Hut
  # stopped spawning automatically in the May 2025 update); absent => it spawns unconditionally.
  goblin_hut: {kind: building, flags: [spawner], spawns: {unit: spear_goblins, count: 1, on_death: 1}, verified: true}   # "summon a Spear Goblin" every 2.2s when an enemy is in range; death spawn cut to 1 (from 3) on 6/6/2023
  # Tombstone: the attribute table says 4s but the prose says 3.5s AND the Common modifier says
  # "spawn speed is doubled, for a total of 1.75 seconds" -- 3.5/2 = 1.75, so the TABLE is stale.
  tombstone: {kind: building, flags: [spawner], spawns: {unit: skeletons, count: 2, on_death: 4, interval: 3.5}, verified: true}   # "a group of two Skeletons, with a 0.5 seconds delay from each other"
  barbarian_hut: {kind: building, flags: [spawner], spawns: {unit: barbarians, count: 3, on_death: 1}, verified: true}   # "a group of three Barbarians" every 15s; "when defeated, it will also spawn a Barbarian"
  # GOBLIN CAGE. "When defeated, it will spawn a Goblin Brawler." The importer folded the BRAWLER's
  # stats into the cage -- hitpoints 1080 / damage 337 are his, and a cage does not attack at all.
  # The wiki keeps them apart as `cage_hp_11 = 780` and `hp_11 = 1080`, so the cage is the 780-hp
  # body and the Brawler is curated below as a spawn-only unit. Its lifetime expiry releases him too,
  # because a lifetime is modelled as hp decay and therefore runs through the same death path.
  goblin_cage: {kind: building, hitpoints: 780, damage: 0, dps: 0, spawns: {unit: goblin_brawler, on_death: 1}, verified: true}
  # Goblin Brawler: not a playable card, so there is no import to merge with -- every number here is
  # from the Goblin Cage attribute table's second row. "He is also the same as that spawned by the
  # Party Hut." Speed Fast (90) = 1.5 tiles/s at the wiki's 60 units = 1 tile/s.
  goblin_brawler:
    display: "Goblin Brawler"
    kind: troop
    rarity: rare
    hitpoints: 1080
    damage: 337
    hit_speed: 1.1
    range_tiles: 0.8        # "Melee: Short (0.8)"
    speed_tiles: 1.5        # "Fast (90)"
    attacks: [ground]
    movement: ground
    targets: any
    count: 1
    range: melee
    splash: false
    win_condition: false
    verified: true
  # -- clarified dual / special-attack troops (user-provided) --
  cannon: {kind: building, range: short, attacks: [ground], targets: any, flags: [ranged], verified: false}   # 3e defensive building, GROUND only (cannot touch air); the cheap pull vs ground win conditions
  # FURNACE IS A TROOP, not a building: the 4/8/2025 update "changed the Furnace into a troop that
  # can walk and deal damage". Its wiki table reads Type: Troop, Speed Medium (60), Range 6, and it
  # has no `life` vardefine because a troop has no lifetime. An earlier curation here forced
  # `kind: building` + `lifetime: 40` on the assumption that the table was a wiki quirk -- it was not,
  # and overriding a correct live source is exactly how a 2023-era belief survives a re-import.
  furnace: {range: long, flags: [spawner], spawns: {unit: fire_spirit, count: 1}, verified: true}   # "summon a Fire Spirit in front" every 7s -- ONE, not a pair
  goblin_machine: {range: melee, flags: [splash, knockback_immune], verified: false}              # melee body + a locking AOE missile
  goblin_demolisher: {range: long, flags: [ranged, splash, death_damage, knockback], verified: false}   # "dealing high damage and inflicting knockback after defeat"
  # STILL NOT MODELLED, and why:
  #   mega_knight  -- his JUMP blast (jump_damage 537 / jump_time_s 0.9) needs a leap mechanic; his
  #                   LANDING blast IS modelled (spawn_damage)
  #   mighty_miner -- the bomb dropped by his ABILITY. Champion abilities have no engine hook at all
  #                   and the bomb's damage is not in the KB, so there is nothing to source it from.
  goblinstein: {range: melee, flags: [tank, building_targeting, stun], verified: false}  # front melee tank (NOT a win condition); rear ranged + stun
  spirit_empress: {range: melee, verified: false}                               # GROUND form (3e single-target melee); air form is ranged flying

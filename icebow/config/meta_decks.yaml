# Meta opponent decks for the sim (each = 8 card keys from the card KB).
#
# The ~100 curated most-popular archetypes/variants come FIRST (higher weights = sampled more),
# followed by procedurally-generated DISTINCT valid decks (each a win condition + small/big spell +
# optional building + support troops, avg elixir 2.7-4.7).
#
# 2026-08-07: 598 generated decks were DROPPED because they contained EVENT-ONLY cards (party_*,
# super_*, heal, warmth, terry, wizard_trio, santa_hog_rider, raging_prince, rocket_silo,
# barbarian_launcher) -- those do not exist in trophy ladder, so training against them taught the
# policy to answer threats it will never face. All 100 curated decks were clean. That left 402;
# refill with `run.py decks-import`, which now filters event decks out at the source.
#
# `run.py decks-import` (official Clash Royale API + a free token) OVERWRITES this file with the current
# top-N DISTINCT most-played decks; this committed set is the no-token fallback. A deck is used only if
# all 8 cards resolve in the KB; `weight` biases how often it is sampled (rough popularity).

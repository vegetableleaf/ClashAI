# Meta opponent decks for the sim (each = 8 card keys from the card KB).
#
# `run.py decks-import` (official Clash Royale API + your free token) OVERWRITES this file with
# the current top-N DISTINCT most-played decks from top-ladder battle logs. This committed set is
# a curated fallback of the ~100 most popular archetypes/variants so the sim has varied, realistic
# opponents out of the box (no API token needed). A deck is used only if all 8 cards resolve in the
# KB; `weight` biases how often it is sampled (rough popularity).

# =====================================================================
# Learning ClashBot ("real") configuration.
# Play + capture happen on PC via Google Play Games, so the agent trains on
# and plays on the exact same rendering. Region is in PHYSICAL pixels (the
# process runs DPI-aware), reused from the trol calibration.
# =====================================================================

window:
  title_contains: "Clash Royale"
  region: null   # 4 physical px [left, top, width, height] of the game render, or null to auto-detect the window by title (do NOT write [null] -- that is a 1-item list and errors)

capture:
  work_width: 480                # frames scaled to this width for vision

# --- Hand card slots (normalized centres, from the trol calibration) ------
hand:
  slots: [[0.308, 0.887], [0.485, 0.887], [0.660, 0.884], [0.854, 0.884]]
  click_radius: 0.06            # a click near a slot's x, in the tray band, = selecting that card
  # Card-identity recognition: the policy acts on WHICH card identity to play (not
  # the tray slot, which cycles). An EVOLVED card is its own identity (`<key>_evo`)
  # separate from the normal card, since it plays differently; champions are their
  # own cards already. Each slot's portrait is cropped (card_w/card_h are half-
  # width/half-height around the slot centre) and matched against
  # templates/cards/<identity>.png -- extra crops of one identity are allowed and
  # help (name them <identity>_2.png, ...). Build these from a recording with
  # `run.py hand-templates` and check with `run.py verify --hand`.
  templates_dir: "templates/cards"
  card_w: 0.055                 # half-width of a hand-card portrait crop (normalized)
  card_h: 0.045                 # half-height of a hand-card portrait crop (normalized)
  match_threshold: 0.5          # min normalized template-match score to accept an identity
  # The "next card" preview sits to the LEFT of the tray and is drawn smaller. Feeding its
  # identity to the policy lets it plan cycles (hold a cheap card to line up a counter).
  # The values below are an ESTIMATE -- calibrate with `run.py verify --hand`: the next-card
  # box is drawn in cyan; nudge next_slot / next_card_w / next_card_h until it frames it.
  next_slot: [0.090, 0.965]     # normalized centre of the next-card PORTRAIT (the card, below the "Next:" label)
  next_card_w: 0.045            # half-width of the next-card crop
  next_card_h: 0.030            # half-height of the next-card crop
  next_top_frac: 0.6            # match only the TOP fraction of the card (skip the elixir badge + "1sec" cycle timer)
  next_templates_dir: "templates/next"  # the next preview is a SMALLER, blue-tinted rendering -> its own template set

# --- Elixir bar reading (YOUR elixir; from the trol calibration) ---------
# Only your elixir is on screen (the opponent's is hidden), so this gives your
# affordability, not a full elixir trade. Counts filled (magenta) pips.
elixir:
  bar_y: 0.971
  pip_xs: [0.312, 0.369, 0.440, 0.506, 0.577, 0.635, 0.708, 0.775, 0.850, 0.917]
  filled_hsv_lower: [140, 60, 120]
  filled_hsv_upper: [175, 255, 255]
  # --- 2x / 3x elixir CLOCK (src/clashrl/clock.py -> feeds the icebow offense->defense phase machine) ---
  # The multiplier is read TWO ways and CROSS-CHECKED; the CLOCK is AUTHORITATIVE (only ever RISES):
  #   TIME  -- elapsed since the match started. Works with NO calibration; lags the real clock by
  #            however long IN_MATCH took to detect (~1-2s) -- fine for the coarse 2x/3x gate.
  #   BADGE -- template-match the on-screen "x2"/"x3" indicator. OPTIONAL cross-check: drop
  #            templates/elixir_2x.png + elixir_3x.png (any crop scale) -- checked vs the clock, and
  #            the CLOCK WINS any disagreement (the mismatch is logged as a calibration hint).
  double_time_s: 120           # elapsed seconds when DOUBLE elixir starts (regulation 180 - last 60s)
  triple_time_s: 180           # elapsed seconds when TRIPLE elixir starts (overtime)
  x2_template: elixir_2x.png   # optional PNG in templates/ for the on-screen "x2" badge (null => time only)
  x3_template: elixir_3x.png   # optional PNG in templates/ for the on-screen "x3" badge
  badge_threshold: 0.7         # min template-match score to accept a badge

# --- Scripted menu navigation (reused from trol) --------------------------
# The learned policy only plays cards in-match; queueing/exiting is scripted so
# the bot runs match-to-match unattended. Values + templates come from trol.
buttons:
  battle_button: [0.492, 0.771]  # HOME -> queues a 1v1 match directly (auto-queue; no party/quick-match step)
  quick_match:   [0.690, 0.555]  # (unused in 1v1; kept for reference)
  play_again:    [0.335, 0.905]  # 1v1 results screen -> re-queue immediately ("Play Again", bottom-left); tapped by default so the match loop continues without returning HOME
  play_again_template: play_again.png   # optional PNG in templates/ (e.g. play_again.png) to LOCATE the button each frame -- robust
  play_again_threshold: 0.8      # to layout/window drift. null => fixed play_again coord + the OK-button escalation only.
  results_ok:    [0.645, 0.905]  # 1v1 results screen -> "OK" (bottom-right, returns HOME) -- fallback only
  results_ok_center: [0.5, 0.905] # "OK only" results variant (Play Again removed): the single CENTERED OK button
  results_ok_dc: [0.645, 0.905]  # no disconnect screen in 1v1 -> same as OK
  # In-match emote/chat icon (bottom-left). Tapping it opens the emote wheel and the bot
  # gets stuck, so card placements are nudged UP out of this box (from trol's emote button).
  chat_avoid_box: [0.0, 0.79, 0.185, 0.90]

states:
  home_menu:  {template: "home_menu.png",  threshold: 0.55}   # lowered: the "Daily Bonus" sub-banner + capture drift drop the Battle-button match (~0.6); nav taps where it locates it
  party_menu: {template: "party_menu.png", threshold: 0.80}
  # At OVERTIME the game replaces the 'Time left:' label with the red/orange OVERTIME plate, so
  # in_match.png alone reads UNKNOWN mid-OT (bot froze). Second entry = STRICT banner template:
  # own high threshold + top-right search window, fires only on a near-perfect plate match
  # (measured: real OT 0.65-0.95 across sessions, menus/results <= 0.57 -- scale drift means it
  # will MISS sometimes, which is fine: play's in_match grace hold covers the misses, and the
  # strictness is what keeps it from ever re-breaking menu navigation like the first attempt).
  # in_match_v2.png = the RESTYLED 'Time left:' text band after the 2026-08 game update (new dark
  # rounded plate; the old crop flatlined at ~0.49 on new footage). The OLD in_match.png stays
  # listed so pre-update recordings (verify / label / outcome mining) still read correctly.
  in_match:
    threshold: 0.80
    templates:
      - "in_match.png"
      - "in_match_v2.png"
      - {template: "in_match_ot.png", threshold: 0.85, region: [0.66, 0.00, 1.00, 0.12]}
  match_end:  {templates: ["match_end.png", "match_end_dc.png"], threshold: 0.80}

nav:
  poll_hz: 6                     # how often play() re-checks the screen state
  menu_delay: 0.5                # wait after a menu tap before re-checking (lower = faster match-to-match transitions)
  match_end_timeout: 6           # seconds tapping "Play Again" with NO progress before ESCALATING to the OK button
                                 # (-> HOME -> located Battle), so a drifted/covered Play Again button can't hang nav

# --- Recording human play (screen + mouse) for imitation data ------------
record:
  fps: 12                        # frames/sec captured while you play
  out_dir: "data/sessions"       # each session saved under icebow/data/sessions/<timestamp>/
  log_moves: false               # also log mouse-move paths during drags (bigger files)

# --- Labeling: pair your clicks into card plays (select slot -> place) -----
label:
  pair_timeout: 3.0              # max seconds between selecting a card and placing it
  arena_top: 0.10               # placement clicks fall in this normalized y-band...
  arena_bottom: 0.86            # ...below this is the card tray (slot selects)

# --- Observation the agent sees (used by the imitation + RL pipeline) -----
observation:
  arena_size: [64, 96]           # downscaled arena image (w, h) fed to the CNN
  # --- Stage 3: identity-grounded threat features (detector -> obs) ------------------------------
  # When ON, the policy's THREAT vector gains a 10-feature IDENTITY block (card_threat.IDENTITY_DIM):
  # for RECOGNISED enemy cards it exposes their KB role (tank / swarm / air / building / win-condition /
  # building-targeter) + how deep they are + their APPROACH VELOCITY + a PREDICTED depth `predict_horizon_s`
  # ahead (where the push will be when a defender finishes deploying) so the policy counters by identity
  # AND anticipates motion, not just red blobs. PLUS an 8-feature opponent SHORT-TERM MEMORY block
  # (card_threat.OPP_MEMORY_DIM): the archetype/roles SEEN this match, opponent avg elixir, recent tempo,
  # and back-line STAGING (troops massing on THEIR half) -- the strategic "who is this / what are they
  # building" read the reactive identity block can't give (answers 'see opponent-side plays', not just
  # your half). The SIM builds both from ground truth (filtered to `detector_cards` to mimic the detector's
  # coverage); LIVE builds them from the detector. Both GROW-safe: adding whitelist cards needs NO retrain.
  # Flipping this changes threat_dim (16 <-> 34 = 16 base + 10 identity + 8 memory) -> a FRESH train-sim +
  # train-rl (init train-rl from the SIM checkpoint so the wide block carries; NB train-bc caps threats at 16).
  use_detector: true            # Stage-3 gate: add the identity + memory blocks (needs a trained detector live)
  # Stage-3b gate: the troop-INTERACTION block -- an engineered predictor of WHO IS MOVING AT WHOM using
  # CR's deterministic targeting rules (building-targeters ignore troops; ground-only attackers can't take
  # air; else nearest-in-sight, else march at the nearest alive tower). The policy sees a fixed 12-dim
  # TOWER-PRESSURE summary: per tower (your L/R/king, then theirs) the incoming elixir-value predicted to
  # be heading at it + an urgency (nearest attacker's ETA). SIM builds it from ground truth (whitelist +
  # recall-noise scoped); LIVE from the detector's tagged tracks. Flipping this WIDENS threat_dim (+12 ->
  # 46 with the detector blocks) = a FRESH train-sim + re-label, so flip it at the NEXT from-scratch run.
  use_interactions: true
  # --- DOMAIN RANDOMIZATION of the sim's synthetic render (sim2real for the CNN branch) ---
  # The conv trunk only ever sees the synthetic canvas; live it meets real pixels (and each new
  # ARENA repaints them) fully out-of-distribution -- measured: the live cell argmax collapsed to
  # one corner regardless of the board while the same net placed 11 distinct cells on sim obs.
  # Per-MATCH restyle (stable within a match, different across matches, like arena rotation):
  # background/river palette jitter, mild team-colour jitter (blue-vs-red identity is SIGNAL),
  # global gain/bias, additive noise. Training envs only -- the eval benchmark renders canonical.
  domain_rand:
    enabled: true
    bg_jitter: 55          # +- per BGR channel on grass/river colours
    team_jitter: 25        # +- on unit/tower colours (mild; keeps blue-vs-red separable)
    gain: [0.7, 1.25]      # global contrast multiplier range
    bias: [-25, 25]        # global brightness offset range
    noise: 6.0             # max additive uniform pixel noise
  detector_conf: 0.40            # LIVE: only trust a detection at/above this confidence. board-14 SWEEP retuned
                                 # 0.45 -> 0.40: whitelist R 0.704 -> 0.724 for 0.2pp of precision (0.912 -> 0.910)
                                 # -- effectively free recall. presence(units) R 0.732 -> 0.749 / P 0.920 -> 0.915.
                                 # 0.35 buys another +1.1pp recall but costs 0.7pp precision; held back until the
                                 # canvas obs channel is live and phantom boxes have a measurable cost.
                                 # Re-tune per detector generation (sweep, don't inherit).
  # PER-CLASS gate overrides (base card key -> conf). A SINGLE global threshold assumes every class is
  # calibrated the same way; measured on board-16 they are not. Breaking each class's val misses into
  # blind / low-conf / wrong-class showed the failure modes differ completely:
  #   hog_rider  R 0.33 @0.40 with precision 1.00, R 0.42 @0.30 STILL 1.00  -- purely over-gated
  #   knight     R 0.57/P 0.78 @0.40 -> R 0.62/P 0.80 @0.30                 -- better on BOTH axes
  #   tesla/x_bow gain ~nothing below 0.40 and only shed precision          -- leave them high
  #   guards     gains NO recall at any gate, precision collapses 0.75->0.50 -- lowering is pure loss
  # Detection runs at the LOWEST gate in play and each box is judged against its own class's
  # threshold, so lowering one card costs nothing anywhere else. Variants share their BASE key's gate.
  # EMPTY ON PURPOSE: those numbers come from ONE generation on 12-63 val instances, and the sparky
  # lesson (0.50/0.75/0.62 across three generations on n=8 was noise) says an override needs a STABLE
  # measurement ACROSS generations. Populate only after board-17 and board-18 agree, using
  # `run.py detect-eval --sweep --subset data/detect/val_board15.txt`.
  detector_conf_by_card: {}
  perception_hz: 10              # CONTINUOUS PERCEPTION: the detector + team tracker run in a background thread
                                 # at this rate; the act loop reads a fresh snapshot at decision time (staleness
                                 # <= 1 period instead of 'blind since the last act'), tracker velocities are
                                 # finely sampled (rocket lead / motion team evidence), and the preview window's
                                 # boxes become near-realtime. This is a CEILING: measured single-frame detect is
                                 # ~121ms on the RTX 5050 (~8 Hz free, ~5-7 Hz while train-rl shares the GPU); the
                                 # loop self-regulates to whatever the hardware sustains.
                                 # 0 = classic synchronous mode (one detector pass per decision).
  predict_horizon_s: 1.0         # look-ahead for the predicted post-deploy depth (~a defender's deploy time)
  # SIM-ONLY detector realism: simulate the live YOLO detector's imperfect recall/precision on the sim's
  # GROUND-TRUTH identity + memory blocks, so the sim PRIOR trains on a sparse/noisy threat signal like it
  # gets live -> narrows the sim-to-real gap. 1.0/1.0 = perfect (old behaviour). Applied to BOTH the agent's
  # and the self-play opponent's identity block; LIVE play ignores these (it uses the real detector).
  # VALUES BELOW = the CURRENT detector (board-16: leak-free bank + SYNTH 1000, which beat board-15's
  # synth 2000 on every gate metric on an IDENTICAL 241-image val subset -- whitelist R 0.704 -> 0.726
  # AND P 0.906 -> 0.929, i.e. better on both axes at once). Measured BASE-FOLDED on the WHITELIST at
  # the LIVE gate (detector_conf 0.40). Re-measure after each retrain: `run.py detect-eval --sweep
  # --subset data/detect/val_board15.txt` (the subset keeps generations comparable as val grows).
  sim_detector_recall: 0.72      # GLOBAL fallback (mid-tier + thin-val cards): matches the measured 0.726 mean
  sim_detector_precision: 0.92   # ~8% of seen detections relabelled (measured folded 0.929 @0.40)
  # Optional PER-CARD recall override -> falls back to sim_detector_recall for any card NOT listed.
  # Values are the MEAN across board-14/15/16, NOT the latest run: at n=48 val instances the binomial
  # SE is ~7pp, so knight reading 0.56 -> 0.67 -> 0.54 across three generations is NOISE around ~0.59,
  # and chasing the newest number would re-tune the sim every time. Only cards whose 3-generation mean
  # sits clearly off the global rate are listed; everything else stays on the global.
  sim_detector_recall_by_card:
    # reliable
    balloon: 0.90                # 1.00 / 1.00 / 1.00 (n=11) -- capped, a perfect thin-val score is not a real 1.0
    ice_wizard: 0.90             # 0.92 / 0.93 / 0.88 (n=85) -- the best-supported card in the set
    cannon: 0.85                 # 0.85 / 0.85 / 0.92 (n=13)
    royal_recruit: 0.80          # 0.80 / 0.80 / 0.85 (n=40)
    ronin: 0.74                  # 0.77 / 0.77 / 0.69 (n=13)
    # weak
    mega_knight: 0.65            # 0.56 / 0.67 / 0.72 (n=18) -- trending up but wide
    knight: 0.58                 # 0.56 / 0.67 / 0.54 (n=48) -- the mean; see the SE note above
    ice_spirit: 0.45             # 0.42 / 0.47 / 0.47 (n=19)
    hog_rider: 0.42              # 0.50 / 0.42 / 0.33 (n=12)
    # (skeletons 0.69-0.74 / miner 0.70-0.76 / musketeer ~= global -> unlisted. DROPPED bowler: 0.75 /
    #  0.75 / 0.50 on n=8 is the sparky pattern -- an unstable thin-val card belongs on the global rate.)
  # LIVE team assignment (own-play ground truth overrides the colour guess so your units aren't read as
  # enemy threats). A TROOP you play is tagged 'mine' at its spawn, then tracked as it advances.
  team_spawn_radius: 0.10        # a detection within this (normalized) of a card you just played = yours
  team_spawn_window_s: 2.5       # ...for this long after a YOUR-HALF play (kept short so an enemy engaging your
                                 # fresh defender near its spawn isn't hidden as 'mine' for long)
  team_enemy_window_s: 4.0       # ENEMY-HALF plays (Miner etc.) linger at their target -> a longer window keeps
                                 # them tagged 'mine' for their whole life without over-tagging your-side engagements
  team_track_radius: 0.12        # keep 'mine' as the unit moves: within this of last frame's allied unit
  team_forget_s: 4.5             # a tracked own unit missed by the detector is CARRIED this long (frozen in place)
                                 # before the tag lapses -- bridges ~2-3 missed reads at the act cadence, so a Miner
                                 # digging at the red enemy tower doesn't flip to 'enemy' the first time a read misses it.
                                 # Tracks link by CARD IDENTITY (same base card only), so the longer memory can't leak
                                 # 'mine' onto the enemy defenders answering it.
  team_motion_min: 0.05          # EVIDENCE FUSION (TeamTracker): net y drift since first seen that counts as
                                 # MARCHING (units advance toward the enemy: up = mine, down = enemy -- decisive
                                 # for the team-colourless rolling Log); below it (idle units, buildings,
                                 # knockback jitter) motion abstains. Raise if slow tanks flip verdicts early.
  team_deep_mine_y: 0.62         # first seen BELOW this = born deep in MY half -> 'mine' prior... unless that lane's
  team_deep_enemy_y: 0.38        # (resp. ABOVE = enemy prior) -- princess is DOWN: a taken tower opens the deploy
                                 # POCKET on the loser's side of the lane, so the prior is voided there (set_towers).
                                 # Widen the middle band (raise mine / lower enemy) if bridge drops get mis-sided.
  flying_shadow_offset: 0.045    # FLYING units are drawn ABOVE the ground -> their detector box sits too high.
                                 # Shift a flyer's read DOWN by this (normalized frame height) to its SHADOW = the
                                 # true tile, so spell targeting + depth/movement prediction use where it really is.
                                 # 0 disables. Calibrate to the visible sprite->shadow gap (detect-obs / verify --threats).
  detector_cards:                # ENEMY TROOPS the detector RELIABLY names (BASE keys; evo/hero variants fold in via
                                 # card_threat.base_key -- so `knight` also covers knight_hero). ONLY these fire the
                                 # identity block. GROW freely as you label more: the identity vector is a FIXED role
                                 # aggregate, so adding cards needs NO retrain (resume-safe). From board-13 per-base recall.
    # -- reliable (val recall >= 0.6) --
    - ice_wizard
    - royal_recruit
    - skeletons
    - ronin
    - knight
    - princess
    - archers
    - witch
    - sparky
    - baby_dragon
    - musketeer
    - giant_skeleton
    - inferno_dragon
    - balloon                    # PROMOTED board-12: R 1.00, n=11 -- a top air win condition, lights wc+air flags
    - cannon                     # PROMOTED board-12: R 0.88, n=8 -- common defensive building
    # -- moderate (recall ~0.4-0.6, strong train; high precision so a firing is trustworthy) --
    - miner
    - ice_spirit
    - hog_rider
    - bowler
    - magic_archer
    - ice_golem
    - hunter
    - royal_hogs
    - pekka
    - lava_hound
    - mega_knight
    # -- HOLD until labelled (broken/unmeasured on board-13; ADD here once recall is proven -- NO retrain needed):
    #    valkyrie (R 0.33 -- DIAGNOSED 2026-08-06, NOT an annotation problem: box-geometry CoV 0.37 is as tight as
    #    knight/mega_knight. The detector FINDS 6/12 correctly but 2 of them at conf 0.14, and mislabels 4 more as
    #    lookalike humanoid melee (wizard_hero/ronin/hunter) at conf 0.08-0.42 => it is UNDER-TRAINED + low-confidence,
    #    not mislabelled. Only 62 real train instances vs knight 206 / ice_wizard 468, and the val boxes come from ~4
    #    scenes. FIX = more REAL valkyrie frames with POSE variety (esp. mid-spin: the one blank miss had h=0.064 vs
    #    the 0.042 median); copy-paste can't help here since it replays the same 72 sprites = no new poses),
    #    guards (0.17), dart_goblin (0.00), wizard (0.44), electro_wizard (0.20), golden_knight (~0),
    #    bats (0.43, +29pp off synth -- close), barbarians (0.67 but n=6), goblins, lumberjack,
    #    spear_goblins (0.75, n=4), skeleton_king (0.94, n=4), skeleton_army

# --- Discrete action space (card slot x placement grid) ------------------
action:
  grid: [18, 24]                 # placement grid: columns x rows. COARSENED 32->24 rows (576->432 cells) to shrink
                                 # the action space so DQN explores it faster (the 18x32 one-cell-per-tile grid
                                 # plateaued ~54% below the old coarse-grid peak -- testing if 576 was too fine).
                                 # NOTE: no longer exactly one cell per board tile (18 wide x 32 tall); rows are grouped.
  arena_box: [0.03, 0.10, 0.97, 0.86]  # normalized [x0,y0,x1,y1] of the arena PLAYFIELD the grid is anchored to
                                 # (defaults to env.arena_region if unset). Calibrate to the visible grass corners so
                                 # a cell centre lines up with a tile centre; the board's mild perspective makes this
                                 # a close approximation, not a pixel-exact map. Changing grid/arena_box needs a RETRAIN.
  deploy_top: 0.44               # troops can only deploy on YOUR half (below the river); a cell above this y is clamped
                                 # DOWN so the card actually deploys (spells target anywhere). 0.44 (was 0.47) opens the
                                 # central grass just below the river -- the deployable space in front of your towers.
  king_avoid_half: [0.09, 0.06]  # half-size of YOUR king tower's footprint (around the my_towers king anchor). A troop
                                 # cell landing on it is pulled to the row just in front -- you can't deploy on your own tower.
  princess_avoid_half: [0.06, 0.05]  # same, per each of YOUR two PRINCESS towers (my_towers[0..1]) -- smaller footprint than the king

# --- Reward shaping (RL fine-tune) ---------------------------------------
# CORRECTNESS-FIRST: the model is rewarded for PLAYING THE GAME CORRECTLY (read the
# threat -> counter it in-lane, trade elixir UP, execute the win condition, cycle toward
# the counter it needs next), NOT for winning. The block below is one coherent score of a
# few bounded sub-terms; the sim (ground truth) and the live env (perception) share it.
rewards:
  # ============================================================================================
  # CORRECTNESS-FIRST reward. Winning is NOT the objective -- PLAYING THE GAME CORRECTLY is. One
  # coherent score of a few bounded sub-terms (below) replaces the old ~40 patchwork rewards. The
  # policy is taught to read the YOLO->KB threat, play its hand's KB-correct COUNTER placed to
  # intercept, trade elixir UP, execute the deck's win condition, and CYCLE toward the counters it
  # needs next. Correctness DOMINATES; the match outcome is only a faint compass. Shared by the sim
  # (ground truth) and the live env (perception) -- see sim/env.py + env.py reward assembly.
  # ============================================================================================
  # -- (1) THREAT-RESPONSE correctness (YOLO -> KB -> the right counter, placed to intercept) --
  threat_response: 1.0     # played the KB-correct counter to the ASSESSED threat, in its lane on your half
  threat_miss: -1.0        # wrong-role card dropped as a defence, OR ignored an ANSWERABLE threat (a counter was in hand + affordable). Uncapped.
  # -- (2) ELIXIR-TRADE correctness (the honest economy: value removed - elixir spent) --
  elixir_trade: 1.0        # x [ (signed potential-based enemy value/mass eliminated, clipped) - elixir spent ] / value_norm. Telescopes -> idling can't farm it.
  # -- (3) WIN-CONDITION execution (the deck's doctrine done right for the current phase) --
  wincon_exec: 0.8         # X-Bow forward-in-range (offence) / back-centre (defence), Miner chips the princess, rocket-cycle chip
  wincon_misplace: -0.6    # the win condition thrown away (X-Bow out of range / king-hugged, Miner on the enemy KING)
  xbow_deep_frac: 0.25     # (soft) a defensive X-Bow placed BEHIND your princess towers earns only this fraction of wincon_exec
                           #   -- the full credit sits in the centre band behind the bridge (env.xbow_defense_front/back)
  rocket_combo_mult: 3.0   # rocket 2-for-1 (a princess tower + a one-shottable support in ONE blast) = wincon_exec x this
  # -- (4) CYCLE-PLAN correctness (uses the deterministic upcoming-card order; see clashrl/cycle.py) --
  cycle_plan: 0.4          # a CHEAP play at spare elixir that advances toward a NEEDED counter you don't hold but the deck does
  cycle_waste: -0.4        # purposeless cheap spam (no cycling plan and no spare elixir)
  # -- (5) tempo / economy --
  leak_penalty: -0.2       # sitting at elixir capacity with nothing played this step (leaking)
  spell_waste: -0.3        # (soft, shapable) a DAMAGE spell (rocket/log/RD) cast with NO unit in its blast AND not aimed at a tower = a whiff into emptiness. Kept small so it nudges, not forces.
  # -- TORNADO execution credit (positive-only, soft, inside correctness_cap): the pull's value is
  # COMPOSITE + DELAYED (clump -> splash/rocket payoff, king activation, dragging a wincon off a
  # tower), which outcome terms barely see. Measured from engine ground truth ~2-3.5s after the
  # cast; train.n_step carries the credit back to the cast action. spell_waste still penalizes an
  # EMPTY tornado, so these only pay for pulls that actually do something.
  nado_clump: 0.25         # per EXTRA enemy gathered at the vortex centre (2 -> +0.25, 4+ -> +0.75)
  nado_combo: 0.6          # >=2 pulled enemies dead within ~3.5s (ice-wizard splash / rocket on the clump)
  nado_king_activate: 0.5  # a pull woke your sleeping king tower (once per match)
  nado_retarget: 0.4       # dragged a tower-locked wincon (hog etc.) off your tower (lost hits)
  correctness_cap: 20.0    # per-match ceiling on POSITIVE shaping (terms 1,3,4) -- anti-farm; penalties + trade + outcome are uncapped
  # -- (6) OUTCOME compass (DEMOTED: winning is not the objective, only a faint direction) --
  win: 2.0                 # small: the correctness score accumulated over a whole match dominates this
  loss: -2.0
  take_enemy_tower: 1.0    # CROWN JUMP: destroying a tower is a big discrete reward -- a tower at 1-2 HP still fully works
  lose_own_tower: -1.0     # the matching defensive jump when YOUR princess/king falls
  tower_chip_scale: 0.3    # CONVEX chip POOL per tower (with env.tower_chip_power): PARTIAL chip is worth sub-proportionally
                           # little, so the reward JUMPS on the crown (take), not gradually with damage. Total chip << the crown.
  hp_scale: 0.5            # (no longer scales the reward -- tower_hp still reads it; the convex chip proxy replaced its linear return)

# --- Automatic win/loss detection (results scoreboard) -------------------
# Reads the 2v2 end screen: YOUR team (blue) sits on the BOTTOM, the enemy
# (red) on TOP, each with 3 crown cushions above its name banner. Detection
# anchors to the coloured banners (found by a row-wise colour vote) so it is
# robust to the banners sliding in, then counts gold crowns per team. Used by
# `run.py outcomes` and, later, as the RL terminal reward. HSV is OpenCV-style
# (H 0-179). Override only if a UI/theme change breaks detection.
outcome:
  gold_frac: 0.10                # min gold fraction in a cushion cell to count a crown
  cushion_xs: [0.25, 0.49, 0.72] # normalized x-centres of the 3 crown cushions
  cushion_offsets: [0.06, 0.08, 0.10, 0.12, 0.14]  # y-gaps above a banner to scan for its crowns
  banner_min_frac: 0.45          # a name banner must span >= this fraction of the width
  settle_reads: 8                # keep reading the results screen until the crown total holds
                                 # steady this many frames -- crowns animate in one-by-one, so
                                 # stopping as soon as the board appears can miss the last crown

# --- DQN / training hyperparameters (RL fine-tune) -----------------------
train:
  device: "cuda"                 # "cuda" (GPU) or "cpu"
  gamma: 0.99
  n_step: 3                      # N-STEP returns (sim trainer): each transition's target carries the next N real rewards
                                 # + a bootstrap N states ahead -> consequences (overspend -> counter-push -> tower damage)
                                 # reach the CAUSING action's target directly = faster/stronger cause-and-effect credit.
                                 # 1 = classic 1-step TD (old behaviour). Small values (3-5) are standard (Rainbow uses 3).
  # --- STABILITY LEVERS (if the sim benchmark OSCILLATES: peak-then-decline / a swinging fair avg) ---
  # lower lr, raise target_sync, and/or grow replay_size to damp Double-DQN value oscillation. Try lr 5e-5
  # + target_sync 1000 first; sim.selfplay_keep_best also tackles the self-play side of the instability.
  lr: 0.00005                    # learning rate -- LOWERED 1e-4 -> 5e-5 to damp Double-DQN value oscillation (decline-from-peak). Shared by train-sim + train-rl
  batch_size: 64
  replay_size: 100000            # bigger replay = more decorrelated batches = steadier bootstrap targets
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 3000      # linear exploration decay (in agent steps)
  # LIVE fine-tune exploration (train-rl only; falls back to epsilon_* when absent). A converged sim
  # policy must NOT re-explore from eps 1.0 on the ladder -- that is ~60-75 matches of random play.
  rl_epsilon_start: 0.10
  rl_epsilon_end: 0.05
  rl_epsilon_decay_steps: 1000
  explore_wait_prob: 0.2         # while exploring, chance of a no-op (lowered so it commits to plays more)
  min_play_elixir: 2             # while exploring, don't play a card below this elixir
  min_replay: 200                # transitions to collect before learning starts
  target_sync: 1500              # steps between target-network syncs -- RAISED 500 -> 1500 to slow the bootstrap target + steady training (anti-oscillation)
  grad_clip: 10.0                # max global grad-norm per Double-DQN update (stabilises noisy TD targets)
  save_every_matches: 1          # checkpoint cadence during RL
  bc_epochs: 10                  # behaviour-cloning pretrain epochs
  checkpoint: "data/policy.pt"       # behaviour-cloning policy (train-bc writes this)
  rl_checkpoint: "data/policy_rl.pt" # RL fine-tuned policy; `play` prefers this if present
  sim_checkpoint: "data/policy_sim.pt" # SIMULATOR-trained prior (train-sim); warm-start live train-rl from it
  sim_ppo_checkpoint: "data/policy_sim_ppo.pt" # PPO sibling (train-sim-ppo) -- separate file so the DDQN baseline is never clobbered
  # timelapse: capture the whole train-rl run and compress it to a fixed-length video
  # (however long training lasts, the mp4 is always timelapse_seconds long at timelapse_fps)
  timelapse: true                # record a training timelapse during train-rl
  timelapse_seconds: 30          # length of the output video (exactly this many seconds)
  timelapse_fps: 60              # output frame rate -> timelapse_seconds * timelapse_fps frames total
  timelapse_width: 640           # downscale width for the timelapse frames
  timelapse_dir: "data/timelapses"   # each train-rl run saves timelapse_<date_time>.mp4 in this folder

# --- Live RL environment + in-match tower reward -------------------------
# The RL loop plays real matches. Tower shaping rewards taking enemy towers and
# penalises losing yours; a tower is read "alive" by team colour at its anchor
# and only latched destroyed after a few sustained empty reads (rubble is grey,
# towers never rebuild), so troop occlusion won't fake it. Set tower_shaping
# false to learn from the (robust) win/loss reward alone. Anchors are normalized
# (x, y); order is [left princess, right princess, king]. Calibrate if a tower
# event never/always fires.
env:
  # -- CORRECTNESS-reward geometry (used by the threat_response / elixir_trade / cycle_plan terms) --
  intercept_lane: 0.15           # same-lane tolerance: a counter within this |x| of the threat counts as placed to intercept
  cycle_cheap_max: 3             # a played card at/below this elixir counts as a CYCLE card (cycle_plan / cycle_waste)
  cycle_spare_elixir: 7.0        # 'spare elixir' threshold: cycling toward a needed counter is rewarded only at/above this
  value_norm: 10.0               # elixir-value normaliser for the trade term (this many elixir of value/spend per step = 1.0)
  trade_cap: 1.0                 # per-step clip on the (normalised) enemy-value-eliminated part of the trade term
  tower_chip_power: 2.0          # convexity of the tower-chip reward: >1 -> PARTIAL chip worth sub-proportionally little
                                 #   (reward = sum over towers of damage_frac**this * tower_chip_scale). The crown is the jump.
  tower_shaping: true
  tower_alive_frac: 0.03         # min team-colour fraction at an anchor to count "alive"
  tower_confirm_steps: 3         # consecutive empty reads before a tower is latched destroyed
  results_timeout: 30.0          # max seconds to wait for the results screen at match end
  enemy_towers: [[0.25, 0.205], [0.745, 0.205], [0.48, 0.11]]
  my_towers:    [[0.245, 0.615], [0.745, 0.615], [0.48, 0.72]]
  # Chip-damage reward: read each princess tower's printed HP with a digit CNN
  # and reward *partial* HP loss (rocket chip, etc.) even when the tower survives.
  # HP is piecewise-constant + monotonic, so a value is only accepted after it
  # reads the same on `hp_consensus` frames -> near-zero false damage. Damage is
  # normalized by hp_full (a full tower's worth of chip = rewards.hp_scale).
  # Boxes are white HP-number crops (crown excluded), normalized [x0,y0,x1,y1]. They can
  # be TALL: the reader locks onto the digit row band inside the box (a strict near-white
  # mask), so the same box tolerates HP bars sitting at different heights (different tower
  # troops -- Cannoneer / Dagger Duchess / Royal Chef) and small window drift. Check the
  # alignment with verify --towers; keep the box centred over where the number can appear.
  # Needs torch + hp_digits.npz; falls back to no-op if missing. hp_reward false
  # disables it (relies on the destruction latch + win/loss instead).
  hp_reward: true                # 1v1: read printed tower HP -> chip-damage reward (digit CNN retrained on 1v1 lvl 14-15 towers via tools/hp_ocr)
  hp_full: 4032                  # ENEMY princess full HP (~level 14, 1v1) -- enemy seed + offence-chip normaliser
  my_hp_full: 4424               # YOUR princess full HP (~level 15, 1v1) -- your seed + defence-chip normaliser
  hp_consensus: 2                # consecutive equal reads before a new HP is confirmed
  hp_min_conf: 0.55              # min mean per-digit CNN confidence to use a read
  hp_max_chip: 1500              # reject drops bigger than this (misread guard; allows a rocket)
  enemy_tower_hp_boxes: [[0.147, 0.110, 0.278, 0.157], [0.645, 0.110, 0.797, 0.157]]
  my_tower_hp_boxes:    [[0.185, 0.612, 0.298, 0.657], [0.685, 0.612, 0.798, 0.657]]
  # KING HP-number boxes -- read by `verify --towers` for the E-king / M-king alignment check.
  enemy_king_hp_box: [0.41, 0.015, 0.55, 0.08]
  my_king_hp_box:    [0.41, 0.690, 0.55, 0.77]
  # enemy_mass = enemy-troop (red) pixel fraction over arena_region (HUD/tray + enemy towers excluded);
  # its SIGNED per-step change (clipped +/-defeat_cap) drives the elixir-trade term (potential-based ->
  # idling can't farm it). A spell's effect frame is grabbed at its predicted impact (rocket travel grows
  # ~linearly with distance from rocket_origin at rocket_travel_rate + rocket_base_time; tornado ~ tornado_time).
  spell_effect_reward: true      # gate: sample frames around a spell's impact for the post-cast state read
  arena_region: [0.03, 0.10, 0.97, 0.86]
  defeat_cap: 0.15               # 'full push' enemy-mass scale / per-step clip for the trade term
  spell_eval_time: 2.4           # cap on the predicted impact time / longest spell wait (s)
  rocket_origin: [0.5, 1.05]     # rocket launch point (your side, off-screen); travel time ~ distance from here
  rocket_base_time: 0.3          # fixed part of rocket flight time (s)
  rocket_travel_rate: 2.2        # rocket flight time added per unit distance to target (s)
  tornado_time: 1.2              # seconds from cast to a tornado's effect at the target
  royal_delivery_time: 3.0       # seconds from cast to Royal Delivery's area damage
  spell_tower_aim_radius: 0.12   # target within this of an enemy princess = chip/combo (spell aim + wincon)
  spell_waste_radius: 0.14       # (soft spell_waste) a DAMAGE spell with NO enemy unit within this of its aim + not at a tower = cast into emptiness. Generous so predictive/near-miss casts aren't punished.
  rocket_combo_hp_frac: 1.5      # ROCKET COMBO: an enemy support counts as (almost) one-shottable when its hp <= rocket_dmg x this (captures Musketeer/Hunter/Executioner/Bowler/Witch/Sparky; excludes tanks)
  rocket_combo_radius: 0.11      # ROCKET COMBO: the support must be within this of the aimed princess tower
  # PUMP PUNISH (enemy elixir collector -> rocket): a pump left alive out-economies a control deck, so a
  # FRESH pump is a rocket job -- full win-condition credit, the 2-for-1 multiplier when one blast also
  # clips a princess tower, the misplace penalty if the blast would wake the KING, and the cycle-plan
  # reward treats "rocket not in hand" as a reason to cycle cheap. The sim models the pump's real
  # economy (cards.yaml gen_every_s) so denying production is genuinely valuable, not just shaped.
  pump_rocket_window_s: 12.0     # rocket the pump within this of its appearance; later it has already paid out
  pump_aim_radius: 0.10          # a rocket aimed within this of the SEEN pump counts as the pump punish (live)
  pump_pair_gap: 0.11            # pump within this of a princess tower -> aim assist snaps to the MIDPOINT (hit both)
  pump_king_guard: 0.15          # never aim within this of the enemy KING for a pump (activation costs more than any pump)
  spell_lead_radius: 0.12        # ROCKET LEAD ASSIST: tracked enemies within this of the policy's rocket aim are
                                 # advanced to their PREDICTED position at impact (act latency + distance-scaled
                                 # flight time) and the aim snaps to their centroid -- the policy decides WHEN/WHAT
                                 # to rocket, the assist makes the blast actually land on the marching push.
  enemy_quiet_frac: 0.02         # below this arena troop mass the board is "quiet"
  elixir_full: 10                # elixir at/above this (full bar) + nothing played this step = leak penalty
  defense_threat_frac: 0.02            # min enemy (red) mass in a half of your side to call it "threatened" (lane read)
  wrong_lane_margin: 0.12              # deadband around the 0.48 lane split before a placement counts as wrong-lane (threat_response)
  # X-Bow (win condition) placement geometry: forward within tower range, or the CENTER INTERCEPT band for defence.
  xbow_range: 0.36                     # max normalized distance from the X-Bow to an enemy princess for it to REACH the tower (~11.5 tiles)
  xbow_defense_front: 0.52             # DEFENSIVE "back-centre" band: from just behind the bridge (the central Tesla area)...
  xbow_defense_back: 0.62              # ...down to ~your princess-tower line. BEHIND the towers (deeper) is rarely useful ->
                                       #    earns only rewards.xbow_deep_frac of the win-condition credit (soft nudge, not a punishment)
  xbow_success_frac: 0.30              # OFFENSE->DEFENSE trigger: X-Bow chipped LESS than this fraction of a tower by 2x elixir -> switch to defensive X-Bow + rocket-cycle
  # --- PRESCRIBED PLACEMENTS (aim assists, not shaping: the policy still decides WHEN and WHAT) ----
  # OFFENSIVE X-BOW DEPTH. Reach to the enemy princess is a RADIUS, so the correct row depends on
  # the column. BEHIND A BRIDGE (x ~ 0.25 / 0.75) the bow is nearly in the tower's own lane and
  # still locks it one row back -- and that row is what leaves space to drop a Knight/Tesla IN
  # FRONT of the bow to absorb the answer. OFF-LANE (the central area between the two crossings)
  # the path is diagonal and longer, so it must sit on the frontmost deployable row. Measured
  # against xbow_range 0.36: lane 0.260 front / 0.291 one back (both fine); centre 0.342 front /
  # 0.358 one back (one row deeper and it falls short). No knob needed -- the rule is geometric.
  # TESLA CENTRE-PULL vs a lane win condition: a wincon dropped at one bridge beelines the near
  # tower and only that tower ever shoots it. Placing the Tesla at the FAR EDGE of that wincon's
  # own aggro radius drags it across the middle instead. The pull distance comes from the card's
  # KB sight range, so a 9.5-tile Hog is dragged ~0.22 across while a 5.5-tile Ram Rider moves
  # ~0.12. The band below is the row the Tesla is placed on: behind the bridge, in front of your
  # princess-tower line (0.615).
  tesla_pull_front: 0.52               # ...from just behind the bridge...
  tesla_pull_back: 0.59                # ...to just in front of your princess towers (midpoint is used)
  # SIM matchup doctrine (reads the opponent's style): vs a fast CYCLE / heavy BEATDOWN deck, or a
  # SPLIT-LANE deck built on these wide two-lane win conditions (one X-Bow can't cover both lanes),
  # play defensive X-Bow + rocket-cycle from the start.
  split_lane_counter_cards: [royal_recruits, royal_hogs]
  # Win-condition (tower-targeting troop) detection -> SAVE the Tesla for it. A "win condition"
  # is a troop that heads straight for your tower instead of fighting: it PENETRATES deep into
  # your half (wc_depth: 0 at the river .. 1 at your king) OR CROSSES fast toward it (wc_fast_speed,
  # in delta-depth/second). Seeing one latches "enemy has a win condition" for the match; wc_active
  # tracks one being on the board (wc_confirm reads to arm, wc_release quiet reads to clear). While
  # the enemy has a win condition but none is active the Tesla is HELD (in play + reward-shaped in
  # training); with a win condition active, or none ever seen, the Tesla plays as normal. Calibrate
  # wc_depth / wc_fast_speed with `verify --threats` (a red "WIN-COND" label marks a detection).
  wc_depth: 0.5                        # enemy depth into your half (river 0 -> king 1) that reads as tower-bound
  wc_fast_speed: 0.30                  # OR advance speed (delta-depth/s) flagging a fast tower-targeter (Hog/Ram/Balloon)
  wc_min_mass: 0.004                   # min enemy mass in your half for it to be a real unit (not noise)
  wc_confirm: 2                        # consecutive reads before a win condition is called "active"
  wc_release: 3                        # consecutive quiet reads before "active" clears (hysteresis)

# --- Running the trained policy live -------------------------------------
play:
  act_period: 1.0                # seconds between decisions. LOWERED 1.5 -> 1.0 = the sim's agent_dt (the policy
                                 # trained its reaction timing + per-step reward economics at 1.0s): between
                                 # decisions the model is BLIND, so this bounds its reaction time to a new threat
                                 # (worst case = one period + ~0.2s pipeline). The gate head still no-ops freely,
                                 # so a faster cadence adds decision OPPORTUNITIES, not spam. (The preview window's
                                 # box lag = time since the last decision -- it shrinks with this too.)
  react_min_gap_s: 0.3           # EVENT-DRIVEN REACTIONS: the perception loop WAKES the act loop the moment it
                                 # spots a NEW enemy commitment (rising enemy-detection count vs the last ~1.5s,
                                 # so detector flicker can't fire it) -> trigger-to-action ~0.3-0.45s, pro-human
                                 # reaction, while the quiet-board cadence stays at the trained act_period. This
                                 # is the minimum gap between decisions (rate limit; events inside it coalesce).
                                 # A flat 10-15Hz act loop is deliberately NOT used: the policy's value landscape
                                 # (per-step rewards, gamma horizon, n-step) is trained at agent_dt 1.0s, and the
                                 # detector (121ms) + tap (~0.2s) cap the real pipeline anyway.
  select_delay: 0.08             # delay between selecting a card and placing it
  epsilon: 0.0                   # random-action rate while playing (0 = greedy)
  in_match_grace_s: 150          # OVERTIME failsafe: if the state reads UNKNOWN within this many seconds
                                 # of the last positive IN_MATCH read, play HOLDS in-match (keeps acting)
                                 # instead of freezing -- covers OT when the strict banner template misses
                                 # (label is replaced at OT) + brief label dropouts. Any positively
                                 # identified OTHER screen (MATCH_END/HOME/PARTY) cancels the hold, so
                                 # menus are never grace-held. 150s = 2 min max OT + slack. 0 disables.
  stuck_timeout: 25              # seconds on an UNRECOGNISED screen before tapping to dismiss it. A
                                 # post-match chest/level-up/season/offer popup that detect_state does
                                 # not cover would otherwise hang navigation. Keep this LONGER than your
                                 # typical matchmaking wait so a real search is not cancelled early.
  stuck_tap: [0.645, 0.905]      # where to tap to clear a stuck popup (default = results OK, bottom-right)

# --- Overlay replays: clip the OPENING of every match with the detector's boxes burned in ---
# When enabled, a background thread (its own screen capture, like the preview window) records the
# first `seconds` of EVERY match to out_dir/match_<stamp>.mp4 with draw_detections() overlaid --
# the opening is where placement, the first read of the opponent, and the detector's coverage of a
# clean board are all visible at once. The BOXES refresh at observation.perception_hz (~0.1s, the
# same feed as the preview window), so the clip shows real perception latency rather than hiding it.
# Clips are WALL-CLOCK PACED: if capture can't hit `fps` the newest frame is duplicated to fill the
# missed slots, so playback is always real-time instead of fast-forward. The achieved capture rate
# is printed when each clip closes -- check it if the video looks stuttery.
overlay_replay:
  enabled: true              # master gate
  seconds: 60                # record this much of each match, from the moment IN_MATCH is detected
  max_clips: 5               # HARD CAP per session (process lifetime). train-rl plays unattended for
                             # hours, so an uncapped recorder quietly fills the disk with clips nobody
                             # watches -- and the early ones are the useful ones anyway, since they all
                             # show the same policy. On the last clip the recorder shuts its thread down
                             # rather than idling, so it stops grabbing the screen entirely. 0 = no cap.
  fps: 50                    # clip frame rate (max 60). MEASURED on this machine: grab 14.9ms + draw 0.9
                             # + resize 0.3 + encode 1.0 = 17.1ms/frame => a ~58 fps CEILING with nothing
                             # else running, and the GRAB is 87% of that. 60 is therefore right at the
                             # limit (~1 full core) and will drop slots once train-rl's perception loop
                             # and the preview window are grabbing too -- the pacing keeps the timing
                             # honest, but you get duplicated frames. 30 is the safe smooth setting.
  scale: 0.5                 # downscale before encoding (0.5 = half size; ~25 MB per 60s clip at 60fps)
  out_dir: data/overlayed_replays   # one mp4 per match (falls back to .avi/MJPG if mp4v is missing)

# --- Live detector preview (train-rl side window) ---
# Pops a small window beside the game during train-rl showing each captured frame with the
# detector's team-coloured boxes -- exactly what the policy's perception sees, fed from the SAME
# detector pass the env already runs (no extra inference). The capture is a SCREEN grab, so the
# window must never cover the game: by default it sits just RIGHT of the capture region. Closing
# the window turns it off for the session.
preview:
  enabled: false
  scale: 0.5          # window size as a fraction of the captured frame
  fps: 30             # refresher-thread frame rate: LIVE frames redrawn with the newest detections
                      # (boxes still update at the act cadence ~1.5s = what the policy actually sees)
  pos: null           # [x, y] screen position; null = auto (right of the game window)

# --- Remote monitoring (optional Discord screenshots during long runs) ---
# Posts a screenshot of the game window to Discord when train-rl starts, then a short video CLIP
# every `interval_min` minutes, so you can tell remotely whether it's progressing or stuck. The
# webhook URL is a SECRET: NEVER put it here (this file is committed). Set the env var named below,
# or write the URL into the git-ignored file `webhook_file` (one line). If neither is set, off.
monitor:
  interval_min: 30                       # minutes between clips (0 not allowed; min 1)
  webhook_env: CLASHRL_DISCORD_WEBHOOK   # env var holding your Discord webhook URL (preferred)
  webhook_file: data/discord_webhook.txt # git-ignored fallback file with the URL (data/ is ignored)
  jpeg_quality: 70                       # startup-screenshot JPEG quality (lower = smaller/faster upload)
  clip_seconds: 30                       # length of each periodic video clip (seconds)
  clip_fps: 10                           # clip frame rate (higher = smoother but a bigger upload)
  clip_scale: 0.5                        # downscale the clip (0.5 = half size) to stay under Discord's ~8 MB webhook limit
  overlay_detections: true            # draw the trained YOLO detector's boxes on the periodic clips (enemy=red,
                                         # yours=blue, + card name/conf) so you can SEE what the detector perceives,
                                         # remotely. Loads its OWN detector on the first clip (needs trained weights in
                                         # runs/detect); a brief 2nd model during the 30s clip -- turn off if VRAM is tight.
  overlay_conf: 0.4                      # min detector confidence to draw a box on the clip overlay

# --- Board object detection (YOLO11) dataset bootstrap -------------------
# `run.py autolabel` builds an Ultralytics dataset under detect.dataset_dir from your
# recordings. It AUTO-boxes YOUR OWN just-spawned troops -- a card you play is a known class
# at a known spot, so the unit that appears at the tap (found by a frame diff) is boxed for
# free -- and also exports extra active in-match frames with EMPTY labels for you to hand-label
# the enemy troops/spells in a tool (Label Studio / Roboflow / CVAT). Then train with
# tools/detect/train.py. Class taxonomy: detect.classes_file. The auto labels are a STARTING
# POINT: open each frame and add the units the auto-pass couldn't know (enemy + extra own),
# else the detector learns to treat them as background.
detect:
  classes_file: config/detect_classes.yaml
  # THE OPERATING DETECTOR, pinned. null = use whichever run was trained MOST RECENTLY, which is a
  # trap: newest is not best. Measured 2026-08-07 on the frozen val subset (identical 241 images /
  # 817 boxes for every generation), board-17 trained last but REGRESSED -- whitelist identity
  # recall 0.675 / precision 0.882, failing the 0.70 gate, vs board-16's 0.724 / 0.911 which passes.
  # Its ultralytics mAP50 looked best (0.7144) only because it validated on a larger val set. With
  # no pin, `play` / `train-rl` / `mine-replays` / `label-queue` would all have silently adopted the
  # worse detector. Promote a new generation ONLY after
  # `run.py detect-eval --sweep --subset data/detect/val_board15.txt` beats the incumbent, and
  # re-measure observation.sim_detector_recall* at the same time (they describe THIS detector).
  weights: runs/detect/board-16/weights/best.pt
  dataset_dir: data/detect
  spawn_delay_s: 0.5             # a troop appears ~this long after your placement tap
  spawn_extra_offsets: [0.3, 0.8]  # also try these delays (s) if the first localisation misses
  search_radius: 0.10            # look this far (normalized) around the tap for the new unit
  diff_thresh: 22                # frame-diff threshold to find the spawned unit
  min_blob_px: 30                # ignore diff blobs smaller than this (noise)
  box_pad: 0.008                 # pad the auto box by this (normalized) so it isn't too tight
  general_per_session: 40        # extra active in-match frames per session to hand-label (enemy)
  val_frac: 0.15                 # fraction of exported images held out for validation
  jpeg_quality: 92               # exported frames are JPEG at this quality (labelling-friendly, small)
  label_queue_subdir: to_label   # flat folder UNDER images/ where detect-frames/-timelapse/harvest drop
                                 # NEW frames to hand-label. Import-safe (detect-import never touches it)
                                 # and FLAT so Label Studio Local Storage points straight at it (no train\ backslash bug).
  # ANNOTATION HARVEST -- shared by `train-rl` AND `record`: drop live game frames into images/to_label
  # (empty labels, to hand-label) so a session doubles as detector data collection. Additive and
  # non-destructive (new trl_* stems, flat folder that survives detect-import). Re-sync Label Studio
  # Local Storage to pick them up. `record` only harvests IN_MATCH frames -- it reads the screen state
  # once per capture_every_s so menus and result screens never reach the queue.
  capture_during_train: true    # set false to disable the harvest during train-rl / record
  capture_every_s: 5.0           # one frame every N seconds of match play
  capture_per_match: 20          # cap frames per match
  capture_session_max: 500       # cap frames for the whole train-rl / record session

# --- External-replay strategy mining (Stage 4 groundwork) ----------------
# `run.py mine-replays` distils strong-player rocket-cycle replay VIDEOS into deck-agnostic
# strategy priors (data/analysis/strategy_priors.json): defensive placements, positive elixir
# trades, and when to rocket a tower. It NEEDS the trained board detector (Stage 2/3) to read
# footage that has no mouse log; until then the command reports readiness. Enable the priors in
# training via rewards.strategy_prior_scale (default 0 = off). See clashrl/replay_mine.py.
replay_mine:
  replays_dir: data/detect/HunterCR_replays   # where the replay VIDEOS actually live (mp4/avi/mkv/mov/webm).
                                 # Was data/replays, which never existed -- mine-replays would have found
                                 # nothing and reported "no replays" rather than failing loudly.
  frame_stride: 30               # sample every Nth frame. The footage is 60 fps and ~143 min = ~515k frames,
                                 # so the old stride 3 meant ~172k detector passes (~6 h on this GPU). A card
                                 # can only be PLAYED about once a second, so 2 samples/sec (stride 30) loses
                                 # no placement while cutting the pass to ~17k frames (~35 min). Lower it only
                                 # if you need sub-second timing of a spell's travel.
  detect_conf: 0.30              # detector confidence threshold for a unit to count
  learn_side: bottom             # which player to imitate: the featured/blue player is usually on the bottom
                                 # -- CONFIRMED correct for this footage: Hunter plays the BOTTOM (blue) side.

# --- Headless simulator (train-sim): fast, no-vision RL from scratch ------
# `run.py train-sim` trains the SAME policy against a medium-fidelity, stat-driven match engine
# (clashrl.sim, driven by the card KB) so it can play THOUSANDS of matches with no capture and
# from scratch. The result (data/policy_sim.pt) is a PRIOR to warm-start live train-rl, then
# fine-tune on real matches. Medium fidelity -> expect a sim-to-real gap. See icebow/DECK_SWITCH.md.
sim:
  envs: 8                        # VECTORIZED match instances feeding one learner (batched inference + shared replay); --envs overrides
  agent_dt: 1.0                  # seconds of game time per agent decision (matches the live act cadence)
  sub_dt: 0.1                    # physics sub-tick within each agent step
  regulation_s: 180             # elixir goes single -> double at (regulation-60s); triple in overtime
  overtime_s: 60                # sudden-death window after regulation
  # --- Tower Troops ---------------------------------------------------------------------------------
  # Per-troop HP + DISCRETE-HIT attack, sourced from the Clash Royale Fandom wiki at LEVEL 15 (VERIFY
  # against your in-game cards). Your two princess towers use `my_tower_troop` at `my_tower_level`; the
  # OPPONENT rolls a troop from `opponent_tower_weights` (princess most common on ladder) at a level drawn
  # from `enemy_levels`. hit_dmg is derived as dps*hit_speed; HP + damage scale by 1.1^(level - my_tower_level).
  # BOARD GEOMETRY. The simulated arena is a TILE GRID and every sim distance below is in TILES.
  # Positions stay normalized [0,1] per axis, so ONE normalized unit = 18 tiles across but 32 tiles
  # up: the engine converts to tiles before measuring (a plain hypot made every range ~1.78x shorter
  # horizontally than vertically). The towers are derived FROM these tiles, so the two halves are
  # exactly symmetric about the river at y=0.5 -- previously the sim borrowed env.my_towers /
  # env.enemy_towers, which are LIVE SCREEN coordinates carrying the game's perspective
  # foreshortening, putting your towers 0.115 from the river and the enemy's 0.295 (and breaking the
  # self-play mirror, which reflects about y=0.5).
  board:
    tiles_x: 18                 # arena width in tiles
    tiles_y: 32                 # arena height in tiles
    princess_tile: [3.5, 6.5]   # princess tower centre: tiles from the SIDE wall, tiles from the BACK wall
    king_tile: [9.0, 3.0]       # king tower centre: tiles from the side wall, tiles from the back wall
    bridge_tiles: [3.5, 14.5]   # bridge lane centres in tile-x (aligned with the princess lanes)
    deploy_top: 0.5             # troops deploy on your half only: normalized y of the river
  my_tower_troop: princess      # your equipped tower troop (you play princess exclusively)
  my_tower_level: 15            # your king/tower level -> stats reference level (enemy tower levels scale off this)
  # CROWN TOWER REACH, in tiles, measured from the tower's CENTRE to the target's body EDGE
  # (engine._gap). DERIVED FROM THE BOARD, not a nominal figure: the defender's end of the bridge
  # sits 8.50 tiles from a princess tower's centre (tower 6.5 tiles off the back wall, the river's
  # near bank 15.0), so a standard 0.5-radius troop reads a gap of 8.00 the instant it steps off the
  # brown. At the old 7.5 the tower stayed silent for another half-tile of walking; 8.0 makes it open
  # fire exactly as the troop clears the bridge, and a wider body (Giant 0.75) is caught a shade
  # earlier, which is correct -- more of it is already inside the radius.
  tower_range: 8.0              # TILES: princess-class reach (all tower troops share it)
  king_range: 7.5               # TILES: king-tower reach -- still 0.5 shorter than a princess tower
                                # (the +0.5 is a measurement correction, so it applies to both)
  tower_first_hit: 0.8          # delay before the FIRST shot after (re)acquiring a target (capped by hit_speed)
  opponent_tower_weights:       # relative odds of each OPPONENT tower troop (princess most common in live matches)
    princess: 6
    dagger_duchess: 2
    cannoneer: 2
    royal_chef: 1
  tower_troops:                 # {hp, dps, hit_speed} @ L15; Dagger Duchess + Royal Chef carry their specials
    princess:       {hp: 4424, dps: 197, hit_speed: 0.8}
    dagger_duchess: {hp: 4013, dps: 312, hit_speed: 0.5, ammo: 8, empty_dps: 111, reload_s: 0.9}   # loaded burst -> empty cadence
    cannoneer:      {hp: 3792, dps: 211, hit_speed: 2.2}                                            # slow, heavy single hits
    royal_chef:     {hp: 3918, dps: 158, hit_speed: 1.0, cook_period_s: 30, cook_delay_s: 7, buff_mult: 1.1, buff_min_frac: 0.33}  # ~every 30s feeds the ally troop with most HP (+1 level)
  king_tower:       {hp: 7032, dps: 158, hit_speed: 1.0}                                            # L15 King's Tower (wakes when first hit)
  siege_sight: 11.5             # TILES: X-Bow engage range; locks the tower past this only when no troops are closer
  sight_tiles: 5.5              # TILES: FALLBACK troop aggro radius. Units now use PER-TROOP sight from the game data
                                # (cards.py _SIGHT_TILES, cr-api-data characters.sight_range): most 5.5 tiles, PEKKA/
                                # Giant Skeleton 5.0 (kite-able), building-seekers 7.0-7.7, Hog/Royal Hogs/Princess 9.5.
                                # Opposite lanes are ~9-10 tiles apart -> troops march past each other (real CR behaviour).
  sight_range: 0.12             # LIVE-only twin of sight_tiles: the same fallback as a SCREEN-normalized radius
                                # (clashrl/env.py + play.py read this; the sim reads sight_tiles).
  # --- sim REWARD geometry, in TILES (the env.* twins below are LIVE screen-space and stay separate) ---
  xbow_range_tiles: 11.5        # max distance from the X-Bow to an enemy princess for it to REACH the tower
  xbow_defense_front: 0.56      # DEFENSIVE "back-centre" band (normalized y): ~2 tiles behind the river...
  xbow_defense_back: 0.66       # ...to ~5 tiles behind it. Deeper than this is rarely useful -> xbow_deep_frac.
  spell_tower_aim_tiles: 3.8    # target within this of an enemy princess = chip/combo (spell aim + wincon)
  spell_waste_tiles: 4.5        # (soft spell_waste) a DAMAGE spell with NO enemy unit within this of its aim + not at a tower = cast into emptiness
  rocket_combo_tiles: 3.5       # ROCKET COMBO: the support must be within this of the aimed princess tower
  slow_factor: 0.5              # SLOW status (Ice Wizard) -> this multiple of move + attack speed
  slow_duration: 2.0            # seconds a SLOW lasts
  stun_duration: 0.5            # seconds a STUN lasts (Zap / Tesla-evo pulse / Electro)
  freeze_duration: 1.0          # seconds a FREEZE lasts (Ice Spirit / Freeze) -- a longer stun
  collision: true               # soft body-block: units can't stack, so a wall of troops holds up a tank
  enemy_levels: [13, 14, 15, 16]      # opponent cards EACH roll a random level from here...
  enemy_level_weights: [2, 4, 3, 2]   # ...weighted toward higher levels so the policy learns to counter L15/16 decks (14 still most common: 18/36/27/18%). YOUR deck levels are per-card in config/cards.yaml
  backline_support_prob: 0.05         # ROCKET-COMBO SETUP: per-step chance (control/beatdown opponents, early) to OPEN with a 4-6 elixir support BEHIND the king -- the scenario the agent learns to rocket (support + tower). ~half of control/beatdown matches.
  backline_support_until_s: 45.0      # only in the first N seconds (the opening); later a support comes as part of a push, not a backline drop
  anywhere_deploy_prob: 0.75          # chance a bot holding a DEPLOY_ANYWHERE card (cards.yaml flag: Miner /
                                      # Goblin Drill) tunnels it straight onto a live princess tower instead of
                                      # walking it from the bridge. Without this the sim never produces the
                                      # scenario -- an enemy suddenly ON your tower with no approach to read --
                                      # so the policy cannot learn to answer it however the reward is shaped.
  # --- ADAPTIVE scripted bots (Tier-1 'smart opponents', TRAINING ONLY: only train_sim's opponent
  # provider passes adaptive=True; the eval benchmark + fair eval never do, so eval curves stay
  # comparable across runs). Each training bot rolls adaptive_prob; an adaptive bot then rolls each
  # behaviour + a human reaction delay -> a POPULATION of skill levels, not one clone:
  #   anti-siege   = answer a fielded X-Bow (big spell when supported, else heaviest troop ON it)
  #   counter-hold = after SEEING the X-Bow, reserve their heaviest troop as the siege answer
  #   dump punish  = 8+ agent elixir in ~6s -> immediate opposite-lane commit
  #   split-push   = after SEEING a tornado, split/alternate lanes -- one pull can no longer catch
  #                  the whole attack (exactly the pressure that makes real tornado timing worth learning)
  adaptive_prob: 0.65
  adaptive:
    reaction_s: [1.0, 3.0]            # per-bot human reaction delay, uniform in this range
    anti_siege_prob: 0.8
    hold_counter_prob: 0.6
    punish_prob: 0.6
    split_prob: 0.7
  explore_count_based: true           # epsilon random picks weighted 1/sqrt(play count): situational cards (tornado) actually get trialled
  epsilon_start: 1.0            # from-scratch -> start fully random
  epsilon_end: 0.05
  epsilon_decay_steps: 40000    # long exploration (far more steps than live RL, since the sim is fast)
  log_every_matches: 25         # print a rolling win-rate/avg-reward summary this often
  save_every_matches: 50        # checkpoint data/policy_sim.pt this often
  # Benchmark eval: every N matches, run the GREEDY policy vs the FIXED scripted meta pool and print the
  # win-rate. Unlike the self-play win-rate (which hovers ~50%), this is a STABLE plateau signal -- watch
  # it flatten to judge when DDQN has topped out (the PPO-integration trigger; see DECK_SWITCH.md). 0 = off.
  eval_every_matches: 500       # run the benchmark this often (matches); 0 disables it
  eval_matches: 150             # greedy matches per benchmark (bigger = less noise: ~+-4pp at 150 vs ~+-10pp at 24)
  eval_envs: 8                  # vectorized eval envs (capped at --envs)
  eval_smooth_window: 5         # print a ROLLING AVERAGE of the last N benchmark points so a plateau vs noise is readable
  fair_eval: true               # ALSO benchmark vs the meta pool at a FAIR (equal) level -- isolates raw policy strength from the L13-16 handicap
  fair_eval_level: null         # fair-eval enemy card level (null = auto: rounded mean of YOUR deck's card levels)
  # train-sim also keeps data/policy_sim_best.pt at the PEAK ladder rolling-avg (guards vs the late-training decay you saw: 69% @20k -> ~58% @40k)
  # --- Self-play (frozen past policy mixed in with the scripted meta bots) --------------------------
  # Every `selfplay_snapshot_every` matches the current policy is frozen into a small league; each match
  # reset then picks a league snapshot to pilot the OPPONENT with prob `selfplay_prob` (ramped in over
  # `selfplay_ramp_matches`), else a scripted meta-deck bot. The frozen self plays the agent's own deck
  # on a mirrored board (sim/view.py) = a strong, adaptive sparring partner. Set selfplay_prob 0 to
  # disable (scripted-only, the original behaviour).
  selfplay_prob: 0.5            # fraction of matches played vs a frozen self (0 = off); the rest are scripted meta decks
  selfplay_ramp_matches: 5000   # linearly ramp selfplay_prob 0 -> full over this many matches (0 = no ramp)
  selfplay_snapshot_every: 1000 # freeze a policy snapshot into the league this often (matches)
  selfplay_league_size: 8       # keep this many recent snapshots; DEEPENED 5 -> 8 with PFSP (more history
                                # is useful once sampling is prioritized instead of uniform)
  selfplay_keep_best: true      # ALSO spar against the BEST-benchmark self (not just recent snapshots) -- damps the
                                # self-play "chase a degrading recent self" oscillation; the biggest stability lever here
  # Tier-2 PFSP (prioritized fictitious self-play): league opponents are sampled by (1 - winrate)^power
  # over a rolling 40-match record per snapshot, so sparring concentrates on the past selves that BEAT
  # the current policy (that's where the learning signal is) instead of uniformly re-farming beaten ones.
  # Snapshots with little history sample at medium priority; a small floor keeps every snapshot in play.
  selfplay_pfsp: true
  selfplay_pfsp_power: 2.0      # >1 = sharper focus on the hardest snapshots; 1.0 = proportional; try 2-3
  # --- PPO trainer (train-sim-ppo; the on-policy sibling built at the DDQN 83/84 plateau) ---------
  # Same trunk/heads read as LOGITS + a value head; clipped surrogate + GAE. Everything around the
  # algorithm (eval benchmark, keep-best, PFSP league, adaptive bots, DR, masks) matches train-sim
  # so the curves are directly comparable against the DDQN baseline. Standard PPO defaults below.
  ppo_horizon: 128              # env steps collected per env before each update (batch = horizon x envs)
  ppo_epochs: 4                 # optimisation passes over each rollout
  ppo_minibatch: 512            # minibatch size within a rollout
  ppo_clip: 0.2                 # PPO clip epsilon (the trust region)
  ppo_lr: 0.00025               # PPO learning rate (on-policy tolerates more than the DQN's 5e-5)
  ppo_entropy: 0.01             # entropy bonus (exploration pressure on the factored categorical)
  ppo_vf_coef: 0.5              # value-loss weight
  ppo_gae_lambda: 0.95          # GAE lambda (bias/variance of the advantage estimates)
  ppo_max_grad_norm: 0.5        # gradient clip
  # Opponent decks: the sim samples these to vary the matchup. `run.py decks-import` refreshes the
  # file from the official CR API (needs a free token in the env var below); else the curated set is used.
  meta_decks_file: config/meta_decks.yaml   # pool of opponent decks (imported top-meta, or curated fallback)
  api_token_env: CLASHRL_CR_API_TOKEN       # env var holding your official CR API token (developer.clashroyale.com; IP-locked)
  api_token_file: data/cr_api_token.txt     # git-ignored fallback file with the token (data/ is ignored), one line.
                                            # PREFER THIS over the env var: exporting a token on a command line puts a
                                            # long-lived credential into shell history, and on PowerShell `set NAME value`
                                            # is Set-Variable -- it makes a SHELL variable that os.environ never sees, so
                                            # it silently looks like it worked. Correct env syntax is `$env:NAME = "..."`.
  api_base: https://api.clashroyale.com/v1  # official Clash Royale API base URL

# =====================================================================
# Card knowledge base.  Combat stats below are the LEVEL-11 base; per-card
# levels are set in the deck (1v1 mode -> levels vary) and scaled from level 11.
#
# Two kinds of data:
#   * STABLE  (elixir, kind, targets, movement, splash, flags, evolution):
#     safe to hand-maintain; rarely changes.
#   * VOLATILE (hitpoints / damage / hit_speed / dps @ level 11): scales with
#     level and shifts on balance updates -> treat as REFRESHABLE. These are
#     left null here; import them from a stats source and bump `meta.updated`.
#
# `verified: false` marks an entry whose stable fields still need a source check.
# Loaded by src/clashrl/cards.py (CardDB).
# =====================================================================

meta:
  level: 11
  mode: "1v1"
  updated: "2026-08-26"     # I5: the adjudicated R2 ledger applied (both stale since 2026-07-24)
  stats_source: "clashroyale.fandom.com (MediaWiki level-11 vardefines) via `cards-import`,
    corrected by the R2 sweep + owner adjudications in research/sim_parity/decisions.md.
    Deliberate deviations from the wiki live in config/import_pins.json and NOWHERE else --
    tools/stat_sweep.py reads that file as its EXPECTED set, so a value that disagrees with
    the wiki and is not pinned is a finding, not a preference."
  notes: >
    Combat stats are imported (config/cards_stats.json, level 11) and overlaid by the curated
    rows below; the game-file structural constants sit between them (config/card_mechanics.json).
    Every curated number that contradicts the wiki carries a dated comment naming the superseded
    value and the ruling; row-by-row provenance for the I5 application is in
    research/sim_parity/ledger/i5_applied.jsonl.

# Your deck (icebow / X-Bow 2.9 control: defend + cycle; X-Bow is the WIN CONDITION, placed
# forward to lock the enemy princess tower; Knight tanks / defends / body-blocks; Rocket
# clears big pushes or cycle-chips in 2x/3x). `evolved: true` uses the Evolution variant.
# Classic 1v1 -> card levels are the player's real account levels.
deck:
  name: "Hog Earthquake 2.6 Cycle (Classic 1v1)"
  # Levels read off the user's card screen, 2026-08-17.
  cards:
    - {card: hog_rider, level: 13}                    # win condition
    - {card: firecracker, evolved: true, level: 13}   # EVO: knockback + air answer + chip
    - {card: mighty_miner, level: 15}                 # CHAMPION -- 1-elixir Explosive Escape ability (upgraded 2026-08-19)
    - {card: tesla, evolved: true, level: 14}         # defensive building
    - {card: the_log, level: 14}
    - {card: earthquake, level: 13}                   # building removal -> clears the Hog's path
    - {card: skeletons, level: 15}
    - {card: ice_spirit, level: 13}

# ---------------------------------------------------------------------
# card fields:
#   elixir      int
#   kind        troop | building | spell
#   rarity      common | rare | epic | legendary | champion
#   attacks     which target types it can damage: [ground], [air, ground], [] (spell hits per radius)
#   movement    ground | air | none
#   speed       slow | medium | fast | very_fast | null
#   range       melee | short | long | null   (attack reach; ranged if long/short)
#   splash      true if area damage
#   count       units deployed
#   win_condition   true for building-targeting pushers / primary tower threats
#   targets     buildings_only | any | null   (what a troop prefers to attack)
#   flags       [ranged, flying, spawner, kamikaze, dash, charge, stun, freeze,
#                knockback, pull, shield, splash_air, building_targeting, swarm,
#                siege, tank, mini_tank, splash, jump]   (siege => X-Bow/Mortar)
#   evolution   {available, cycles, effect, gains:[...]}   (null if none)
#               `cycles` = how many times the BASE card must be PLAYED before the Evo is
#               available, so cycles:2 => base, base, EVO (every 3rd play is evolved). The sim
#               enforces this (sim/env.py evo charges), so a wrong value directly changes play.
#               VERIFIED in-game: tesla 2, knight 2. UNVERIFIED (musketeer / skeletons / archers /
#               valkyrie all sit at 1) -- none are in the current deck and opponent decks use BASE
#               keys only, so those four are inert today; verify before ever slotting one.
#   hitpoints/damage/hit_speed/dps   @ meta.level (null => import)
#   crown_tower_damage   spells' reduced damage to crown towers @ meta.level
#                        (null => import; troops/un-reduced spells hit towers for full damage)
# ---------------------------------------------------------------------
cards:

  # ---- opponent-only curated entries ------------------------------
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   lifetime: SUPERSEDED 70 -> REMOVED. DUP bucket (merge's pick): the curated `lifetime: 70` is
  #     the PRE-4/4/2022 value and the SAME row already carries the correct lifetime_s 93. Delete
  #     the stale key rather than keep two disagreeing lifetimes on one row
  #   gen_every_s: SUPERSEDED 8.5 -> 13.0. HIGH IMPACT. The curated 8.5 (flagged '# VERIFY' in
  #     cards.yaml) is the PRE-4/4/2022 value - three balance changes have landed since (8.5 -> 9
  #     -> 12 -> 13)
  #   on_death_elixir: SUPERSEDED ABSENT -> 1.0. PRIORITY/gap: field absent. The prose and the
  #     4/4/2022 history entry both give the collector +1 elixir on death, so in the sim
  #     destroying a pump denies one elixir more than it actually does.
  elixir_collector:            # OPPONENT pump (never in your deck) -- curated for the sim's PUMP ECONOMY:
    display: "Elixir Collector"   # the engine pays its owner +1 elixir every gen_every_s while it stands,
    elixir: 6                     # so rocketing a FRESH pump denies real production (see sim/engine.py).
    kind: building
    movement: none
    speed: null
    count: 1
    win_condition: false
    targets: none
    flags: []
    gen_every_s: 13.0   # +1 owner elixir every ~8.5s (~8 over its life, +2 net) -- VERIFY
    on_death_elixir: 1.0
    verified: true

  # ---- your deck --------------------------------------------------
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   load_time_s: SUPERSEDED 0.2 -> 0.3. decisions.md 2026-08-26 R2 ADJUDICATION #10: ALL wiki
  #     load_time entries correct -- this settles the three-way conflict (KB/dump 0.2, wiki 0.3,
  #     engine comment 1.0) in the wiki's favour
  #   evolution.cycles: SUPERSEDED ABSENT -> 2. The musketeer row's curated `evolution` dict
  #     (verified:true) carries available/effect/gains but no `cycles`, where the comparable
  #     knight row carries cycles 2 and matches the wiki exactly. Published Evolution Attributes
  #     give Cycles 2
  musketeer:
    display: "Musketeer"
    elixir: 4
    kind: troop
    rarity: rare
    attacks: [air, ground]
    movement: ground
    speed: medium
    range: long
    splash: false
    count: 1
    win_condition: false
    targets: any
    flags: [ranged]
    evolution: {available: true, effect: charged long-range shot with knockback, gains: [knockback, extra_range], cycles: 2}
    verified: true
    hitpoints: null
    damage: null
    hit_speed: null
    load_time_s: 0.3

  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   rarity: SUPERSEDED 'rare' -> 'common'. decisions.md 2026-08-26 R2 ADJUDICATION #5: tesla is
  #     COMMON rarity
  #   evolution.hitpoints: SUPERSEDED 1152 -> 1182. decisions.md 2026-08-26 R2 ADJUDICATION #5:

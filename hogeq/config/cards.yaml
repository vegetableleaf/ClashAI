    verified: true
    hitpoints: null
    damage: null
    hit_speed: null

  # EVO BOMBER: still the same ranged splash bomber (stats overlay from the imported bomber_evo
  # row, 332 hp), plus BOUNCING BOMBS: "After the initial throw, the bomb will bounce twice,
  # 2.5 tiles apart in a straight line, dealing the same damage as the initial hit" (2.5 since
  # 5/3/2024, from 3). Since 16/12/2024 enemies hit by the attack take damage only ONCE -- the
  # three blasts share a hit set. The bounces are how it chips the crown tower from the bridge.
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   bounce_no_repeat_target: SUPERSEDED ABSENT -> True. MISSING FIELD (flag, not a number).
  #     Since 16/12/2024 a unit inside two overlapping bounce radii takes the 225 ONCE, not twice
  bomber_evo: {bounces: 2, bounce_tiles: 2.5, bounce_no_repeat_target: true, verified: true}

  # ---- T1 EVO MECHANICS (2026-08-14 verify sweep; stats flow from the imported _evo rows) ----
  # EVO ROYAL GIANT: "every time [he] attacks, it deals damage in a 2.5 tile radius around it and
  # knocks back enemy ground troops by 1 tile"; air immune to both. Recoil damage 81 at level 11
  # (USER-VERIFIED 2026-08-14 -- the wiki publishes the row but no scrapeable value).
  royal_giant_evo: {recoil_damage: 81, recoil_radius_tiles: 2.5, verified: true}
  # EVO SKELETONS: "every time they attack, an additional Evolved Skeleton will spawn, for a
  # maximum total of 8" (cap = living evo skeletons on the team).
  skeletons_evo: {spawn_on_hit: skeletons_evo, spawn_on_hit_cap: 8, verified: true}
  # EVO RECRUITS: "AFTER their shield is destroyed, they gain the ability to charge towards their
  # target after traveling [charge_range, imported 2.5] tiles, dealing 2x damage" -> 266 at L11.
  royal_recruits_evo: {charge_damage: 266, charge_after_shield: true, verified: true}
  # EVO BARBARIANS: "every attack, their attack speed and movement speed increases by 30% for
  # 3 seconds" (3 s since 14/5/2024; 30% since the 6/10/2025 global rage nerf). Does not stack
  # with other rage. Their +10% hp / 1.4 s hit speed flow from the imported row.
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   hit_rage_s: SUPERSEDED 3.0 -> 5.0. CURATED verified:true (3.0) so flagged, not overwritten
  #     -- but every available path says 5 s. Recommend 5.0
  # RULING 25 (owner, IN-GAME 2026-08-27) closes I5's recorded self-inconsistency, and closes it in
  # the direction that makes BOTH pages agree:
  #   hitpoints: SUPERSEDED 691 -> 716. The Evo page's own `hp_11` says 716 and its history says
  #   "On 4/8/2026, a Balance Update, REMOVED the Evolved Barbarians' Extra Hitpoints" -- i.e. from
  #   that date Evo HP == base HP. I5 held 691 because the base page said 691 and could not tell
  #   which side was stale; with the base now ruled to 716 the two are equal, which is exactly what
  #   the 4/8/2026 entry requires. `stat_sweep` HAD been reporting this row (ours 691 / wiki 716)
  #   as a known deviation all along -- it flagged the number and only the tie-break was missing.
  barbarians_evo: {hitpoints: 716, hit_rage_s: 5.0, hit_rage_boost: 0.3, verified: true}
  # EVO VALKYRIE: "every time [she] attacks, a Tornado appears for half a second, pulling all
  # units towards her" -- 5.5-tile radius, 76 tornado damage, ground AND air (reuses the vortex).
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   attack_nado_crown_damage: SUPERSEDED ABSENT -> 37. CROWN bucket: tor_crown_11 = 37 is what
  #     the wiki publishes. UNRESOLVED and recorded in conflicts.md: if the 4/8/2026 -50% also
  #     halved the crown chip it would be ~18, but no entry says so and the vardefine is undated
  #   attack_nado_damage: SUPERSEDED 76 -> 42. LAG bucket: the curated 76 is the LAUNCH value
  #     (pre-14/5/2024). Chain fit 76 -> x1.11 = 84 (the vardefine) -> 4/8/2026 x0.5 = 42
  valkyrie_evo: {attack_nado_radius_tiles: 5.5, attack_nado_duration_s: 0.5, attack_nado_damage: 42, attack_nado_crown_damage: 37, verified: true}
  # EVO ZAP: "the ring grows and zaps every target inside 2 more times" -- 3 pulses ~1 s apart at
  # radii 2.5 -> 3.0 -> 3.5, each a full zap (damage/stun/crown chip from the imported row).
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   zap_pulses: SUPERSEDED 3 -> 2. LAG bucket, 3-of-3: 8/10/2024 'increased the second pulse's
  #     damage by 100%, but REMOVED THE THIRD PULSE'; dmg_hits = 2 and the infobox says 'TWO
  #     Zaps'. The curated 3 quotes the retired pre-8/10/2024 card text
  zap_evo: {zap_pulses: 2, zap_radius_step_tiles: 0.5, verified: true}
  # EVO PEKKA: the imported hitpoints 5640 is the OVERHEAL CAP (3760 x 1.5), not deploy hp, and
  # the damage row is missing -- both re-curated from the base card. Post-rework heal: "each kill
  # heals the same amount ... always 12.5% of the core HP" = 470 at L11, overheal to 150%.
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   hit_speed: SUPERSEDED ABSENT -> 1.8. PRIORITY missing-hit_speed row resolved: merged row has
  #     dps 468 but no hit_speed (curated yaml re-curated hp/dmg/dps and dropped it). All three
  #     paths give 1.8; 842/1.8=467.8 -> the curated dps 468 is self-consistent
  pekka_evo: {hitpoints: 3760, damage: 842, dps: 468, kill_heal: 470, overheal_frac: 1.5, hit_speed: 1.8, verified: true}
  # ---- PHASE B WAVE 3 (2026-08-14 sweep 3): the 17 remaining evos ----
  # EVO MEGA KNIGHT: "every time [he] attacks, [he] will do an uppercut, launching the targeted
  # troop back 4 tiles towards the nearest enemy Crown Tower", weight-independent (buildings
  # excepted, as always). The shove re-enters his own jump band -- the uppercut-jump loop.
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   uppercut_every_hits: SUPERSEDED ABSENT -> 2. KBGAP/P3: the 2026-08-14 curation modelled the
  #     uppercut on EVERY attack; since 4/8/2026 it fires every 2nd hit (uppercut_tiles 4.0 is
  #     current-correct)
  mega_knight_evo: {uppercut_tiles: 4.0, uppercut_every_hits: 2, verified: true}
  # EVO EXECUTIONER: "the Axe Smash ability ... pushes foes back two tiles. The range for this
  # attack is 3.5 tiles, and it is effective on Ground and Air"; the shove resets charges.
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   smash_damage: SUPERSEDED ABSENT -> 241. KBGAP: close_11 = 294 is provably stale by two nerfs
  #     -- 294*0.91*0.90 = 240.9 -> 241. The axe hits for close_11 instead of dmg_11 inside the
  #     smash band, on both the outward and the return pass
  #   smash_range_tiles: SUPERSEDED 3.5 -> 2.5. CURATED verified:true (3.5) so flagged, but four
  #     independent statements say 2.5, and the page's edit comment on the live revision is
  #     literally 'Evo Exec now says the Close Quarters range is 2.5 instead of saying 3.5' (revid
  #     437539, 2026-08-24 -- ten days AFTER
  #   smash_knockback_tiles: SUPERSEDED 2.0 -> 1.0. CURATED verified:true, and the current 2.0
  #     matches NO source. Two independent History paths date a 1.5 -> 1.0 nerf to 2/3/2026; the
  #     Card Evolution table still says 1.5, i.e
  executioner_evo: {smash_range_tiles: 2.5, smash_knockback_tiles: 1.0, smash_damage: 241, verified: true}
  # EVO HUNTER: "throws a net at the closest unit every 5 seconds, freezing the troop in place
  # and rendering it unable to move or attack for 3 seconds" (root -- still hittable). Net range
  # curated to his sight [verify].
  hunter_evo: {net_cd_s: 5.0, net_root_s: 3.0, net_range_tiles: 5.5, verified: true}
  # EVO WIZARD: Fire Shield (imported shield_hp 192); "when the Fire Shield is destroyed, it
  # triggers an explosion ... and a knockback effect, pushing all enemy troops within a 3-tile
  # radius back by 3 tiles". The imported death_damage 281 IS that break blast (he has no death
  # damage) -- moved to shield_burst_damage and zeroed as death damage.
  wizard_evo: {death_damage: 0, shield_burst_damage: 281, shield_burst_radius_tiles: 3.0, shield_burst_knockback_tiles: 3.0, verified: true}
  # EVO WITCH, re-sourced 2026-08-16. The old entry back-derived a base of 796 by dividing the
  # imported 1039 by a "+30% overheal" figure. The division was sound; the +30% was three balance
  # changes out of date (130% -> 125% -> 124%, the last on 6/5/2025), so the base came out wrong.
  # The Evolution page now publishes both numbers outright, and its table headers name them:
  # hp_11 839 is "Hitpoints", maks_hp_11 1039 is "Max Hitpoints" (the overheal cap, 1039/839 =
  # 1.238), heal_11 76 is "Skeleton Death Heal" -- not the 109 we carried. Her base hitpoints are
  # simply the base Witch's 839, which is the cross-check that the 796 never had.
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   damage: SUPERSEDED ABSENT -> 135. stat_diffs verdict:update: dmg_11 = 135, 3-of-3 (evo
  #     vardefine, evo attributes table, base Witch under the 'identical stats' clause)
  #   hit_speed: SUPERSEDED ABSENT -> 1.1. stat_diffs verdict:update: her own atk_speed is 1.1 on
  #     both pages; the 6/10/2025 'attack time interval to 1.1s' entry is the SKELETON's
  #   dps: SUPERSEDED ABSENT -> 123. stat_diffs verdict:update: 135/1.1 = 122.7 -> 123. The ledger
  #     row's `proposed` field reads 11.0, which is a scalar-extraction bug in the emitter, not
  #     the value
  #   speed_tiles: SUPERSEDED ABSENT -> 1.0. stat_diffs verdict:update: Medium (60) = 1.0 tiles/s
  #   overheal_frac: SUPERSEDED 1.238 -> 1.73. LAG bucket: 4/8/2026 'increased her overheal ratio
  #     to x1.73 (from x1.24)'. P1 and P2 are one stale snapshot -- maks_hp_11/hp_11 is still
  #     exactly the old x1.24
  #   spawn_death_heal: SUPERSEDED 76 -> 220. LAG bucket: heal chain -12%/-12%/+36%/-21%/-11% then
  #     4/8/2026 '+189%'; 76*2.89 = 219.6 -> 220. Must land WITH heal_source_cap 4, which partly
  #     offsets it
  #   max_hitpoints: SUPERSEDED ABSENT -> 1452. KBGAP: two independent derivations agree --
  #     1039*1.40 = 1455 (the 4/8/2026 '+40% max hitpoints') and 839*1.73 = 1452 (base x the new
  #     ratio). Cross-check that base hitpoints 839 did NOT move on 4/8/2026
  #   heal_source_cap: SUPERSEDED ABSENT -> 4. KBGAP: 4/8/2026 'made it to where she can only be
  #     healed by the first 4 skeletons that she spawns' -- without it the sim heals her off every
  #     skeleton she ever spawns
  #   spawn_count_per_wave: SUPERSEDED ABSENT -> 4. KBGAP: base Witch lead -- 'Every 7 seconds ...
  #     a group of four Skeletons'
  #   spawn_first_wave_s: SUPERSEDED ABSENT -> 1.0. KBGAP: 'her first wave of Skeletons will spawn
  #     1 second after she is deployed', not after the generic 7 s interval
  witch_evo: {hitpoints: 839, spawn_death_heal: 220, overheal_frac: 1.73, damage: 135, hit_speed: 1.1, dps: 123, speed_tiles: 1.0, max_hitpoints: 1452, heal_source_cap: 4, spawn_count_per_wave: 4, spawn_first_wave_s: 1.0, verified: true}
  # EVO ELECTRO DRAGON: "bolts chain indefinitely between multiple targets ... provided there is
  # more than one enemy in range" -- hits_per_attack raised to 12 as the practical infinity on a
  # 18x32 board.
  # I5 2026-08-26, decisions.md #6 (GLOBAL chain arc): chain_tiles 4.0. SUPERSEDED: the engine's
  #   flat _CHAIN_TILES 3.0, and the "3.5-tile radius" this comment used to quote -- which matched
  #   NEITHER the constant nor the wiki. Three independent statements say 4 (Electro Dragon,
  #   Electro Dragon/Evolution, Card Evolution), and the constant's own comment claiming the arc
  #   is "not published by the wiki" is what let the estimate stand for so long.
  # I7 2026-08-26, decisions.md rulings 12 + 15: the chain is NOT uniform, and the engine now
  #   stores the RULE rather than either constant.
  #   chain_full_hits: SUPERSEDED ABSENT -> 3. PUBLISHED as `#vardefine: dmg_hits | 3` on BOTH
  #     Electro_Dragon.wikitext and Electro_Dragon_Evolution.wikitext -- the first three bodies
  #     take the full hit and carry the 0.5 s stun.
  #   chain_falloff_frac: SUPERSEDED ABSENT -> 0.3333. Every bounce AFTER those three takes a
  #     third of the damage and NO stun. The evo page publishes the reduced number outright, as
  #     its own level-table column headed "Damage after 5 chains": `#vardefine: late_dmg_11 | 64`.
  #     64 / 192 = 0.3333, so rule and published constant agree; the wiki's own derivation is the
  #     two dated chain nerfs, 192 x 0.67 (8/1/2025, "damage after the first 3 chains -33%")
  #     x 0.50 (2/3/2026, "chain damage -50%") = 64.3 -> 64. Stored as the FRACTION because
  #     `late_dmg_11` is exactly the field that goes stale: it sat at 64 across three archived
  #     revisions while `dmg_11` above it moved 192 -> 268 -> 267.
  #   hits_per_attack 12 KEPT, and it is now the TOTAL bounce budget rather than 12 full hits.
  #     The card quote says the chain is infinite; ruling 11's no-repeat rule bounds it on a real
  #     board anyway, and 12 is this KB's practical cap on an 18x32 arena.
  #   MEASURED, one swing into a line of 13 bodies 3 tiles apart:
  #     before  3204.0 = 12 x 267, EVERY body stunned  (the largest overstatement of enemy
  #             strength the R2 sweep found)
  #     after   1152.0 = 3 x 192 full + 9 x 64 reduced, only the first 3 stunned

  #   ability_dmg_reduction 15.0 = the table's "Damage reduction 15%".
  #   ability_crown_tower_damage 48.5 = 97 x 0.5 (table "Crown Tower Damage -50%").
  #   ability_seek_tiles 5.5 = the ability table's lone "Dash Distance" column, icon
  #     {{Icon|I=Dash Range}} (RULING 31d). No Fandom prose describes it. An owner-supplied
  #     SECONDARY source names it a detection radius instead: "Target Detection: If an enemy troop
  #     or building is anywhere within a 5.5 tile radius, she will instantly lock onto them and
  #     enter her ... Whirlwind Stage. If no targets are within 5.5 tiles, she will run forward
  #     normally until an enemy enters that 5.5 tile bubble." Taken, because it is the only account
  #     that explains the stat AND it lands on a number the KB already holds -- her sight is 5.5,
  #     imported from the wiki long before this ruling -- so the "bubble" is the aggro range she
  #     has always had. Provenance caveat and the three retired readings are in conflicts.md.
  #   /!\ WHAT CHANGES: the whirlwind no longer starts on the BUTTON, it starts when something is
  #     inside the bubble; with nothing in range she walks forward and does not spin, and the 3.5 s
  #     clock burns anyway (owner ruling: "the timer counts down the moment the ability activates",
  #     so 2 s of walking leaves 1.5 s of spin -- MEASURED 6 turns, not 14).
  #   THE OPPONENT AI NEEDS NO NEW PRECONDITION, and that is provable rather than sampled: her
  #     ability_ai is family `defensive` with crowd_n 2 / crowd_tiles 2.5, so `_ability_wants` only
  #     arms with >= 2 enemy bodies within 2.5 tiles -- STRICTLY INSIDE the 5.5 bubble. It cannot
  #     fire her on an empty board. The one residual is the arm->resolve window (the bot's rolled
  #     reaction_s plus ability_delay_s 1.0), in which those bodies can die or walk out; that is a
  #     real but bounded waste and it is the same window every other hero's read already pays.
  #   NOT IMPLEMENTED, deliberately: the move-speed boost the BLURB claims ("increasing her
  #     movement speed"), and the secondary source's "Ultra-Fast" whirlwind speed. The ability
  #     table prints Speed Medium (60), IDENTICAL to her body, and no source anywhere publishes a
  #     number for the boost -- "Ultra-Fast" is not one of the game's tiers (Slow 45 / Medium 60 /
  #     Fast 90 / Very Fast 120), so any multiplier would be invented. In conflicts.md.
  valkyrie_hero: {ability_kind: buff_self, ability_cost: 3, ability_uses: 1, ability_delay_s: 1.0, ability_duration_s: 3.5, ability_tick_s: 0.25, ability_radius_tiles: 2.5, ability_damage: 97, ability_crown_tower_damage: 48.5, ability_dmg_reduction: 15.0, ability_seek_tiles: 5.5, ability_ai: {family: defensive, crowd_n: 2, crowd_tiles: 2.5}, verified: false}

  # BOWLER -- Stone Swish (Bowler/Hero, revid 437528). "After 2.5sec of the ability pressed, the
  # bowler will change the attack to a long-ranged mortar attack for 7.3sec. Getting a total of 3
  # shots during that duration."
  #   ability_delay_s 2.5 is THE ONE published activation delay in this file (table "Cast Time 2.5
  #     sec" AND the prose agree), so rule (c)'s 1 s default does not apply to him. It also makes
  #     his ruling-7 refund window two and a half times everyone else's.
  #   THE PROSE'S "3 shots" RECONCILES WITH THE TABLE, which is why no shot cap is curated: 7.3 s
  #     at a 1.9 s cadence gives 4 shots if the first lands at t=0 and exactly 3 (1.9 / 3.8 / 5.7)
  #     if the stance pays one hit-speed before its first shot. The engine does the latter.
  #   ability_damage 508 = abdmg_11; ability_crown_tower_damage 254 = ctdmg_11 (published outright,
  #     not derived); ability_range_tiles 11.5 = the table's Range.
  #   NOT IMPLEMENTED: "Plants his feet" is a card quote, not a rule, and the page's own open
  #     question is whether he is rooted. No splash radius is published for the mortar shot either.
  bowler_hero: {ability_kind: buff_self, ability_cost: 2, ability_uses: 1, ability_delay_s: 2.5, ability_duration_s: 7.3, ability_hit_speed_s: 1.9, ability_damage: 508, ability_crown_tower_damage: 254, ability_range_tiles: 11.5, ability_ai: {family: offensive, tower_tiles: 13.0}, verified: false}

  # MAGIC ARCHER -- Triple Threat (Magic Archer/Hero, revid 437520). "the Magic Archer will teleport
  # back, while leaving a decoy in his place. The next attack now shots 3 arrows that travel longer,
  # but with less damage."
  #   ability_back_tiles 3.5 -- the SAME field the Boss Bandit's Getaway Grenade uses, because it is
  #     the same mechanic (a backwards teleport). History 6/7/2026 cut it from 5.
  #   ability_max_hits 3 arrows x ability_damage 48 (triple_dmg_11), out to ability_range_tiles 13.5
  #     (History 6/7/2026, from 15.4) instead of his normal 11. ONE attack carries them.
  #   ability_duration_s 7.0 = the decoy's lifetime; the decoy body is `magic_archer_decoy`.
  magic_archer_hero: {ability_kind: decoy_blink, ability_cost: 2, ability_uses: 1, ability_delay_s: 1.0, ability_back_tiles: 3.5, ability_duration_s: 7.0, ability_max_hits: 3, ability_damage: 48, ability_range_tiles: 13.5, ability_spawn_unit: magic_archer_decoy, ability_spawn_count: 1, ability_ai: {family: escape, hp_frac: 0.7, over_river: false}, verified: false}

  # MEGA MINION -- Wounding Warp (Mega Minion/Hero, revid 437518). "a marker will be deployed to the
  # lowest hitpoint target. When that unit dies, the mark will move to the next unit. When the
  # ability is preased, Mega Minion will teleport to that tile, dealing damage. Afterwards the Mega
  # Minion will behave normally, but with -75% on the tower."
  #   ability_damage 399 = warpdmg_11. NO range is curated at all, because the table publishes
  #     "Teleport Range: Infinite" -- the marker can be anywhere on the board.
  #   ability_tower_mult 0.25 = the table's "Crown Tower Damage 25%" (History 4/8/2026, "tower
  #     multiplier to x0.25 (from x0.5)"), applied AFTER the warp and permanently: History 4/8/2026
  #     says the reduction "is now permanent" and the prose scopes it to "afterwards".
  #   ability_tick_s 1.5 = History 7/4/2026's "first target delay of 1.5s ... could no longer
  #     instantly spawn to targeted troop", the beat he must pay before attacking on arrival.
  mega_minion_hero: {ability_kind: warp, ability_cost: 2, ability_uses: 1, ability_delay_s: 1.0, ability_damage: 399, ability_tower_mult: 0.25, ability_tick_s: 1.5, ability_ai: {family: defensive, crowd_n: 1, crowd_tiles: 20.0}, verified: false}

  # BARBARIAN BARREL -- Rowdy Reroll (Barbarian Barrel/Hero, revid 437523). "When activatet, the
  # Barbarian Barrel will roll for a second time, while healling the barbarian for 50% of the
  # damage."
  #   THE BUTTON BELONGS TO THE BARBARIAN, because the card is a SPELL and a spell has no body to
  #     press it from -- build_spec hands a spell's ability parameters to the troop it leaves behind.
  #   /!\ The BASE barbarian_barrel spawns no barbarian at all in this sim (MEASURED: 0 bodies) --
  #     a pre-existing base-card gap recorded in conflicts.md. `spawns_troop` is curated on the HERO
  #     row only, so fixing the hero does not silently buff the 198 pool decks holding the base card.
  #   ability_range_tiles 3.0 = the reroll's own Range (History 4/5/2026, "from 4 tiles"), not the
  #     barrel's 4.5, and ability_radius_tiles 1.3 = half its published Width of 2.6 (a rolling
  #     spell's `spell_radius` IS the corridor half-width here, so the two are the same quantity).
  #     ability_damage 232 = spawn_11, the barrel's area damage.
  #   ability_crown_tower_damage 116 = rerolldmg_11. The VARIABLE is named for reroll damage but the
  #     level-table column it feeds is headed "Crown Tower Damage"; the rendered column header wins
  #     (rule (b)), and 116 is exactly half of 232 under either reading. Recorded in conflicts.md.
  #   ability_heal_frac 0.50 = the table's "Damage Healed 50%", read as lifesteal on the reroll's
  #     own damage. The alternative ("50% of the damage he has taken") is in conflicts.md.
  #   damage 232 = spawn_11, the barrel's own AREA damage, because on a spell row `damage:` IS the
  #     roll's damage (the base card carries 230 there). The scrape put the BARBARIAN's 192 on it,
  #     which would have made the hero barrel roll for LESS than the base card; 192 is on the
  #     `barrel_barbarian` row, where the page puts it.
  # RULING 25: the hero row carries its OWN imported `spawn_unit_stats` (from cards_stats.json,
  # hit_speed 1.3), so curating the base row did NOT reach it -- a second stale copy of exactly the
  # number the ruling moves. Written out in full because the curated layer replaces the block.
  barbarian_barrel_hero: {damage: 232, spawn_unit_stats: {range_tiles: 0.5, speed_tiles: 1.0, hit_speed: 1.4, deploy_time: 0.5}, spawns_troop: {unit: barrel_barbarian, count: 1}, ability_kind: reroll, ability_cost: 1, ability_uses: 1, ability_delay_s: 1.0, ability_range_tiles: 3.0, ability_radius_tiles: 1.3, ability_damage: 232, ability_crown_tower_damage: 116, ability_heal_frac: 0.50, ability_ai: {family: defensive, crowd_n: 1, crowd_tiles: 4.0}, verified: false}

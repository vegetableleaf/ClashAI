  mighty_miner: {range: melee, flags: [knockback_immune], damage_ramp: {damages: [40, 204, 409], hit_speed: 0.4}, ability_kind: bomb, ability_cost: 1, ability_uses: 1, ability_cooldown_s: 0.0, ability_delay_s: 1.0, ability_bomb_damage: 332, ability_bomb_radius: 2.5, ability_bomb_knockback: 1.8, damage: 43, damage_charge_speed_s: 2.0, damage_stages: [43, 204.0, 409.0], verified: false}

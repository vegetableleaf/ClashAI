    verified: true

  royal_hogs:
    display: "Royal Hogs"
    win_condition: true
    targets: buildings_only
    # ABREAST, not a 2x2 (owner 2026-08-25): the four hogs enter side by side and fan into separate
    # lanes. Matters for SPLASH GEOMETRY -- a block fits inside one Log/Arrows radius, four abreast
    # do not, so modelling them as a block over-values the cheap spell answer.
    flags: [building_targeting, swarm, line_formation]
    range: melee
    verified: false

  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   unsourced: SUPERSEDED ABSENT -> True. decisions.md 2026-08-26 R2 ADJUDICATION #11: no path
  #     publishes the flagged value on this row -- the sim's own number is KEPT and the row
  #     marked, rather than replaced by a reconstruction
  #   crown_tower_damage: SUPERSEDED ABSENT -> 97 -- THEN RE-PLUMBED by ruling 31a (2026-08-27).
  #     crown_11 = 97 is the page's "Reflected Tower Damage" column, i.e. the ZAP PACK's reduced
  #     figure -- but parking it in the generic crown_tower_damage field fed build_spec's
  #     tower_hit_dmg, which crown-reduced his NORMAL SWING to 97 (measured tower_hit_dmg 97.0 vs
  #     hit_dmg 163.8 @ L11). The page's Trivia says only his REFLECTING damage is reduced ("In
  #     the case of the Electro Giant, his reflecting damage deals [reduced] damage"), so the 97
  #     now lives on reflect_crown_damage and his swing hits towers at full value again.
  #   reflect_damage: SUPERSEDED 120 -> 192.0. The level-11 statistics row maps reflect_11 to the
  #     'Reflect Damage' column, so P1 and P2 are the same published number: 192. current_db 120
  #     is 37.5% low
  #   unsourced: true -- decisions.md #11: no path publishes these; the sim's own values are kept
  #     and MARKED rather than replaced by a guess.
  electro_giant:
    display: "Electro Giant"
    win_condition: true
    targets: buildings_only
    flags: [tank, building_targeting]
    range: melee
    # ZAP PACK (revid 436724; ruling 31a 2026-08-27): ANY attacker damaging him from within 3
    # tiles -- troop, building, or crown tower -- takes 192 (L11) back + a 0.5s stun, per hit;
    # crown towers take the separately published reduced 97 (the "Reflected Tower Damage"
    # column); off while frozen/stunned. Owner report: "electro giant's reflection stun/damage
    # applies to anything inside the reflection radius. this includes buildings and crown
    # towers." This is what makes the ranged-only counter-doctrine learnable in sim.
    reflect_damage: 192.0
    reflect_radius_tiles: 3.0
    reflect_stun_s: 0.5
    reflect_crown_damage: 97.0
    verified: false
    unsourced: true

  skeleton_barrel:
    display: "Skeleton Barrel"
    win_condition: true
    targets: buildings_only
    # "Once the Skeleton Barrel reaches a building or is destroyed, the barrel drops, dealing area
    # damage, INFLICTING KNOCKBACK, and spawning seven Skeletons in a circle." The barrel itself
    # deals NO contact damage -- the drop IS its death (kamikaze), so reaching the tower and being
    # shot down produce the same blast (death_damage 145 / 2.0 tiles from the import) + 7 skeletons.
    # (The imported `damage` row is the spawned skeleton's swing, zeroed here for the barrel body.)
    # 2026-08-16 wiki: "the player must account for the 0.5 SECOND ANIMATION where neither the
    # Barrel nor the Skeletons are considered as entities; if the spell is cast during this
    # phase, it will not affect the Skeletons." The blast + knockback land when the barrel
    # breaks; the seven bodies arrive 0.5 s later. That gap is the whole timing skill: a log
    # thrown AT the falling barrel hits nothing, so it must be timed to land after the split.
    # (Tornado can still displace the barrel during the animation -- not modelled.)
    flags: [flying, building_targeting, swarm, knockback, kamikaze]
    damage: 0
    dps: 0
    death_spawn_delay_s: 0.5
    spawns: {unit: skeletons, on_death: 7}
    range: melee
    verified: true

  goblin_drill:
    display: "Goblin Drill"
    win_condition: true
    targets: buildings_only
    # "when it surfaces, it will deal damage to enemy units around it in a 360 area around it, and
    # INFLICT KNOCKBACK" -- the surfacing blast, published as spawn_damage 84 / spawn_crown_damage 26.
    flags: [spawner, building_targeting, deploy_anywhere, knockback]   # drills up anywhere, same as the Miner
    # "Every 3 seconds... summon a Goblin"; "when defeated, it will also spawn two Goblins". The
    # intro prose still says the first wave is 0.8s, but the 6/10/2025 balance change raised it to
    # 1s -- the History section is newer than the prose, so the delay is overridden here.
    # Spawn Period 3.0s -- the wiki calls it the FASTEST of all buildings -- on a 10s lifetime,
    # the SHORTEST of all buildings. Both were prose above and neither was in the data, so the
    # threat model could not price what the drill actually puts on the board.
    spawns: {unit: goblins, count: 1, on_death: 2, delay: 1.0, interval: 3.0}
    lifetime_s: 10.0
    verified: true

  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   zone_spawn_edge: SUPERSEDED True -> False. LAG bucket: the spawn RING is 3.3 tiles, not the
  #     4-tile edge. 2/2/2026 moved it to 3.3 (from 2.9) and 14/1/2026 only moved them 'closer to'
  #     the edge, never onto it
  #   zone_spawn_radius_tiles: SUPERSEDED ABSENT -> 3.3. LAG bucket companion: the live spawn
  #     radius, against the KB's edge-of-4.0 model
  graveyard:
    display: "Graveyard"
    win_condition: true
    targets: null
    flags: [spawner, swarm]
    # 2026-08-15 wiki: "After 2.2 seconds, it spawns a single Skeleton ... every 0.5 seconds
    # for 9 seconds on the edge of the spell's radius" (x12, radius 4). It was resolving as
    # an 81-damage BLAST that spawned NOTHING -- the classic siege-killing archetype simply
    # did not exist in training.
    kind: spell
    radius_tiles: 4.0
    damage: 0                 # the spell itself deals no damage; the Skeletons do
    crown_tower_damage: 0
    zone_s: 9.0
    zone_spawn_n: 12
    zone_spawn_start_s: 2.2
    zone_spawn_gap_s: 0.5
    zone_spawn_edge: false
    spawn_unit: skeletons     # per-body stats (81/81 @11, the card's hp/dmg ARE per body)
    verified: true
    zone_spawn_radius_tiles: 3.3

  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   roll_speed: SUPERSEDED ABSENT -> 200. MISSING FIELD, history path only. 20/10/2016 set The
  #     Log's projectile speed to 200 (from 170) and its casting speed to 360 (from 300), and
  #     neither has changed since
  #   width_tiles: SUPERSEDED ABSENT -> 3.9. MISSING FIELD. The Log is explicitly a rectangle --
  #     the attributes table publishes Range 10.1 AND Width 3.9, and the lead calls it 'a very
  #     long rectangular area'
  the_log:
    crown_tower_damage: 35   # post-1/6/2026 (see crown_damage_audit.py)
    display: "The Log"
    elixir: 2
    kind: spell
    rarity: legendary
    attacks: [ground]          # rolling log -- GROUND ONLY (cannot hit air)
    splash: true               # area damage along its roll path (a lane-wide LINE, not a circle)
    range: long                # rolls forward a long line from the cast point
    targets: any
    flags: [knockback, knockback_all, rolls, splash, own_half_only] # knocks back / resets ground troops as it rolls
    # own_half_only (owner 2026-08-27 + Cards revid 437053: the CAST POINT is your half;
    # the CORRIDOR still rolls across the river, which is what the offensive Log is).
    # 7/2/2023 Balance Update: "decreased The Log's pushback range to 0.7 tiles (from 1 tile)".
    # `knockback_all` because the 19/9/2016 update "allowed The Log to push back ALL ground troops.
    # This allowed The Log to reset the charge attacks of the Prince and Dark Prince" -- the two
    # units the Bowler page lists as immune to Fireball/Snowball/Rocket pushback.
    knockback_tiles: 0.7
    verified: true
    # cast point is YOUR half only (it ROLLS to the enemy side); L11 stats: damage 266, crown_tower_damage 40 (poor tower chip)
    roll_speed: 200
    width_tiles: 3.9

  # -- ROLLING / KNOCKBACK spells that were not otherwise curated --
  # Barbarian Barrel still ROLLS but has NO pushback: the 3/9/2018 Balance Update "decreased its
  # rolling distance to 5 tiles (from 7 tiles), decreased its damage by 9%, and REMOVED ITS PUSHBACK".
  # It was previously modelled as a point blast, because `rolls` used to be derived from the
  # knockback flag -- so removing the pushback also silently removed the corridor.
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   spawn_unit_stats.deploy_time: SUPERSEDED ABSENT -> 0.5. MISSING FIELD AND THE PATHS
  #     DISAGREE. The spawned Barbarian's deploy time is 1.0s per the 1/12/2025 balance entry, but
  #     the secondary attributes table still reads 0.5 sec (never updated)
  #   roll_tiles: SUPERSEDED 5.0 -> 4.5. STALE BY ONE BALANCE UPDATE. cards.yaml pins roll_tiles
  #     5.0 quoting the 3/9/2018 entry ('decreased its rolling distance to 5 tiles (from 7
  #     tiles)'), but 7/6/2022 cut it again to 4.5, and the attributes table's Range cell agrees
  #     at 4.5
  #   width_tiles: SUPERSEDED ABSENT -> 2.6. MISSING FIELD. The barrel is a rectangular corridor,
  #     not a point: the attributes table publishes Width 2.6 and 1/7/2019 set it to 2.6 (from
  #     3.9)
  # I9 2026-08-27 -- THE BARBARIAN. The card's whole second half, unmodelled until now: MEASURED,
  # a full deploy of the base Barbarian Barrel left 0 bodies. Barbarian Barrel revid 437163, lead:
  # "Once the spell reaches its destination, it spawns a single Barbarian" -- and the card text
  # says it twice ("then breaks open and out pops a Barbarian!"). The Strategy section is built
  # entirely on the body: it "can follow up and attack anything while alive", it distracts a tank,
  # it separates a building-targeter from its push, and "the spell can be used to separate a
  # building-targeting troop from a regular troop".
  # `spawn_unit_stats` below was already carrying the Barbarian's combat profile -- a stat table
  # with nothing to attach it to -- so the only thing missing was the declaration. It points at
  # `base_barrel_barbarian` and NOT at the hero's `barrel_barbarian`, whose 716/192 belong to the
  # hero page (see that row). I8 fixed `_resolve_roll` to drop a rolling spell's spawn; this is
  # the data half of the same gap, held back to its own commit because it changes 198 pool decks.
  # RULING 22 (owner, 2026-08-27): the barrel's roll speed is 200, the same as The Log's. The
  # field is ABSENT UPSTREAM -- the Barbarian Barrel page publishes no projectile/roll speed in any
  # table or history entry, unlike The Log, whose 20/10/2016 entry set it to 200 -- so it is PINNED
  # in config/import_pins.json and a re-import cannot null it back out. At 200 (= 3.333 tiles/s)
  # the barrel's 4.5 tiles sweep in 1.35 s, a little under half The Log's 2.88 s for 9.6.
  # RULING 25: `spawn_unit_stats.hit_speed` 1.3 -> 1.4 with the body row. It is a SECOND copy of
  # the same number and would have silently overridden the fix if left behind.
  # RULING 27: crown_tower_damage 116. The row published NO crown value at all, so `build_spec`'s
  # `dmg if _td is None` fallback handed the barrel its FULL 230 against a tower -- measured. The
  # hero page's `rerolldmg_11` 116 is the Crown Tower Damage column (116/232 is the ordinary 50%
  # reduction; the variable name is misleading), and 230 * 0.5 = 115 -> the published 116.
  barbarian_barrel: {kind: spell, flags: [rolls, splash, own_half_only], roll_tiles: 4.5, width_tiles: 2.6, roll_speed: 200, crown_tower_damage: 116, spawns_troop: {unit: base_barrel_barbarian, count: 1}, spawn_unit_stats: {range_tiles: 0.5, speed_tiles: 1.0, hit_speed: 1.4, deploy_time: 0.5}, verified: true}
  # Giant Snowball: "slows enemies in its radius for 3 seconds and inflict knockback"; pushback range
  # 1.8 tiles per the 6/9/2021 Quarter 3 Update ("increased ... to 1.8 tiles (from 1.5 tiles)").
  giant_snowball: {kind: spell, flags: [knockback, slow], knockback_tiles: 1.8, verified: true}
  # RAGE -- IMPORT BUG, owner ruling R2 #8 item 4. The imported row said attacks: [buildings],
  # which in this schema means "only ever hits buildings" (Hog/Rocket-style targeting). It came
  # from the Target cell "Friendly [[Troops]] & [[Buildings]]" being pattern-matched on the word
  # "building" -- but that column names who Rage BUFFS, not who it attacks. Fixed at the source
  # too (card_import._attacks_from_target now returns None for any "Friendly ..." cell), so a
  # re-import cannot regenerate it; this row states the truth the Target column cannot.
  # Rage's DAMAGE is air+ground: lead, "It is an area-damage, air-targeting spell with a medium
  # radius and low damage" (12/12/2022 Clashmas Update "made the spell deal area damage").
  # I9 2026-08-27 -- THE FRIENDLY BUFF IS NOW MODELLED. `spell_targets: friendly` routes the
  # spell through the engine's own-team path, which lays a rage ZONE from this row's published
  # attributes table (revid 437309: Radius 3 / Deploy Time 0.5 sec / Duration 4.5 sec / Boost
  # +30%, Target "Friendly Troops & Buildings"). It is the SAME `rage_zones` list the Lumberjack's
  # dropped bottle feeds -- the page's lead says the effect "is also the same as that spawned by
  # the Lumberjack" -- so there is one rage model, not two. The DAMAGE half still runs: the Target
  # column names who the spell BUFFS, while the lead calls it "an area-damage, air-targeting spell
  # ... with low damage", and both are true of the same card.
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   duration_s: SUPERSEDED ABSENT -> 4.5. MISSING FIELD -- the card's whole point. Table
  #     Duration 4.5 sec, and 4/8/2025 set it to 4.5 (from 5.5)
  #   boost: SUPERSEDED ABSENT -> 0.3. MISSING FIELD. Table Boost +30%; 6/10/2025 cut the speed
  #     boost to 30% (from 35%); lead: 'It increases the movement speed and attack speed of allied
  #     troops and buildings by 30%.' Same 0.30 the Lumberjack drops_rage entry already uses.
  rage: {kind: spell, spell_targets: friendly, attacks: [air, ground], duration_s: 4.5, boost: 0.3, verified: true}
  # NB Arrows and Zap get NO knockback: neither publishes a pushback range and neither has a balance
  # entry for one. The Arrows page's "its knockback and slow effects" line is stale Strategy prose
  # describing Giant Snowball -- Arrows has no slow effect either, which is the tell.
  # Earthquake is the ONE spell that reaches a retracted Tesla: the 3/3/2020 Balance Update
  # "allowed the Earthquake to affect the Tesla even if it is hidden". Carried as a property of the
  # SPELL rather than of the Tesla, so nothing has to know a card name to get this right.
  # EARTHQUAKE IS THREE WAVES, NOT ONE. Wiki vardefines: dmg_hits 3, dmg_11 84, build_dmg_11 287,
  # crown_dmg_11 53 -- "3.5 times damage to buildings, that is dealt every second for 3 seconds",
  # plus a 50% slow, no flying units, and it reaches a CONCEALED Tesla. The sim modelled it as a
  # single instantaneous blast with no building bonus, so it was delivering one third of its troop
  # and crown damage and about a tenth of its building damage -- gutting the one card whose whole
  # job is deleting the building that stops the Hog. Routed through the Poison-style zone: the
  # cast itself lands nothing and the field does the work over its 3 s.
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   build_damage: SUPERSEDED 283 -> 287. Same stale-curation as `damage`: vardefine build_dmg_11
  #     = 287 vs DB 283. Ratio sanity check against the lead's 'doing 3.5 times damage to
  #     buildings': 287/84 = 3.42, 283/81 = 3.49 -- both approximate, but 287 is the published
  #     integer
  earthquake: {crown_tower_damage: 49, damage: 81, kind: spell, flags: [hits_hidden, slow], attacks: [ground], build_damage: 287, zone_s: 3.0, zone_tick_s: 1.0, zone_first_tick_now: true, zone_move_slow: 0.5, verified: true}

  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   load_time_s: SUPERSEDED 0.7 -> 0.8. Frozen-dump field. Wiki gives hit speed 1.3 / First Hit
  #     Speed 0.5 -> 0.8; dump says 0.7
  miner:
    display: "Miner"
    win_condition: true
    targets: any
    flags: [deploy_anywhere]   # TUNNELS: deployable on ANY tile incl. the defender's tower, so he skips the
                               # lane entirely. Without this the sim's bot drops him at the bridge like a
                               # Knight and the policy never trains on the scenario that actually happens.
    range: melee
    # L11 basis: the Miner's signature nerf. 39 = 20% of his 194 hit, per the wiki's balance history
    # (40% -> 35% on 3/3/2020, -> 30% on 4/8/2020, -> 25% on 4/4/2023, -> 20% on 6/7/2026) and
    # corroborated on Version History: "Miner: Tower Damage -17%" (25% x 0.83 = 20.75%).
    # WAS 78 -- the 40% figure from before the 3/3/2020 update, so the sim had him chipping at
    # DOUBLE the real rate: an ignored Miner took ~997 HP off a princess tower on the drill board
    # where the truth is about half that, which distorts his threat price, the value of answering
    # him, and any drill threshold scored on his damage.
    # NB the wiki's rendered stat table still reads crown_11 = 48 (the pre-6/7/2026 25% value); the
    # two history pages are the current source, not the table.
    crown_tower_damage: 39
                               # (wiki-style reduced value; USER VERIFY exact number). Without it the sim
                               # let him chip towers at full damage -> the king-snipe exploit.
    verified: false
    load_time_s: 0.8

  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   load_time_s: SUPERSEDED ABSENT -> 0.3. PRIORITY/gap: field absent from the KB row. The table
  #     publishes First Hit Speed 0.3, but that cell is part of the same stale pre-4/8/2026 row as
  #     Hit Speed, so it most likely tracks to 0.4
  x_bow:
    display: "X-Bow"
    win_condition: true
    targets: any
    flags: [ranged, siege]
    range: long
    deploy_time_s: 3.5        # wiki attr table: 0.3s hit / 0.3s load / 3.5s DEPLOY / 30s life
    verified: true            # 2026-08-15 wiki sweep (range 11.5, lifetime 30 already correct)
    load_time_s: 0.3

  mortar:
    display: "Mortar"
    win_condition: true
    targets: any
    flags: [splash, siege]
    splash_radius_tiles: 2.0  # wiki attr: shell area radius 2
    # 2026-08-15 wiki sweep: attr table publishes "3.5-11.5" range, 3.5 s deploy, 30 s life,
    # 5 s hit speed. The range table carried 3.5 -- the DEAD-ZONE minimum, not the reach --
    # so an opponent Mortar could never actually siege; a whole ladder archetype was a dud.
    range: long
    range_tiles: 11.5
    min_range_tiles: 3.5      # the blind spot: "preventing it from attacking enemies inside it"
    deploy_time_s: 3.5
    verified: true

  # THREE MUSKETEERS, the 3/11/2025 "Elite Musketeers" rework (R2 #8, owner-approved). The
  # imported row carried hp/hit_speed/count and NO damage, no range and no attacks at all, so a
  # 9-elixir card MEASURED 0 dps and could not hit air: build_spec gave dps 0.0, hit_dmg 0.0,
  # attacks_air False.
  #
  # ⚠ The history line reads "spawns three different troops called 'Elite Musketeers' that have
  # different damage statistics FROM THE MUSKETEER and a melee attack" -- "different" modifies
  # "from the Musketeer", NOT "from each other". The trio is three IDENTICAL bodies, so this is
  # NOT a `components` mixed squad (Goblin Gang / Rascals / Goblinstein). The page's own lead is
  # explicit: "It spawns three single-target, air-targeting, long-ranged, ground troops ... If
  # enemy troops are close to them, they switch to being single-target, ground-targeting, melee,
  # ground troops WITH THE SAME HITPOINTS and very high damage, and switch back to their ranged
  # form when enemies are far from them." One body, two ATTACK MODES -- see CardSpec.melee_dmg.
  #
  # Ranged Attack row: Range 6, Target Air & Ground, vardefine 'range dmg_11' = 204.
  # Melee Attack row:  Range "Melee: Long" (= 1.6 tiles, per Prince/Guards/P.E.K.K.A. whose rows
  #                    print "Melee: Long (1.6)"), Target Ground, vardefine 'melee dmg_11' = 314.
  # Shared: hp_11 883, atk_speed 1.3, Count x3, Medium (60) = 1.0 tiles/s.
  # NB the two damage vardefine NAMES CONTAIN SPACES, which is why the importer's
  # [A-Za-z0-9_]+ vardefine pattern silently found no damage for this page at all.
  three_musketeers:
    display: "Three Musketeers"
    win_condition: true
    targets: any
    flags: [ranged]
    range: long
    range_tiles: 6.0
    attacks: [air, ground]
    damage: 204
    hit_speed: 1.3
    melee_damage: 314
    melee_range_tiles: 1.6
    verified: true

  # royal_recruit = the SINGLE shielded troop spawned by Royal Delivery (and one of the
  # several individual recruits packed into the "royal_recruits" card). Its own class on
  # purpose; NOT the same as royal_recruits. Not in cards_stats.json, so fuller entry here.
  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   range_tiles: SUPERSEDED ABSENT -> 1.6. PRIORITY / MISSING FIELD on a sub-unit row. Sourced
  #     from the PARENT spell page Royal Delivery, section 'Royal Recruit Attributes' --
  #     royal_recruit has no wiki page of its own
  #   dps: SUPERSEDED ABSENT -> 102. PRIORITY / MISSING FIELD. Derived exactly as on the sibling
  #     row royal_recruits.dps (102), which matches
  royal_recruit:
    display: "Royal Recruit"
    # THE SINGLE recruit dropped by Royal Delivery -- NOT the six-body Royal Recruits card. Same
    # body, same stats (owner-confirmed 2026-08-20); only the count and the source differ, which is
    # why both entries are legitimate and neither is a duplicate of the other.
    #
    # STATS WERE MISSING, and that is not cosmetic: threat_value._bodies needs hitpoints, damage
    # and hit_speed, returned None without them, and ignore_cost_frac read that as "the tower
    # cannot resolve this on its own" -> INF -> must_answer at any cost. A single recruit was
    # therefore an infinite threat to every triage gate in the project, which is the same
    # "spend a card on a small threat" failure the triage tier exists to prevent.
    elixir: 1.5                   # ruling 29 (2026-08-27): was null -> silently 4. 
    kind: troop
    rarity: common
    hitpoints: 547
    damage: 133
    hit_speed: 1.3
    shield_hp: 240.0
    attacks: [ground]
    movement: ground
    speed: medium
    range: melee
    splash: false
    count: 1
    win_condition: false
    targets: any
    flags: [shield]
    evolution: null
    verified: true
    range_tiles: 1.6
    dps: 102

  mother_witch_hog:                # the cursed HOGS Mother Witch spawns (distinct from Royal Hogs) -- fast,
    display: "Mother Witch Hog"    # building-targeting; a spawned unit, NOT a deployable card (no elixir/stats in the KB)
    elixir: 1                     # ruling 29 (2026-08-27): was null -> silently 4. 
    kind: troop
    rarity: legendary
    attacks: [ground]
    movement: ground
    speed: very_fast
    range: melee
    splash: false
    count: 1
    win_condition: false           # a spawned harasser, not a deployed win condition -- but it DOES go for the tower
    targets: buildings_only
    flags: [building_targeting]
    hitpoints: 629
    damage: 53
    hit_speed: 1.2
    dps: 44
    range_tiles: 0.75
    speed_tiles: 2.0
    deploy_time: 0.2

  tesla:
    display: "Tesla"
    elixir: 4
    kind: building
    rarity: common
    attacks: [air, ground]
    movement: none
    speed: null
    range: short
    splash: false
    count: 1
    win_condition: false
    targets: any
    flags: [ranged, hides]
    evolution: {available: true, cycles: 2, effect: 'electric pulse on deploy and on every surfacing: damages and briefly stuns nearby enemies', gains: [stun, area_shock], hitpoints: 1182, damage: 220, hit_speed: 1.1, dps: 200, lifetime: 25, pulse_damage: 174, pulse_radius: 6, pulse_stun: 0.5}
    verified: true
    hitpoints: null
    damage: null
    hit_speed: null

  # I5 2026-08-26 -- adjudicated R2 ledger applied (research/sim_parity/decisions.md; row-by-row
  # provenance in research/sim_parity/ledger/i5_applied.jsonl).
  #   rarity: SUPERSEDED 'rare' -> 'common'. decisions.md 2026-08-26 R2 ADJUDICATION #5: bomber
  #     rarity = common
  #   evolution.available: SUPERSEDED ABSENT -> True. SYSTEMIC GATE BUG -- 10 of my 32 keys. The
  #     parent row has evolution:null while a fully populated bomber_evo row exists carrying the
  #     correct evo_cycles=2
  bomber:
    display: "Bomber"
    elixir: 2
    kind: troop
    rarity: common
    attacks: [ground]
    movement: ground
    speed: medium
    range: short
    splash: true
    count: 1
    win_condition: false
    targets: any
    flags: [ranged, splash, ground_only]

# Consumed by the live advisor path (vetoed pick / silent advisor) and the sim's
# doctrine prior, so both sides answer a push the same way. THE FIRST ROW FOR A
# THREAT KEY WINS: put hand-written overrides ABOVE the generated rows and they
# survive a regenerate.
#

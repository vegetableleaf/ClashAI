# PILOT2 (account 3, 10-31; owner): every change since CLXIII in one checkpoint, full speed stack. Base = pilot/ops/pilot.yaml
# (its header lists the changes vs succ48_x_s101); changes vs pilot.yaml, each named:
#  - init = B0-full v2 + ZERO target layers (pilot2/build_init.py; identity vs CLXIII in PILOT2.md): CLXIII NOLEAK's tensors +
#    the retrained full-history memory encoder (e_max 256 + board snapshot, xb_lock temperature fix, coupling 0, MEM_FULL.md s5)
#    + tgt_in / tgt_out / tgt_back all zero (TARGET_OBS.md M3); top level = B0's (rl incl. CLXIII's IW press head).
#  - memory_encoder_frozen false + memory_e_max 256 + memory_board_snap true (MEM_FULL.md s4/s5; owner: encoder not frozen).
#  - target_obs: on (TARGET_OBS.md M2; fast loop = CfTgt, exact 8/8).
#  - ability_head_from_init: true (keep CLXIII's press head; re-fit cost the old pilot -7.3 pp at u0).
#  - tau_phase REMOVED (owner 10-31: live has no per-phase threshold; the sampled gate T_gate 0.1 is centred on tau 0.35 at
#    every phase, = live --gate-sample with LIVE_OPTIONS' single tau). The learner seat runs NO decide rule (no SAMPLE_RULES
#    key = none; the fast decide refuses any). Owner 10-31 keeps only the lethal Log finisher live; see PILOT2.md for why it
#    is not a training key.
#  - speed stack (HANDOFF 10-30 21:10): mem_row_cache, split_attn, trunk_graph 256 (arm L overrides 1024), ppo_decoupled 2.0
#    (with fastloop --overlap 1); fastloop flags + env in pilot2/arm.sh.
#  - max_updates 600, save_every 10 (checks every 20), n_actors 2 + screen_entries 1 (the init screen is a reference only;
#    702 matches took 26 min on the A/B), fastloop block dropped (arm.sh's flags decide the loop shape).

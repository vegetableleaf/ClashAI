# LOOP-OPS pilot config (2026-10-28; pilot/LOOP_SPEC.md; rl_royale keys exactly, + the fastloop: block LOOP-INT strips before
# load_config). Base = stepd/cfg/succ48_x_s101.yaml (production crforge reference). Changes vs that file, each named:
#  - init = B0 GRAFTED (lead 10-28): CLXIII NOLEAK's 141 tensors unchanged + the S3-aux memory v2 encoder's 50 mem.* / mem_aux.*
#    tensors, coupling mem.out exactly 0 = icebow/data/bench/rl_royale/b0/b0_clxiii_s3aux_grafted.pt
#    sha256 76d786192f7e9c27ec1d71aa47d421b8ee09a4dee6f400471288d6cb396639a2 (LF memory_v2 meta; pilot/ops/build_b0.py; README).
#    Not a Mark (lead): the TRAINED pilot checkpoint gets ICEBOW Mark CLXV.
#  - memory v2 + memory_aux v1 + memory_encoder_frozen + memory_zero_empty (the 10-25 night arms' memory keys; plan R3 unfreezes).
#  - reward = R_win + tower-only Phi: shaping tower_phat (LOOP-LRN; reward_shaping.STATE_PHI_MODES, coefficients pending RX-X23),
#    shaping_critic_scale 1.5 (1 + phi bound .5); tower_crown weights, habit terms and their caps removed.
#  - batch 512 matches = E 128 x G 4 (LOOP-LRN).
#  - PPO = the plan's: gae, gamma_tick 0.99994, lambda 0.95, lr 1e-5, clip 0.2, critic warm-up 5; learner_deterministic (CUDA
#    deterministic on). KL early stop 0.02 vs the previous update = kl_stop_prev + kl_ref_refresh_every 1 with beta 0 (no leash;
#    owner 10-28 option A: 0.02 stays).
#  - learner (LOOP-LRN, owner / lead 10-28; pilot/lrn/LRN.md): stored_values (the producers' lp_old + v_old, the KL anchor
#    only on minibatch rows); lazy_refine (cell / tower refine features on the played rows only; identity gates run it OFF;
#    reversal criterion R1/R2 in LRN.md); ent_pair_every 4 (gate 10-28: paired ratio within 0.48% of all-minibatch; init baseline on every 4th epoch-0
#    minibatch, paired with the policy's on the same rows; replaces ent_init_rows / the full pass).
#  - opponents: frozen pool from LOOP-OPP's pilot/opp/POOL.json (PENDING; the league_* / league_exploiters / league_external
#    blocks below are x_s101's and get replaced from POOL.json); learner snapshot share 0 (league_mix latest / older 0,
#    league_snapshot_every above max_updates); screen_every above max_updates (no held-out actor pool in the loop).
#  - training decode = rl_royale's sampled decode (lead 10-28: fastloop.decode live DROPPED, rl_royale has no live decode;
#    training rollouts do not apply live's decide rules, as for CLXIII); the rl_royale decode keys (T, tau, tau_phase, decide_every) stay x_s101's; T_gate 0.3 -> 0.1 (lead 10-28: the pilot trains the
#    SAMPLED gate at T .1; live must decode the same way before trial30 -- no live option for that exists yet).
#  - E4 (rdef_e4 u20 grafted, 430faaee) = a 7th pool checkpoint (lead 10-28: equal share, not more; E4 is also an eval set);
#    league_pfsp_gamma 1e-9 = uniform over init + the 6 externals to 1e-8 (adaptive_opponents refuses gamma <= 0; at gamma 2 PFSP
#    up-weights the ones the learner loses to).
#  - w14opp_I keeps its own exploiter slot and calibrated decode (T .1, decide 20, tau .2, live decks) at share 0.125
#    (lead 10-28; x_s101: 0.3); init + 5 old externals + E4 split the other 7/8 uniformly -> 8 opponents at 12.5% each
#    (pre-run check: pilot/ops/pool_shares.py; verify in the first update's match log).
#  - crforge tables 16.635.3 (lead 10-28: the live client); the gate runs both models on the same tables + jars.
#  - seed 1028; max_updates 1000 (~512k matches, ~1.7 h at 300k matches/h); save_every 25 = the off-pod streaming interval.
#  - barrel_decoy_sim true (LOOP-DECOY 10-28): an evolved Goblin Barrel's real barrel is a Goblin Barrel token in flight and
#    its decoy is not, as live's --barrel-decoy on shows B0; the evolved Snowball is a Snowball token in flight, as live
#    lists it (CRFORGE_BARREL_DECOY_SIM=1; pipeline/crforge_core.py; the key name stays, gb_decoy/STATUS.md). Any
#    eval / gate run outside rl_royale (e1_eval, compare.py) must export CRFORGE_BARREL_DECOY_SIM=1 to see the same SIM.

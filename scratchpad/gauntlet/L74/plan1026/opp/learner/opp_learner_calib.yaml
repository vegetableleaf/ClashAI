# OPP-LEARN-C calibration run (plan1026/opp/OPP_LEARNER.md section "Calibration"): the P2 opponent (v1 _sim.pt via
# `init=`) RL'd for STRENGTH with a fixed pull lambda (`beta0=L beta_min=L beta_max=L`, L in {0.03, 0.1, 0.3}),
# timing + ability heads frozen, win-only reward; partners 60% bot = CLXIII in the deployed / pilot decode on icebow
# (league_exploiters, T .5, T_gate .1, tau .35, tau_phase), 40% the frozen human-model init at T 1 on census decks.
# Checkpoints every 5 updates carry opp / opp_sim / memory (e1_eval.load_policy plays them): each is scored by
# learner/calib_eval.sh (CLXIII SIM win rate + v6 level B quick stats). Stop = the first checkpoint with CLXIII 30-50%
# and quick stats at least as human as v1's start. kl_cell_stop 5.0: the guard's KL stop (always armed at a fixed
# beta) left only for runaways; the human-likeness check is the real stop. The rest = opp_learner_bot_smoke.yaml.
init: opp_ckpt/opp_m10_s0_sim.pt
pool: icebow/data/ghost_pool/pool_env_v1.jsonl
proagree_data: icebow/data/pipeline/s1_dataset.npz
proagree_rows: 0
proagree_data_gen: icebow/data/pipeline/gen_dataset_v32_fv5.npz
noise_off: all
opp_elixir: counter
action_delay_ticks: 26
extrapolate_ticks: 26
hero_abilities: true
ability_policy: v2
heroiw_press: live
forms_mode: deck
league: true
league_decks: icebow/data/rltest/decks_rl.json
league_specialist: icebow/data/models/ICEBOW/ICEBOW_Mark_CLXIII_NOLEAK.pt
league_opp_policy: sample
league_mix: {latest: 0.0, older: 0.0, init: 1.0, s1: 0.0}
league_snapshot_every: 100000
league_snapshot_keep: 4
league_icebow_share: 0.0
league_learner_icebow_share: 0.0
league_deck_alpha: 1.0
league_deck_floor: 0.0
E: 64
G: 4
adv_clip: 2.0
advantage: match_loo
shaping: none
n_actors: 48
in_flight: 8
actor_device: cpu
actor_threads: 1
actor_timeout_s: 3600
T: 1.0
tau: 0.35
afford_mask: true
stall_elixir: null
stall_seconds: 12
obs: live
decide_every: 10
learner_device: cpu
lr: 1.0e-5
grad_clip: 0.5
ppo_epochs: 2
minibatch: 256
clip: 0.2
beta0: 0.1
beta_min: 0.1
beta_max: 0.1
kl_target: 0.1
leash: max
freeze_heads: [timing, ability]
seed: 0
max_updates: 200
save_every: 5
proagree_every: 100000
screen_every: 100000
screen_entries: 0
screen_seeds: [0]
stop_consecutive: 2
plays_lo: 0.6
plays_hi: 1.6
kl_cell_stop: 5.0
kl_gate_stop: 0.1
tripwire_cell_pp: 1.0
hard_cell_pp: 3.0
hard_card_pp: 3.0
hard_gate_bal: 0.05
screen_stop_pp: -10.0
entropy_floor_frac: 0.5
outlived_pp: 15.0
low_delivered_pp: 10.0
ghost_refusal_x: 2.0
league_exploiters:
- {ckpt: icebow/data/models/ICEBOW/ICEBOW_Mark_CLXIII_NOLEAK.pt, decks: icebow, share: 0.6, T: 0.5, T_gate: 0.1, tau: 0.35,
   tau_phase: [0.35, 0.45, 0.55]}

# OPP-PUSH arm 2 (lead-approved 10-30: lever 3): = opp_learner_calib_live.yaml with ONE change: the advantage estimator.
# advantage gae (gamma .999 / lambda .95 defaults) with a critic on the opponent's (untrained) value head: 5 value-only warm-up
# updates, vf_trunk_grad false (the value loss trains only the value head, so the policy trunk sees the same gradients as
# match_loo's: PPO + the pull). Reward unchanged: win-only, shaping none (tower_phat for opponents = owner's call).
# PLATEAU.md next experiment (OPP-PLATEAU 10-30): = opp_learner_calib.yaml with the CLXIII partner on gap.py D3's
# LIVE_OPTIONS decision stack (fast-loop-supported subset; own_effects / afford_ticks / follow_up_taps / G2 taps are
# refused by producer.UNSUPPORTED_CFG and stay off) via league_frozen_opponent (100% CLXIII on icebow, = arm E's share)
# + league_opp_policy live + league_opp_live. Why: D3 opp-win = 0.05 + 0.51 x training win vs the sampled T .5
# partner (24 checkpoints, r .78): half of every training gain is lost against the stack D3 scores.
# OPP-LEARN-C calibration run (plan1026/opp/OPP_LEARNER.md section "Calibration"): the P2 opponent (v1 _sim.pt via
# `init=`) RL'd for STRENGTH with a fixed pull lambda (`beta0=L beta_min=L beta_max=L`, L in {0.03, 0.1, 0.3}),
# timing + ability heads frozen, win-only reward; partners 60% bot = CLXIII in the deployed / pilot decode on icebow
# (league_exploiters, T .5, T_gate .1, tau .35, tau_phase), 40% the frozen human-model init at T 1 on census decks.
# Checkpoints every 5 updates carry opp / opp_sim / memory (e1_eval.load_policy plays them): each is scored by
# learner/calib_eval.sh (CLXIII SIM win rate + v6 level B quick stats). Stop = the first checkpoint with CLXIII 30-50%
# and quick stats at least as human as v1's start. kl_cell_stop 5.0: the guard's KL stop (always armed at a fixed
# beta) left only for runaways; the human-likeness check is the real stop. The rest = opp_learner_bot_smoke.yaml.

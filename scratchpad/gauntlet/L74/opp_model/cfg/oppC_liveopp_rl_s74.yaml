# L74 opponent model, option C (NEXT iteration; NOT for tonight unless A and B are both done and a pod is idle):
# RL-strengthen the live-imitation net (O2b) against the frozen CURRENT learner, at all16, so the SIM opponent reaches live
# strength while staying human in style. = stage2/cfg/s2_all_il_sA.yaml (the Stage-2 imitation-init exploiter recipe) with:
#   init           -> the O2b live-imitation model (fill the chosen O2b checkpoint path before use)
#   frozen opponent -> Mark CLX grafted (the live model), live_levels all16 (Stage 2 trained at level 11)
#   decide_every 40 for the learner (= the opponent-to-be, its natural cadence, O3); opp_decide_every 10 for the frozen CLX
#   KL target 0.05 to the init (tighter than Stage 2's 0.1: stay human), 65 updates, snapshots every 5
# Gates (on the u15 / u30 / u45 / u65 snapshots, via opp_model/pod/opp_eval.sh, CLX learner, 480 games, T .1, decide 40):
#   stop at the FIRST snapshot with CLX SIM win <= 65% AND style distance <= 0.70 (o3_score.py) AND OT share <= live + 5 pp
#   AND both-took-a-princess >= 5% (the Stage-2 stall signature is OT 70%+ with both-took ~3%); none passes -> option C fails.

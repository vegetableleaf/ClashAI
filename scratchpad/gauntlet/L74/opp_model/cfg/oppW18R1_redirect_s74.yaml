# L74 W18 round R1 (dedicated pod 33401): I u40 continued fresh with I's recipe (= the I2 control, plateau 51.0 mean on block
# 741200 over u5-u30) + ONE change: princess_redirect: penalty (reward_terms; default w 0.2 per princess tower of OWN princess HP
# lost while both own princesses stand). The learner here is the OPPONENT-to-be, so the term charges it for the chip CLX's
# X-Bow / Rocket / troops take off its towers. Why (DIAG_12.md): the SIM opponent lets bridge X-Bows lock 58.8% vs 46.4% live
# (damage per X-Bow vs tank decks 0.306 vs 0.196), so CLX enters overtime ahead 41% vs 31% live; that chip race carries the
# win | OT, OT-before-drain and tank-deck (25.3% drain losses live vs 12.2%) gaps. Win-only RL pays for chip only through the
# drain; the potential form is policy-invariant (W6), the penalty form changes the optimum deliberately.

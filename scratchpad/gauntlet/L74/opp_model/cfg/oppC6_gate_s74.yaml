# L74 W7 round R6 (10-20): R4 u100 (ea1d0804, the READY opponent) + KL on the play / wait GATE anchored to the O2b
# live-imitation net (kl_ref_gate; card / cell stay anchored to the init = u100). Why: R4 reached the strength / crown cells but
# its style drifted to 0.74 through timing (react_s / react_3s / ppm_2x), while slowing it (R4k, R5) opened the games. The gate
# head decides WHEN to play; pulling only it back toward the human-timed net should restore style without slowing defence.
# Fresh run from u100 (critic_warmup 1: u100 carries a trained value head); screen_stop_pp -100 (R5: the ghost screen is not
# this model's gate); 40 updates; gated at T .1 / decide 40 (OPP_MODEL.md section 7).
# kl_target 0.1 -> 0.03: u100's gate starts at KL 0.08 from O2b, so a 0.1 target would never pull it back (beta only rises above it).
